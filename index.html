              📜 السجل (${roundHistory.length})
            </button>
          </div>
        `;

        container.innerHTML = `
          <div class="mafia-wrap">
            <div class="mafia-banner" style="padding:12px;">
              <h3>🎭 ${roundText}</h3>
              <p>الحكم: <strong>${this.escapeHtml(state.refereeName)}</strong> • المتبقون: <strong>${alivePlayers.length}</strong> • حالتك: <span class="m-badge ${safePublicStatus.cls}">${safePublicStatus.icon} ${safePublicStatus.text}</span></p>
            </div>

            ${playerTabsHtml}

            ${this.playerTab === "history" ? this.buildPublicRoundHistoryHtml(roundHistory) : `
              ${publicRoundBannerHtml}

              ${cardBoxHtml}

              <div class="mafia-panel">
                <div class="mafia-panel-title"><span>👥 حالة اللاعبين في الغرفة</span></div>
                ${publicPlayersList}
              </div>
            `}
          </div>
        `;
      },

      setPlayerTab(tabName) {
        this.playerTab = tabName;
        window.scrollTo(0, 0);
        if (latestRoomData) this.render(latestRoomData);
      },

      buildAllRolesRevealBox(room, state) {
        const sortedPlayers = this.sortPlayersByRoleOrder(this.getActivePlayersList(room, state), state);
        const assignments = state.assignments || {};
        const statuses = state.playerStatuses || {};

        const aliveList = sortedPlayers.filter(p => !(statuses[p.id] && statuses[p.id].isOut));
        const outList = sortedPlayers.filter(p => statuses[p.id] && statuses[p.id].isOut);

        const renderCard = (p, isOutPlayer) => {
          const asg = assignments[p.id] || { cardId: "AS", roleName: "—", order: null };
          const st = statuses[p.id] || { status: "active", isOut: false };
          const stInfo = this.getStatusInfo(st);
          const orderBadge = typeof asg.order === "number" ? `<span class="mafia-order-badge">#${asg.order}</span>` : "";
          const isMe = (p.id === currentPlayer.id);
          const outBadges = isOutPlayer
            ? `<span class="m-badge ${stInfo.cls}">${stInfo.icon} ${stInfo.text}</span><span class="m-badge m-badge-out">خارج اللعبة${st.outRound ? " (ج" + st.outRound + ")" : ""}</span>`
            : `<span class="m-badge ${stInfo.cls}">${stInfo.icon} ${stInfo.text}</span>`;

          return `
            <div class="mafia-ref-player-card ${isOutPlayer ? "is-spectator-out" : ""} ${isMe ? "is-me" : ""}">
              <div class="mafia-ref-player-top">
                <div class="mafia-ref-player-info">
                  ${this.renderCardSVG(asg.cardId, "sm")}
                  <div class="mafia-ref-player-text">
                    <span class="mafia-player-name">${this.escapeHtml(p.name)}</span>
                    <span class="mafia-player-role">${orderBadge} 🎭 ${this.escapeHtml(asg.roleName)}</span>
                    <div class="mafia-badges-row">${outBadges}</div>
                  </div>
                </div>
              </div>
            </div>
          `;
        };

        const statsHtml = `
          <div class="mafia-stats-bar">
            <div class="mafia-stat-box">
              <span class="mafia-stat-val">${state.currentRound || 0}</span>
              <span class="mafia-stat-lbl">رقم الجولة</span>
            </div>
            <div class="mafia-stat-box">
              <span class="mafia-stat-val done">${aliveList.length}</span>
              <span class="mafia-stat-lbl">المتبقون نشطين</span>
            </div>
            <div class="mafia-stat-box">
              <span class="mafia-stat-val warn">${outList.length}</span>
              <span class="mafia-stat-lbl">خارج اللعبة</span>
            </div>
          </div>
        `;

        const outSectionHtml = outList.length > 0 ? `
          <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);">
            <div style="font-size:0.82rem; color:#f87171; font-weight:800; margin-bottom:8px;">
              🚫 خارج اللعبة (${outList.length})
            </div>
            ${outList.map(p => renderCard(p, true)).join("")}
          </div>
        ` : "";

        return `
          ${statsHtml}
          <div class="mafia-spectator-box">
            <div class="mafia-panel-title">
              <span>👁️ كشف أدوار جميع المشاركين</span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:rgba(202,138,4,0.16); border:1px solid rgba(234,179,8,0.45); border-radius:8px; margin-bottom:10px;">
              <span class="with-whistle" style="font-weight:800; color:#fde047;">${getWhistleIcon("is-gold")} ${this.escapeHtml(state.refereeName)}</span>
              <span class="badge badge-host">الحكم</span>
            </div>
            ${aliveList.map(p => renderCard(p, false)).join("")}
            ${outSectionHtml}
          </div>
        `;
      },

      toggleMyCard() {
        this.isPlayerCardRevealed = !this.isPlayerCardRevealed;
        if (latestRoomData) this.render(latestRoomData);
      },

      /* =====================================================================
         عمليات الحكم على Firebase Firestore
         ===================================================================== */
      async distributeCardsRandomly() {
        window.scrollTo(0, 0);
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId) return;

        const activePlayers = this.getActivePlayersList(latestRoomData, state);
        const cards = (state.selectedCards || []).map((c, idx) => ({
          cardId: c.cardId,
          roleName: c.roleName,
          order: typeof c.order === "number" ? c.order : (idx + 1)
        }));

        if (activePlayers.length === 0 || activePlayers.length !== cards.length) {
          alert("عدد اللاعبين الفعليين لا يطابق عدد البطاقات المختارة!");
          return;
        }

        /* خلط عشوائي صارم (Fisher-Yates) مع الاحتفاظ برقم ترتيب الدور المحدد من المضيف */
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = cards[i];
          cards[i] = cards[j];
          cards[j] = tmp;
        }

        const assignments = {};
        const playerStatuses = {};
        activePlayers.forEach((p, idx) => {
          assignments[p.id] = {
            cardId: cards[idx].cardId,
            roleName: cards[idx].roleName,
            order: cards[idx].order
          };
          playerStatuses[p.id] = {
            status: "active",
            isOut: false,
            outReason: "",
            outRound: null
          };
        });

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "distributed",
            "gameState.assignments": assignments,
            "gameState.playerStatuses": playerStatuses,
            "gameState.currentRound": 0,
            "gameState.roundEvents": {},
            "gameState.votingSelection": [],
            "gameState.roundHistory": []
          });
        } catch (err) {
          alert("تعذر توزيع البطاقات: " + err.message);
        }
      },

      async startNextRound() {
        window.scrollTo(0, 0);
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId) return;

        const nextRound = (state.currentRound || 0) + 1;
        this.refereeTab = "board";
        this.activeKillPickerPlayerId = null;
        this.killPickerDraft = null;
        window.scrollTo(0, 0);

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "round_active",
            "gameState.currentRound": nextRound,
            "gameState.roundEvents": {},
            "gameState.votingSelection": []
          });
        } catch (err) {
          alert("تعذر بدء الجولة: " + err.message);

      handleClickKill(playerId) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        const rules = this.getRules(state);
        if (rules.extraKillerEnabled) {
          this.openKillPicker(playerId);
        } else {
          this.togglePlayerRoundAction(playerId, "killed");
        }
      },

      openKillPicker(playerId) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        const ev = (state.roundEvents || {})[playerId] || {};
        this.activeKillPickerPlayerId = playerId;
        const isKilled = Boolean(ev.killed || ev.killMafia || ev.killOther);
        this.killPickerDraft = {
          mafia: isKilled ? Boolean(ev.killMafia || (ev.killed && !ev.killOther)) : false,
          other: isKilled ? Boolean(ev.killOther) : false
        };
        this.render(latestRoomData);
      },

      toggleKillPickerDraft(source) {
        if (!this.killPickerDraft) return;
        this.killPickerDraft[source] = !this.killPickerDraft[source];
        if (latestRoomData) this.render(latestRoomData);
      },

      async confirmKillPicker(playerId) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        const currentEvents = JSON.parse(JSON.stringify(state.roundEvents || {}));
        if (!currentEvents[playerId]) {
          currentEvents[playerId] = { silenced: false, killed: false, killMafia: false, killOther: false, healed: false };
        }
        const draft = this.killPickerDraft || { mafia: false, other: false };
        const hasKill = Boolean(draft.mafia || draft.other);
        currentEvents[playerId].killMafia = Boolean(draft.mafia);
        currentEvents[playerId].killOther = Boolean(draft.other);
        currentEvents[playerId].killed = hasKill;

        this.activeKillPickerPlayerId = null;
        this.killPickerDraft = null;

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.roundEvents": currentEvents
          });
        } catch (err) {
          alert("تعذر حفظ خيار القتل: " + err.message);
        }
      },

      cancelKillPicker() {
        this.activeKillPickerPlayerId = null;
        this.killPickerDraft = null;
        if (latestRoomData) this.render(latestRoomData);
      },
      async toggleKillAction(playerId) {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "round_active") return;
        const st = (state.playerStatuses || {})[playerId];
        if (st && st.isOut) return;

        const currentEvents = JSON.parse(JSON.stringify(state.roundEvents || {}));
        if (!currentEvents[playerId]) {
          currentEvents[playerId] = { silenced: false, killed: false, killMafia: false, killOther: false, healed: false };
        }
        const ev = currentEvents[playerId];
        const rules = this.getRules(state);

        if (ev.killed) {
          // إلغاء القتل بالكامل وإخفاء الشريط المضيء
          ev.killed = false;
          ev.killMafia = false;
          ev.killOther = false;
        } else {
          // تفعيل القتل وإظهار الشريط المضيء بدون تحديد تلقائي مسبق
          ev.killed = true;
          ev.killMafia = false;
          ev.killOther = false;
        }

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.roundEvents": currentEvents
          });
        } catch (err) {
          alert("تعذر تحديث حالة القتل: " + err.message);
        }
      },

      async toggleKillChoice(playerId, choiceKey) {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "round_active") return;
        const st = (state.playerStatuses || {})[playerId];
        if (st && st.isOut) return;

        const currentEvents = JSON.parse(JSON.stringify(state.roundEvents || {}));
        if (!currentEvents[playerId]) {
          currentEvents[playerId] = { silenced: false, killed: false, killMafia: false, killOther: false, healed: false };
        }
        const ev = currentEvents[playerId];
        ev[choiceKey] = !ev[choiceKey];
        ev.killed = true;

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.roundEvents": currentEvents
          });
        } catch (err) {
          alert("تعذر حفظ الاختيار: " + err.message);
        }
      },
      async togglePlayerRoundAction(playerId, actionKey) {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "round_active") return;

        const st = (state.playerStatuses || {})[playerId];
        if (st && st.isOut) return;

        const rules = this.getRules(state);
        const currentEvents = JSON.parse(JSON.stringify(state.roundEvents || {}));
        if (!currentEvents[playerId]) {
          currentEvents[playerId] = { silenced: false, killed: false, killMafia: false, killOther: false, healed: false };
        }
        const ev = currentEvents[playerId];

        if (actionKey === "killed") {
          const isCurrentlyKilled = Boolean(ev.killed || ev.killMafia || ev.killOther);
          if (isCurrentlyKilled) {
            ev.killed = false;
            ev.killMafia = false;
            ev.killOther = false;
          } else {
            ev.killed = true;
            if (rules.extraKillerEnabled) {
              ev.killMafia = true;
              ev.killOther = false;
            } else {
              ev.killMafia = true;
              ev.killOther = false;
            }
          }
        } else {
          ev[actionKey] = !ev[actionKey];
        }

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.roundEvents": currentEvents
          });
        } catch (err) {
          alert("تعذر حفظ الإجراء: " + err.message);
        }
      },

      async toggleKillSource(playerId, source) {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "round_active") return;

        const st = (state.playerStatuses || {})[playerId];
        if (st && st.isOut) return;

        const currentEvents = JSON.parse(JSON.stringify(state.roundEvents || {}));
        if (!currentEvents[playerId]) {
          currentEvents[playerId] = { silenced: false, killed: false, killMafia: false, killOther: false, healed: false };
        }
        const ev = currentEvents[playerId];

        if (source === "mafia") {
          ev.killMafia = !ev.killMafia;
        } else if (source === "other") {
          ev.killOther = !ev.killOther;
        }
        ev.killed = Boolean(ev.killMafia || ev.killOther);

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.roundEvents": currentEvents
          });
        } catch (err) {
          alert("تعذر تحديث مصدر القتل: " + err.message);
        }

      async toggleVoteOutPlayer(playerId) {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "voting_elimination") return;

        const st = (state.playerStatuses || {})[playerId];
        if (st && st.isOut) return;

        const currentSel = [...(state.votingSelection || [])];
        const idx = currentSel.indexOf(playerId);
        if (idx !== -1) {
          currentSel.splice(idx, 1);
        } else {
          currentSel.push(playerId);
        }

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.votingSelection": currentSel
          });

      async confirmRoundTransition() {
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId || state.phase !== "voting_elimination") return;

        const roundNum = state.currentRound || 1;
        const evalRes = this.evaluateRoundEvents(latestRoomData, state);
        const votingSelection = state.votingSelection || [];
        const updatedStatuses = JSON.parse(JSON.stringify(state.playerStatuses || {}));

        const toEntry = p => ({ id: p.id, name: p.name });
        const silenced = evalRes.silencedList.map(toEntry);
        const silencedMafiaCancelled = evalRes.silencedMafiaPlayers.map(toEntry);
        const killedTargets = evalRes.killedTargetsAll.map(toEntry);
        const killedByMafia = evalRes.killedByMafiaList.map(toEntry);
        const killedByOther = evalRes.killedByOtherList.map(toEntry);
        const killedUnspecified = (evalRes.killedUnspecifiedList || []).map(toEntry);
        const healedTargets = evalRes.healedTargetsAll.map(toEntry);
        const savedByHeal = [];
        const eliminatedByKill = [];
        const eliminatedByVote = [];

        evalRes.alivePlayers.forEach(p => {
          const pe = evalRes.perPlayer[p.id] || {};
          const entry = toEntry(p);

          if (pe.saved) {
            savedByHeal.push(entry);
            if (votingSelection.includes(p.id)) {
              eliminatedByVote.push(entry);
              updatedStatuses[p.id] = {
                status: "voted_out",
                isOut: true,
                outReason: "voted_out",
                outRound: roundNum
              };
            } else {
              updatedStatuses[p.id] = {
                status: "healed_saved",
                isOut: false,
                outReason: "",
                outRound: null
              };
            }
          } else if (pe.dies) {
            eliminatedByKill.push(entry);
            updatedStatuses[p.id] = {
              status: "killed",
              isOut: true,
              outReason: "killed",
              outRound: roundNum
            };
          } else if (votingSelection.includes(p.id)) {
            eliminatedByVote.push(entry);
            updatedStatuses[p.id] = {
              status: "voted_out",
              isOut: true,
              outReason: "voted_out",
              outRound: roundNum
            };
          } else {
            updatedStatuses[p.id] = {
              status: "active",
              isOut: false,
              outReason: "",
              outRound: null
            };
          }
        });

        const remainingCount = this.getActivePlayersList(latestRoomData, state)
          .filter(p => !(updatedStatuses[p.id] && updatedStatuses[p.id].isOut)).length;

        const newHistoryEntry = {
          roundNumber: roundNum,
          timestamp: new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }),
          mafiaKillCancelled: Boolean(evalRes.mafiaKillCancelled),
          silenced: silenced,
          silencedMafiaCancelled: silencedMafiaCancelled,
          killedTargets: killedTargets,
          killedByMafia: killedByMafia,
          killedByOther: killedByOther,
          killedUnspecified: killedUnspecified,
          healedTargets: healedTargets,
          savedByHeal: savedByHeal,
          eliminatedByKill: eliminatedByKill,
          eliminatedByVote: eliminatedByVote,
          remainingCount: remainingCount
        };

        const updatedHistory = [...(state.roundHistory || []), newHistoryEntry];
        if (typeof this.activeKillPickerPlayerId !== "undefined") {
          this.activeKillPickerPlayerId = null;
          this.killPickerDraft = null;
        }

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "round_ready",
            "gameState.playerStatuses": updatedStatuses,
            "gameState.roundEvents": {},
            "gameState.votingSelection": [],
            "gameState.roundHistory": updatedHistory
          });
        } catch (err) {
          alert("تعذر تأكيد الانتقال للجولة التالية: " + err.message);
        }
      },

      async finishGame() {
        window.scrollTo(0, 0);
        if (!latestRoomData) return;
        const state = latestRoomData.gameState || {};
        if (currentPlayer.id !== state.refereeId) return;
        if (!confirm("هل أنت متأكد من إنهاء المباراة وكشف جميع الأدوار لجميع اللاعبين؟")) return;

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "game_over"
          });
        } catch (err) {
          alert("تعذر إنهاء المباراة: " + err.message);
        }
      },


      /* =====================================================================
         مؤقت النقاش المحلي الخاص بالحكم (لا يظهر للاعبين)
         ===================================================================== */
      initTimerPrefs() {
        if (this.timer.initialized) return;
        this.timer.initialized = true;
        try {
          const savedSec = parseInt(localStorage.getItem("eshrah_mafia_timer_sec"), 10);
          if (!isNaN(savedSec) && savedSec >= 5 && savedSec <= 600) {
            this.timer.duration = savedSec;
            this.timer.remaining = savedSec;
          }
          const savedSound = localStorage.getItem("eshrah_mafia_timer_sound");
          if (savedSound === "0") {
            this.timer.soundEnabled = false;
          }
        } catch (e) {}
      },

      saveTimerPrefs() {
        try {
          localStorage.setItem("eshrah_mafia_timer_sec", String(this.timer.duration));
          localStorage.setItem("eshrah_mafia_timer_sound", this.timer.soundEnabled ? "1" : "0");
        } catch (e) {}
      },

      formatTimerText(sec) {
        const s = Math.max(0, Math.floor(sec));
        const mins = Math.floor(s / 60);
        const rem = s % 60;
        return String(mins).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
      },

      getTimerStateLevel() {
        if (this.timer.finished || this.timer.remaining <= 0) return "danger";
        if (this.timer.isRunning || this.timer.remaining < this.timer.duration) {
          if (this.timer.remaining <= 5) return "danger";
          if (this.timer.remaining <= 10) return "warn";
          return "running";
        }
        return "idle";
      },

      getTimerTriggerLabel() {
        this.initTimerPrefs();
        if (this.timer.finished) return "⏱️ انتهى!";
        if (this.timer.isRunning || this.timer.remaining < this.timer.duration) {
          return `⏱️ ${this.timer.remaining}ث`;
        }
        return "⏱️ مؤقت";
      },

      getTimerTriggerClass() {
        const lvl = this.getTimerStateLevel();
        if (lvl === "danger") return "timer-danger";
        if (lvl === "warn") return "timer-warn";
        if (lvl === "running") return "timer-running";
        return "";
      },

      updateTimerTriggerBtn() {
        const btn = document.getElementById("mafia-timer-trigger-btn");
        if (!btn) return;
        btn.innerText = this.getTimerTriggerLabel();
        btn.className = "mafia-tab-btn mafia-timer-trigger " + this.getTimerTriggerClass();
      },

        const presets = [20, 30, 45, 60, 90].map(sec => `

            ${sec}ث

        modal.innerHTML = `
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
              <h3>⏱️ مؤقت النقاش للحكم</h3>
              <div style="display:flex; align-items:center; gap:6px;">
                <button type="button" id="mafia-timer-sound-btn" class="mafia-timer-sound-btn" onclick="MafiaGame.toggleTimerSound()" title="الصوت">🔊</button>
                <button type="button" class="modal-close-btn" onclick="MafiaGame.closeTimerModal()">✕</button>
              </div>
            </div>

            <div class="mafia-timer-box">
              <div id="mafia-timer-display" class="mafia-timer-display">00:30</div>

              <div class="mafia-timer-progress-wrap">
                <div id="mafia-timer-progress" class="mafia-timer-progress-bar"></div>
              </div>

              <div id="mafia-timer-ended" class="mafia-timer-ended-badge">⏰ انتهى الوقت!</div>

              <div>
                <div style="font-size:0.76rem; color:var(--text-muted); margin-bottom:6px;">مدة سريعة لكل متحدث:</div>
                <div class="mafia-timer-presets">${presets}</div>
              </div>

              <div class="mafia-timer-custom-row">
                <button type="button" class="mafia-timer-step-btn" onclick="MafiaGame.adjustTimerSeconds(-5)">-5</button>
                <input type="number" id="mafia-timer-custom-input" class="mafia-timer-custom-input" min="5" max="600" value="30" onchange="MafiaGame.onCustomTimerInput(this.value)" />
                <span style="font-size:0.82rem; color:var(--text-muted);">ثانية</span>
                <button type="button" class="mafia-timer-step-btn" onclick="MafiaGame.adjustTimerSeconds(5)">+5</button>
              </div>

              <div class="mafia-timer-controls">
                <button type="button" class="btn mafia-btn-gold" onclick="MafiaGame.restartTimerForNext()">
                  🔄 إعادة للشخص التالي
                </button>
                <div class="mafia-timer-controls-row">
                  <button type="button" id="mafia-timer-toggle-btn" class="btn mafia-btn-emerald" onclick="MafiaGame.toggleTimerRun()">
                    ▶️ بدء
                  </button>
                  <button type="button" class="btn btn-secondary" style="margin-top:0;" onclick="MafiaGame.resetTimer()">

      },

      openTimerModal() {
        this.initTimerPrefs();
        const modal = this.ensureTimerModal();
        this.timer.isOpen = true;
        modal.classList.add("active");
        this.updateTimerModalUI();
      },

      closeTimerModal() {
        const modal = document.getElementById("mafia-timer-modal");
        if (modal) modal.classList.remove("active");
        this.timer.isOpen = false;
        this.updateTimerTriggerBtn();
      },

      stopAndHideTimer() {
        if (this.timer.intervalId) {
          clearInterval(this.timer.intervalId);
          this.timer.intervalId = null;
        }
        this.timer.isRunning = false;
        this.timer.finished = false;
        this.timer.remaining = this.timer.duration;
        const modal = document.getElementById("mafia-timer-modal");
        if (modal) modal.classList.remove("active");
        this.timer.isOpen = false;
      },

      unlockTimerAudio() {
        if (!this.timer.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.timer.audioCtx) {
            this.timer.audioCtx = new AudioCtx();
          }
          if (this.timer.audioCtx.state === "suspended") {
            this.timer.audioCtx.resume();
          }
        } catch (e) {}
      },

      playTimerBeep() {
        if (!this.timer.soundEnabled) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.timer.audioCtx) {
            this.timer.audioCtx = new AudioCtx();
          }
          const ctx = this.timer.audioCtx;
          if (ctx.state === "suspended") ctx.resume();

          const now = ctx.currentTime;
          [0, 0.24].forEach((offset, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(idx === 0 ? 880 : 1046, now + offset);
            gain.gain.setValueAtTime(0.001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.22, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.19);
          });
        } catch (e) {}
      },

      setTimerPreset(seconds) {
        this.initTimerPrefs();
        const clean = Math.max(5, Math.min(600, parseInt(seconds, 10) || 30));
        if (this.timer.intervalId) {
          clearInterval(this.timer.intervalId);
          this.timer.intervalId = null;
        }
        this.timer.duration = clean;
        this.timer.remaining = clean;
        this.timer.isRunning = false;
        this.timer.finished = false;
        this.saveTimerPrefs();
        this.updateTimerModalUI();
        this.updateTimerTriggerBtn();
      },

      adjustTimerSeconds(delta) {
        this.initTimerPrefs();
        this.setTimerPreset(this.timer.duration + delta);
      },

      onCustomTimerInput(val) {
        const parsed = parseInt(val, 10);
        if (!isNaN(parsed)) {
          this.setTimerPreset(parsed);
        } else {
          this.updateTimerModalUI();
        }
      },

      toggleTimerRun() {
        this.initTimerPrefs();
        this.unlockTimerAudio();

        if (this.timer.isRunning) {
          if (this.timer.intervalId) {
            clearInterval(this.timer.intervalId);
            this.timer.intervalId = null;
          }
          this.timer.isRunning = false;
        } else {
          if (this.timer.remaining <= 0) {
            this.timer.remaining = this.timer.duration;
          }
          this.timer.finished = false;
          this.timer.isRunning = true;
          if (this.timer.intervalId) clearInterval(this.timer.intervalId);
          this.timer.intervalId = setInterval(() => this.tickTimer(), 1000);
        }
        this.updateTimerModalUI();
        this.updateTimerTriggerBtn();
      },

      /* إعادة الوقت للمدة المحددة وبدء العد فوراً للشخص التالي بنقرة واحدة */
      restartTimerForNext() {
        this.initTimerPrefs();
        this.unlockTimerAudio();
        if (this.timer.intervalId) {
          clearInterval(this.timer.intervalId);
          this.timer.intervalId = null;
        }
        this.timer.remaining = this.timer.duration;
        this.timer.finished = false;
        this.timer.isRunning = true;
        this.timer.intervalId = setInterval(() => this.tickTimer(), 1000);
        this.updateTimerModalUI();
        this.updateTimerTriggerBtn();
      },

      resetTimer() {
        this.initTimerPrefs();
        if (this.timer.intervalId) {
          clearInterval(this.timer.intervalId);
          this.timer.intervalId = null;
        }
        this.timer.remaining = this.timer.duration;
        this.timer.isRunning = false;
        this.timer.finished = false;
        this.updateTimerModalUI();
        this.updateTimerTriggerBtn();
      },

      toggleTimerSound() {
        this.initTimerPrefs();
        this.timer.soundEnabled = !this.timer.soundEnabled;
        if (this.timer.soundEnabled) this.unlockTimerAudio();
        this.saveTimerPrefs();
        this.updateTimerModalUI();
      },

      tickTimer() {
        if (!this.timer.isRunning) return;
        this.timer.remaining -= 1;

        if (this.timer.remaining <= 0) {
          this.timer.remaining = 0;
          this.timer.isRunning = false;
          this.timer.finished = true;
          if (this.timer.intervalId) {
            clearInterval(this.timer.intervalId);
            this.timer.intervalId = null;
          }
          this.playTimerBeep();
          if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
            try { navigator.vibrate([220, 100, 220]); } catch (e) {}
          }
        }

        this.updateTimerModalUI();
        this.updateTimerTriggerBtn();
      },

      updateTimerModalUI() {
        const modal = document.getElementById("mafia-timer-modal");
        if (!modal) return;

        const disp = document.getElementById("mafia-timer-display");
        const prog = document.getElementById("mafia-timer-progress");
        const ended = document.getElementById("mafia-timer-ended");
        const toggleBtn = document.getElementById("mafia-timer-toggle-btn");
        const soundBtn = document.getElementById("mafia-timer-sound-btn");
        const customInput = document.getElementById("mafia-timer-custom-input");

        const lvl = this.getTimerStateLevel();
        const colorCls = (lvl === "danger") ? "danger" : (lvl === "warn" ? "warn" : "");

        if (disp) {
          disp.innerText = this.formatTimerText(this.timer.remaining);
          disp.className = "mafia-timer-display " + colorCls;
        }
        if (prog) {
          const pct = this.timer.duration > 0 ? Math.max(0, Math.min(100, (this.timer.remaining / this.timer.duration) * 100)) : 0;
          prog.style.width = pct + "%";
          prog.className = "mafia-timer-progress-bar " + colorCls;
        }
        if (ended) {
          ended.className = "mafia-timer-ended-badge" + (this.timer.finished ? " show" : "");
        }
        if (toggleBtn) {
          if (this.timer.isRunning) {
            toggleBtn.innerText = "⏸️ إيقاف مؤقت";
            toggleBtn.className = "btn mafia-btn-crimson";
          } else {
            toggleBtn.innerText = "▶️ بدء";
            toggleBtn.className = "btn mafia-btn-emerald";
          }
        }
        if (soundBtn) {
          soundBtn.innerText = this.timer.soundEnabled ? "🔊" : "🔇";
          soundBtn.title = this.timer.soundEnabled ? "كتم الصوت" : "تشغيل الصوت";
        }
        if (customInput && document.activeElement !== customInput) {
          customInput.value = this.timer.duration;
        }

        modal.querySelectorAll(".mafia-timer-preset-btn").forEach(btn => {
          const sec = parseInt(btn.getAttribute("data-sec"), 10);
          btn.classList.toggle("active", sec === this.timer.duration);
        });
      },

      async restartNewMatch() {
        window.scrollTo(0, 0);
        if (!currentPlayer.isHost) return;
        this.hostDraft = {
          roomCode: currentRoomCode,
          refereeId: "",
          selectedCards: [],
          silenceCancelsMafiaKill: false,
          extraKillerEnabled: false
        };
        this.activeKillPickerPlayerId = null;
        this.killPickerDraft = null;
        this.saveHostDraftLocal();
        window.scrollTo(0, 0);
        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            gameState: {
              phase: "setup",
              refereeId: "",
              refereeName: "",
              selectedCards: [],
              assignments: {},
              playerStatuses: {},
              currentRound: 0,
              roundEvents: {},
              votingSelection: [],
              roundHistory: []
            }
          });
        } catch (err) {
          alert("تعذر إعادة الإعداد: " + err.message);
        }
      }
    };
    /* === MAFIA_END === */
  
    /* =====================================================================
       استعادة الجلسة والغرفة تلقائياً عند إعادة تحميل الصفحة (Refresh)
       ===================================================================== */
    /* =====================================================================
       إدارة السمة (الوضع الفاتح افتراضياً مع زر التبديل للداكن وحفظ التفضيل محلياً)
       ===================================================================== */
    function applyTheme(theme) {
      const isLight = (theme !== "dark");
      document.body.classList.toggle("theme-light", isLight);
      document.querySelectorAll(".theme-toggle-btn").forEach(btn => {
        btn.innerText = isLight ? "🌙" : "☀️";
        btn.title = isLight ? "التبديل إلى الوضع الداكن" : "التبديل إلى الوضع الفاتح";
      });
    }

    function toggleTheme() {
      const currentlyLight = document.body.classList.contains("theme-light");
      const nextTheme = currentlyLight ? "dark" : "light";
      try {
        localStorage.setItem("gamehub_theme", nextTheme);
      } catch (e) {}
      applyTheme(nextTheme);
    }

    (function initSavedTheme() {
      let saved = "light";
      try {
        const stored = localStorage.getItem("gamehub_theme");
        if (stored === "dark" || stored === "light") saved = stored;
      } catch (e) {}
      applyTheme(saved);
    })();

    (function autoReconnectOnLoad() {
      const activeRoom = sessionStorage.getItem("gamehub_active_room");
      if (activeRoom) {
        currentRoomCode = activeRoom;
        const homeScreen = document.getElementById("screen-home");
        if (homeScreen) homeScreen.classList.remove("active");

        setupPresence(activeRoom, currentPlayer.id);
        listenToRoom(activeRoom);
      }
    })();

  </script>

        if (typeof window.resetApp === "function" && !window.resetApp.__devHooked) {
          const orig = window.resetApp;

            if (originalPlayer) {

            const res = orig.apply(this, arguments);
            originalPlayer = null;
            updateHandleVisibility();
            return res;

          window.resetApp.__devHooked = true;

        if (typeof window.leaveRoom === "function" && !window.leaveRoom.__devHooked) {
          const orig = window.leaveRoom;
          window.leaveRoom = async function () {
            if (originalPlayer && typeof currentPlayer !== "undefined" && currentPlayer.id !== originalPlayer.id) {

              await removeTestPlayer(currentPlayer.id);

      if (document.readyState === "loading") {

  <script>
    /* === PLATFORM_V357_POPUP_HOST_LOBBY_AND_SYSTEM_BARS === */
    (function () {
      if (window.__ashrahV357Initialized) return;
      window.__ashrahV357Initialized = true;

      /* =====================================================================
         1) زر «العودة إلى الغرفة» داخل لوحة أعضاء اللعبة للمضيف (دائم وبالأحمر)
         ===================================================================== */
      let popupConfirmTimer = null;

      function ensurePopupHostLobbyEl() {
        const modal = document.getElementById("player-status-popup");
        if (!modal) return null;
        const content = modal.querySelector(".modal-content");
        if (!content) return null;

        let wrap = document.getElementById("popup-host-lobby-wrap");

              <span class="popup-host-lobby-confirm-text">تأكيد العودة للغرفة؟</span>
              <div class="popup-host-lobby-confirm-actions">
                <button type="button" class="return-confirm-icon-btn is-yes" onclick="confirmPopupReturnToLobby()" title="تأكيد العودة للغرفة" aria-label="تأكيد">✓</button>

              </div>

      function cancelPopupConfirm() {
        clearTimeout(popupConfirmTimer);
        popupConfirmTimer = null;
        const btn = document.getElementById("popup-host-lobby-btn");
        const box = document.getElementById("popup-host-lobby-confirm");
        if (btn) btn.style.display = "";
        if (box) box.classList.remove("is-open");

        if (typeof currentPlayer === "undefined" || !currentPlayer || !currentPlayer.isHost) return;
        const btn = document.getElementById("popup-host-lobby-btn");
        const box = document.getElementById("popup-host-lobby-confirm");
        if (!btn || !box) {
          window.confirmPopupReturnToLobby();
          return;
        }
        btn.style.display = "none";
        box.classList.add("is-open");
        clearTimeout(popupConfirmTimer);
        popupConfirmTimer = setTimeout(cancelPopupConfirm, 5000);
      };

      window.cancelPopupReturnLobbyConfirm = cancelPopupConfirm;

      window.confirmPopupReturnToLobby = async function () {
        cancelPopupConfirm();
        const modal = document.getElementById("player-status-popup");
        if (modal) modal.classList.remove("active");
        try {
          if (typeof isPlayerStatusPopupOpen !== "undefined") {
            isPlayerStatusPopupOpen = false;
          }
        } catch (e) {}
        if (typeof returnToLobby === "function") {
          await returnToLobby();
        }
      };

      function syncPopupHostLobbyButton(room) {
        const wrap = ensurePopupHostLobbyEl();
        if (!wrap) return;
        const activeRoom = room || (typeof latestRoomData !== "undefined" ? latestRoomData : null);
        const isHost = Boolean(typeof currentPlayer !== "undefined" && currentPlayer && currentPlayer.isHost);
        const isInGame = Boolean(activeRoom && activeRoom.status === "in_game");
        const shouldShow = Boolean(isHost && isInGame);
        wrap.classList.toggle("is-visible", shouldShow);
        if (!shouldShow) {
          cancelPopupConfirm();
        }
      }

      /* =====================================================================
         2) تلوين الحواف العلوية والسفلية (شريط الإشعارات وأزرار التنقل)
            تلقائياً لتطابق لون خلفية الشاشة واللعبة الحالية في المتصفح والـ APK
         ===================================================================== */
      const SYSTEM_BAR_THEMES = {
        home_light:      { top: "#faf2db", bottom: "#f0eadc", isLight: true },
        home_dark:       { top: "#151418", bottom: "#0b0e15", isLight: false },
        bra_salfa_light: { top: "#d4fae7", bottom: "#e7f4ec", isLight: true },
        bra_salfa_dark:  { top: "#081f14", bottom: "#06130d", isLight: false },
        mafia_light:     { top: "#fee2e2", bottom: "#f5eaec", isLight: true },
        mafia_dark:      { top: "#22090e", bottom: "#13060a", isLight: false },
        codenames_light: { top: "#dbeafe", bottom: "#e5eef9", isLight: true },
        codenames_dark:  { top: "#0a1933", bottom: "#060e20", isLight: false }
      };

      let lastAppliedBarKey = "";

      function resolveSystemBarPalette() {
        const isLight = Boolean(document.body && document.body.classList.contains("theme-light"));
        const mode = isLight ? "light" : "dark";
        const gameScreen = document.getElementById("screen-game");
        const inGame = Boolean(gameScreen && gameScreen.classList.contains("active"));

        let context = "home";
        if (inGame) {
          const topBar = gameScreen.querySelector(".game-top-bar");
          if (
            (topBar && topBar.classList.contains("game-theme-bra_salfa")) ||
            gameScreen.querySelector(".bra-wrap") ||
            (typeof latestRoomData !== "undefined" && latestRoomData && latestRoomData.selectedGame === "bra_salfa")
          ) {
            context = "bra_salfa";
          } else if (
            (topBar && topBar.classList.contains("game-theme-mafia")) ||
            gameScreen.querySelector(".mafia-wrap") ||
            (typeof latestRoomData !== "undefined" && latestRoomData && latestRoomData.selectedGame === "mafia")
          ) {
            context = "mafia";
          } else if (
            (topBar && topBar.classList.contains("game-theme-codenames")) ||
            gameScreen.querySelector("#cn-root") ||
            (typeof latestRoomData !== "undefined" && latestRoomData && latestRoomData.selectedGame === "codenames")
          ) {
            context = "codenames";
          }
        }

        const key = context + "_" + mode;
        return { key, palette: SYSTEM_BAR_THEMES[key] || SYSTEM_BAR_THEMES.home_light };
      }

      window.setAshrahSafeInsets = function (topPx, bottomPx) {
        try {
          const root = document.documentElement;
          if (!root) return;
          if (typeof topPx === "number" && !isNaN(topPx) && topPx >= 0) {
            root.style.setProperty("--ashrah-safe-top", Math.round(topPx) + "px");

          if (typeof bottomPx === "number" && !isNaN(bottomPx) && bottomPx >= 0) {
            root.style.setProperty("--ashrah-safe-bottom", Math.round(bottomPx) + "px");
          }
        } catch (e) {}
      };

      function applySystemBarsTheme(force) {
        const resolved = resolveSystemBarPalette();
        const key = resolved.key;
        const p = resolved.palette;
        if (!force && lastAppliedBarKey === key) return;
        lastAppliedBarKey = key;

        try {
          const root = document.documentElement;
          if (root) {
            root.style.setProperty("--ashrah-sys-top", p.top);
            root.style.setProperty("--ashrah-sys-bottom", p.bottom);
            root.style.backgroundColor = p.bottom;
          }

          let meta = document.getElementById("ashrah-theme-color") || document.querySelector('meta[name="theme-color"]');
          if (!meta && document.head) {
            meta = document.createElement("meta");
            meta.id = "ashrah-theme-color";
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          if (meta) {
            meta.setAttribute("content", p.top);
          }
        } catch (e) {}

        /* 1) الجسر الأصلي المخصّص لتطبيق APK (يلوّن الشريط العلوي والسفلي وأيقوناتهما فوراً) */
        try {
          if (window.AshrahSystemBars && typeof window.AshrahSystemBars.setColors === "function") {
            window.AshrahSystemBars.setColors(p.top, p.bottom, Boolean(p.isLight));
          }
        } catch (e) {}

        /* 2) دعم إضافي تلقائي لبلجن Capacitor StatusBar إن كان مثبّتاً في الحزمة */
        try {
          const cap = window.Capacitor;
          const statusBar = cap && cap.Plugins && cap.Plugins.StatusBar;
          if (statusBar) {
            if (typeof statusBar.setBackgroundColor === "function") {
              statusBar.setBackgroundColor({ color: p.top });
            }
            if (typeof statusBar.setStyle === "function") {
              statusBar.setStyle({ style: p.isLight ? "LIGHT" : "DARK" });
            }
          }
        } catch (e) {}
      }

      window.syncAshrahSystemBars = function () {
        applySystemBarsTheme(true);
      };

      function hookAllV357() {
        ensurePopupHostLobbyEl();

        if (typeof window.renderPlayerStatusPopupContent === "function" && !window.renderPlayerStatusPopupContent.__v357Wrapped) {
          const origRenderPopup = window.renderPlayerStatusPopupContent;
          const wrappedPopup = function (room) {
            const res = origRenderPopup.apply(this, arguments);
            syncPopupHostLobbyButton(room);
            return res;
          };
          wrappedPopup.__v357Wrapped = true;
          window.renderPlayerStatusPopupContent = wrappedPopup;
        }

        if (typeof window.togglePlayerStatusPopup === "function" && !window.togglePlayerStatusPopup.__v357Wrapped) {
          const origToggle = window.togglePlayerStatusPopup;
          const wrappedToggle = function () {
            const res = origToggle.apply(this, arguments);
            const modal = document.getElementById("player-status-popup");

            } else {
              cancelPopupConfirm();
            }
            return res;
          };
          wrappedToggle.__v357Wrapped = true;
          window.togglePlayerStatusPopup = wrappedToggle;
        }

        if (typeof window.applyTheme === "function" && !window.applyTheme.__v357Wrapped) {
          const origApplyTheme = window.applyTheme;
          const wrappedTheme = function () {
            const res = origApplyTheme.apply(this, arguments);
            applySystemBarsTheme(true);
            return res;
          };
          wrappedTheme.__v357Wrapped = true;
          window.applyTheme = wrappedTheme;
        }

        if (typeof window.showScreen === "function" && !window.showScreen.__v357Wrapped) {
          const origShowScreen = window.showScreen;
          const wrappedShow = function () {
            const res = origShowScreen.apply(this, arguments);
            applySystemBarsTheme(false);
            return res;
          };
          wrappedShow.__v357Wrapped = true;
          window.showScreen = wrappedShow;
        }

        if (typeof window.renderGameScreen === "function" && !window.renderGameScreen.__v357Wrapped) {
          const origRenderGame = window.renderGameScreen;
          const wrappedGame = function () {
            const res = origRenderGame.apply(this, arguments);
            applySystemBarsTheme(false);
            return res;
          };
          wrappedGame.__v357Wrapped = true;
          window.renderGameScreen = wrappedGame;
        }

        /* مراقبة تغيّر السمة أو الشاشة النشطة أو ثيم رأس اللعبة لضمان تطابق فوري 100% */
        if (typeof MutationObserver === "function" && !window.__ashrahSysBarsObserver) {
          const obs = new MutationObserver(() => applySystemBarsTheme(false));
          if (document.body) {
            obs.observe(document.body, { attributes: true, attributeFilter: ["class"] });
          }
          ["screen-home", "screen-lobby", "screen-game"].forEach(id => {
            const el = document.getElementById(id);
            if (el) obs.observe(el, { attributes: true, attributeFilter: ["class"] });
          });
          const topBar = document.querySelector("#screen-game .game-top-bar");
          if (topBar) {
            obs.observe(topBar, { attributes: true, attributeFilter: ["class"] });
          }
          window.__ashrahSysBarsObserver = obs;
        }

        applySystemBarsTheme(true);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", hookAllV357);
      } else {
        hookAllV357();
      }
      window.addEventListener("pageshow", () => applySystemBarsTheme(true));
      setTimeout(() => applySystemBarsTheme(true), 250);
    })();
  </script>

      let dlPct = 0;
      let dlLoaded = 0;
      let dlTotal = -1;
      let dlErrorMsg = "";

      function escHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function formatMb(bytes) {
        if (!bytes || bytes < 0) return "";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      }

      function parseVersionParts(text) {
        const m = String(text || "").match(/v?([0-9]+(?:\.[0-9]+)*)/i);
        if (!m) return [];
        return m[1].split(".").map((n) => parseInt(n, 10) || 0);
      }

      function parseBuildNumber(text) {
        const m = String(text || "").match(/-b([0-9]+)/i);
        return m ? (parseInt(m[1], 10) || 0) : 0;
      }

      function compareVersionParts(a, b) {
        const maxLen = Math.max(a.length, b.length);
        for (let i = 0; i < maxLen; i++) {
          const av = a[i] || 0;
          const bv = b[i] || 0;
          if (av > bv) return 1;
          if (av < bv) return -1;
        }
        return 0;
      }

      function getLocalAppInfo() {
        let verStr = "";
        let buildCode = 0;

        try {
          if (window.AshrahSystemBars) {
            if (typeof window.AshrahSystemBars.getAppVersionName === "function") {
              verStr = String(window.AshrahSystemBars.getAppVersionName() || "").trim();
            }
            if (typeof window.AshrahSystemBars.getAppBuildCode === "function") {
              buildCode = parseInt(window.AshrahSystemBars.getAppBuildCode(), 10) || 0;
            }
          }
        } catch (e) {}

        if (!verStr) {
          const footer = document.querySelector(".app-footer");
          const txt = footer ? (footer.textContent || "") : "";
          const m = txt.match(/v([0-9]+(?:\.[0-9]+)*)/i);
          if (m) verStr = m[1];
        }

        return {
          versionText: verStr || "0.0",
          versionParts: parseVersionParts(verStr || "0.0"),
          buildCode: buildCode
        };
      }

      function isHomeOrLobbyActive() {
        const home = document.getElementById("screen-home");
        const lobby = document.getElementById("screen-lobby");
        return Boolean(
          (home && home.classList.contains("active")) ||
          (lobby && lobby.classList.contains("active"))
        );
      }

      function getDismissedTag() {
        try {
          return window.sessionStorage ? (window.sessionStorage.getItem(DISMISSED_KEY) || "") : "";
        } catch (e) {
          return "";
        }
      }

      function setDismissedTag(tag) {
        try {
          if (window.sessionStorage) window.sessionStorage.setItem(DISMISSED_KEY, String(tag || ""));
        } catch (e) {}
      }

      function hasNativeInAppDownloader() {
        try {
          return Boolean(
            window.AshrahSystemBars &&
            typeof window.AshrahSystemBars.downloadAndInstallApk === "function"
          );
        } catch (e) {
          return false;
        }
      }

      function openExternalDownload(url) {
        const targetUrl = String(url || FALLBACK_APK_URL).trim();
        try {
          if (window.AshrahSystemBars && typeof window.AshrahSystemBars.openExternalUrl === "function") {
            window.AshrahSystemBars.openExternalUrl(targetUrl);
            return;
          }
        } catch (e) {}
        try {
          const w = window.open(targetUrl, "_blank", "noopener");
          if (w) return;
        } catch (e) {}
        try {
          window.location.href = targetUrl;
        } catch (e) {}
      }

      function startUpdateAction() {
        if (!pendingUpdate) return;
        if (hasNativeInAppDownloader()) {
          dlState = "downloading";
          dlPct = 0;
          dlLoaded = 0;
          dlTotal = -1;
          dlErrorMsg = "";
          renderToast(true);
          try {
            window.AshrahSystemBars.downloadAndInstallApk(pendingUpdate.downloadUrl);
          } catch (e) {
            openExternalDownload(pendingUpdate.downloadUrl);
          }
        } else {
          openExternalDownload(pendingUpdate.downloadUrl);
        }
      }

      function ensureToastEl() {
        if (toastEl) return toastEl;
        toastEl = document.createElement("div");
        toastEl.id = "ashrah-update-toast";
        toastEl.setAttribute("role", "dialog");
        toastEl.setAttribute("aria-live", "polite");
        document.body.appendChild(toastEl);
        return toastEl;
      }

      function updateProgressBarsFast() {
        if (!toastEl || dlState !== "downloading") return false;
        const fill = document.getElementById("ashrah-upd-prog-fill");
        const pctPill = document.getElementById("ashrah-upd-pct-pill");
        const bytesEl = document.getElementById("ashrah-upd-bytes");
        if (!fill || !pctPill || !bytesEl) return false;

        if (dlPct >= 0) {
          fill.classList.remove("is-indeterminate");
          fill.style.width = Math.min(100, Math.max(0, dlPct)) + "%";
          pctPill.innerText = dlPct + "%";
        } else {
          fill.classList.add("is-indeterminate");
          pctPill.innerText = "...";
        }

        if (dlTotal > 0) {
          bytesEl.innerText = formatMb(dlLoaded) + " / " + formatMb(dlTotal);
        } else if (dlLoaded > 0) {
          bytesEl.innerText = formatMb(dlLoaded);
        } else {
          bytesEl.innerText = "جاري الاتصال...";
        }
        return true;
      }

      function renderToast(forceRebuild) {
        if (!toastEl && !pendingUpdate) return;
        const el = ensureToastEl();
        const isActiveFlow = (dlState === "downloading" || dlState === "installing" || dlState === "need_permission");
        const shouldShow = Boolean(
          pendingUpdate &&
          (isActiveFlow || isHomeOrLobbyActive()) &&
          (isActiveFlow || getDismissedTag() !== pendingUpdate.tag)
        );

        if (!shouldShow) {
          el.classList.remove("is-visible");
          return;
        }

        if (!forceRebuild && dlState === "downloading" && el.dataset.mode === "downloading") {
          if (updateProgressBarsFast()) {
            el.classList.add("is-visible");
            return;
          }
        }

        const safeLabel = escHtml(pendingUpdate.displayLabel || "جديد");
        el.dataset.mode = dlState;

        if (dlState === "downloading") {
          const pctText = dlPct >= 0 ? (dlPct + "%") : "...";
          const bytesText = dlTotal > 0
            ? (formatMb(dlLoaded) + " / " + formatMb(dlTotal))
            : (dlLoaded > 0 ? formatMb(dlLoaded) : "جاري الاتصال...");

          el.innerHTML = `
            <div class="ashrah-upd-head">
              <span class="ashrah-upd-title">⬇️ جاري تحميل التحديث (${safeLabel})</span>
              <span class="ashrah-upd-ver-pill" id="ashrah-upd-pct-pill">${pctText}</span>
            </div>
            <div class="ashrah-upd-prog-wrap">
              <div class="ashrah-upd-prog-track">
                <div class="ashrah-upd-prog-fill ${dlPct < 0 ? "is-indeterminate" : ""}" id="ashrah-upd-prog-fill" style="width:${Math.max(0, dlPct)}%;"></div>
              </div>
              <div class="ashrah-upd-prog-meta">
                <span>يتم التنزيل داخل التطبيق...</span>
                <span class="ashrah-upd-prog-bytes" id="ashrah-upd-bytes">${bytesText}</span>
              </div>
            </div>
            <div class="ashrah-upd-actions is-single">
              <button type="button" class="ashrah-upd-btn-later" id="ashrah-upd-cancel-btn">✕ إلغاء التحميل</button>
            </div>
          `;
          const cancelBtn = document.getElementById("ashrah-upd-cancel-btn");
          if (cancelBtn) {
            cancelBtn.onclick = () => {
              try {
                if (window.AshrahSystemBars && typeof window.AshrahSystemBars.cancelApkDownload === "function") {
                  window.AshrahSystemBars.cancelApkDownload();
                }
              } catch (e) {}
              dlState = "idle";
              renderToast(true);
            };
          }
        } else if (dlState === "need_permission") {
          el.innerHTML = `
            <div class="ashrah-upd-head">
              <span class="ashrah-upd-title">🔐 السماح بتثبيت التحديث</span>
              <span class="ashrah-upd-ver-pill">100%</span>
            </div>
            <div class="ashrah-upd-prog-wrap">
              <div class="ashrah-upd-prog-track">
                <div class="ashrah-upd-prog-fill is-done" style="width:100%;"></div>
              </div>
            </div>
            <div class="ashrah-upd-desc">
              اكتمل تنزيل التحديث. فعّل خيار «السماح من هذا المصدر» لتطبيق عشرة ثم اضغط «تثبيت الآن» مباشرة دون إعادة تحميل.
            </div>
            <div class="ashrah-upd-actions">
              <button type="button" class="ashrah-upd-btn-now" id="ashrah-upd-install-btn">📦 تثبيت الآن</button>
              <button type="button" class="ashrah-upd-btn-later" id="ashrah-upd-close-btn">إغلاق</button>
            </div>
          `;
          const instBtn = document.getElementById("ashrah-upd-install-btn");
          if (instBtn) {
            instBtn.onclick = () => {
              try {
                if (window.AshrahSystemBars && typeof window.AshrahSystemBars.installDownloadedApk === "function") {
                  window.AshrahSystemBars.installDownloadedApk();
                }
              } catch (e) {}
            };
          }
          const closeBtn = document.getElementById("ashrah-upd-close-btn");
          if (closeBtn) {
            closeBtn.onclick = () => {
              dlState = "idle";
              el.classList.remove("is-visible");
            };
          }
        } else if (dlState === "installing") {
          el.innerHTML = `
            <div class="ashrah-upd-head">
              <span class="ashrah-upd-title">✅ اكتمل تحميل التحديث</span>
              <span class="ashrah-upd-ver-pill">100%</span>
            </div>
            <div class="ashrah-upd-prog-wrap">
              <div class="ashrah-upd-prog-track">
                <div class="ashrah-upd-prog-fill is-done" style="width:100%;"></div>
              </div>
            </div>
            <div class="ashrah-upd-desc">
              تم فتح نافذة التثبيت. إذا لم تظهر تلقائياً اضغط «فتح التثبيت».
            </div>
            <div class="ashrah-upd-actions">
              <button type="button" class="ashrah-upd-btn-now" id="ashrah-upd-reopen-btn">📦 فتح التثبيت</button>
              <button type="button" class="ashrah-upd-btn-later" id="ashrah-upd-close-btn">إغلاق</button>
            </div>
          `;
          const reopenBtn = document.getElementById("ashrah-upd-reopen-btn");
          if (reopenBtn) {
            reopenBtn.onclick = () => {
              try {
                if (window.AshrahSystemBars && typeof window.AshrahSystemBars.installDownloadedApk === "function") {
                  window.AshrahSystemBars.installDownloadedApk();
                }
              } catch (e) {}
            };
          }
          const closeBtn = document.getElementById("ashrah-upd-close-btn");
          if (closeBtn) {
            closeBtn.onclick = () => {
              dlState = "idle";
              el.classList.remove("is-visible");
            };
          }
        } else if (dlState === "error") {
          el.innerHTML = `
            <div class="ashrah-upd-head">
              <span class="ashrah-upd-title">⚠️ تعذر إكمال التحميل</span>
              <span class="ashrah-upd-ver-pill">${safeLabel}</span>
            </div>
            <div class="ashrah-upd-desc">
              ${dlErrorMsg ? escHtml(dlErrorMsg) + " — " : ""}يمكنك إعادة المحاولة أو التحميل عبر المتصفح.
            </div>
            <div class="ashrah-upd-actions">
              <button type="button" class="ashrah-upd-btn-now" id="ashrah-upd-retry-btn">🔄 إعادة المحاولة</button>
              <button type="button" class="ashrah-upd-btn-later" id="ashrah-upd-ext-btn">🌐 المتصفح</button>
            </div>
          `;
          const retryBtn = document.getElementById("ashrah-upd-retry-btn");
          if (retryBtn) retryBtn.onclick = startUpdateAction;
          const extBtn = document.getElementById("ashrah-upd-ext-btn");
          if (extBtn) extBtn.onclick = () => openExternalDownload(pendingUpdate.downloadUrl);
        } else {
          el.innerHTML = `
            <div class="ashrah-upd-head">
              <span class="ashrah-upd-title">🚀 يتوفر تحديث جديد</span>
              <span class="ashrah-upd-ver-pill">${safeLabel}</span>
            </div>
            <div class="ashrah-upd-desc">
              تتوفر نسخة أحدث من تطبيق «عشرة» جاهزة للتحميل والتحديث المباشر فوق نسختك الحالية.
            </div>
            <div class="ashrah-upd-actions">
              <button type="button" class="ashrah-upd-btn-now" id="ashrah-upd-now-btn">⬇️ تحديث الآن</button>
              <button type="button" class="ashrah-upd-btn-later" id="ashrah-upd-later-btn">لاحقاً</button>
            </div>
          `;
          const nowBtn = document.getElementById("ashrah-upd-now-btn");
          if (nowBtn) nowBtn.onclick = startUpdateAction;
          const laterBtn = document.getElementById("ashrah-upd-later-btn");
          if (laterBtn) {
            laterBtn.onclick = () => {
              if (pendingUpdate) setDismissedTag(pendingUpdate.tag);
              el.classList.remove("is-visible");
            };
          }
        }

        el.classList.add("is-visible");
      }

      /* استقبال تقدم وحالة التحميل من أندرويد مباشرة */
      window.__ashrahOnUpdateProgress = function (pct, loaded, total) {
        dlPct = typeof pct === "number" ? pct : -1;
        dlLoaded = typeof loaded === "number" ? loaded : 0;
        dlTotal = typeof total === "number" ? total : -1;
        if (dlState !== "downloading") dlState = "downloading";
        renderToast(false);
      };

      window.__ashrahOnUpdateState = function (state, detail) {
        if (state === "cancelled") {
          dlState = "idle";
          renderToast(true);
          return;
        }
        dlState = state || "idle";
        dlErrorMsg = detail || "";
        renderToast(true);
      };

      async function checkForUpdates(force) {
        if (isChecking || dlState === "downloading") return;
        if (!force && !isHomeOrLobbyActive()) return;
        if (typeof navigator !== "undefined" && navigator.onLine === false) return;

        const now = Date.now();
        if (!force && lastCheckAt > 0 && (now - lastCheckAt) < CHECK_COOLDOWN_MS) {
          renderToast(false);
          return;
        }

        isChecking = true;
        lastCheckAt = now;

        try {
          const resp = await fetch(RELEASE_API_URL, {
            method: "GET",
            cache: "no-store",
            headers: { "Accept": "application/vnd.github+json" }
          });
          if (!resp || !resp.ok) return;

          const data = await resp.json();
          if (!data || data.draft) return;

          const tag = String(data.tag_name || "").trim();
          const releaseName = String(data.name || "").trim();
          const remoteParts = parseVersionParts(tag || releaseName);
          if (remoteParts.length === 0) return;

          const remoteBuild = parseBuildNumber(tag);
          const localInfo = getLocalAppInfo();
          const cmp = compareVersionParts(remoteParts, localInfo.versionParts);
          const isNewer = (cmp > 0) || (cmp === 0 && localInfo.buildCode > 0 && remoteBuild > localInfo.buildCode);

          if (!isNewer) {
            pendingUpdate = null;
            dlState = "idle";
            renderToast(true);
            return;
          }

          let downloadUrl = FALLBACK_APK_URL;
          if (Array.isArray(data.assets)) {
            const apkAsset =
              data.assets.find((a) => a && typeof a.name === "string" && a.name.toLowerCase() === "ashrah-latest.apk") ||
              data.assets.find((a) => a && typeof a.name === "string" && a.name.toLowerCase().endsWith(".apk"));
            if (apkAsset && apkAsset.browser_download_url) {
              downloadUrl = apkAsset.browser_download_url;
            }
          }

          const verText = "v" + remoteParts.join(".");
          const displayLabel = (cmp === 0 && remoteBuild > 0) ? (verText + " #" + remoteBuild) : verText;

          pendingUpdate = {
            tag: tag || verText,
            displayLabel: displayLabel,
            downloadUrl: downloadUrl
          };
          renderToast(true);
        } catch (e) {
          /* فحص صامت عند عدم توفر الإنترنت */
        } finally {
          isChecking = false;
        }
      }

      window.checkAshrahAppUpdate = function (force) {
        return checkForUpdates(Boolean(force));
      };

      function initAutoUpdateHooks() {
        if (typeof window.showScreen === "function" && !window.showScreen.__v360UpdateWrapped) {
          const origShowScreen = window.showScreen;
          const wrappedShow = function (screenId) {
            const res = origShowScreen.apply(this, arguments);
            if (screenId === "screen-home" || screenId === "screen-lobby") {
              renderToast(false);
              checkForUpdates(false);
            } else if (toastEl && dlState !== "downloading") {
              toastEl.classList.remove("is-visible");
            }
            return res;
          };
          wrappedShow.__v360UpdateWrapped = true;
          window.showScreen = wrappedShow;
        }

        setTimeout(() => {
          if (isHomeOrLobbyActive()) {
            checkForUpdates(false);
          }
        }, 1200);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initAutoUpdateHooks);
      } else {
        initAutoUpdateHooks();
      }
    })();
  </script>
  <!-- === PLATFORM_V358_AUTO_UPDATE_END === -->
