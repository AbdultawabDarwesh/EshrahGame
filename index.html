       دوال النافذة المنبثقة لقائمة اللاعبين أثناء اللعب
       ===================================================================== */
    let isPlayerStatusPopupOpen = false;

    function togglePlayerStatusPopup() {
      const modal = document.getElementById('player-status-popup');
      if (!modal) return;
      isPlayerStatusPopupOpen = !isPlayerStatusPopupOpen;
      if (isPlayerStatusPopupOpen) {
        modal.classList.add('active');
        if (latestRoomData) {
          renderPlayerStatusPopupContent(latestRoomData);
        }
      } else {
        modal.classList.remove('active');
      }
    }

    function closePlayerStatusPopup(event) {
      if (event && event.target && event.target.id === 'player-status-popup') {
        togglePlayerStatusPopup();
      }
    }

    function getWhistleIcon(extraClass) {
      const cls = "ref-whistle-icon" + (extraClass ? " " + extraClass : "");
      return `<svg class="${cls}" viewBox="1 2.2 22 18.6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="3.6" cy="14.5" r="1.7" stroke="currentColor" stroke-width="1.8"/><path d="M10.2 9.4H14.2V11.3H16.6V9.4H21.2C21.8 9.4 22.2 9.8 22.2 10.4V12.2C22.2 12.8 21.8 13.2 21.2 13.3L15.3 14.5C15.3 17.4 13.0 19.7 10.2 19.7C7.3 19.7 5.0 17.4 5.0 14.5C5.0 11.7 7.3 9.4 10.2 9.4Z" fill="currentColor"/><circle cx="10.1" cy="14.6" r="1.9" fill="#ffffff" fill-opacity="0.35"/><path d="M13.6 6.2L12.7 3.8M16.1 5.9L16.5 3.3M18.4 6.6L20.1 4.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
    }
    window.getWhistleIcon = getWhistleIcon;

    function renderPlayerStatusPopupContent(room) {
      const codeEl = document.getElementById('popup-room-code');
      if (codeEl) codeEl.innerText = room.code;

      const ul = document.getElementById('popup-players-ul');
      if (!ul) return;
      ul.innerHTML = "";

      const esc = (s) => String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

      const buildPlayerItem = (p, isCnSpy, isReferee) => {
        const isMe = (p.id === currentPlayer.id);
        const isHost = (p.id === room.hostId);
        const isLeader = Boolean(isCnSpy || isReferee);
        const li = document.createElement('li');
        li.className = "player-item" + (isMe ? " is-me" : "") + (isLeader ? " is-leader" : "");

        const hostIcon = isHost ? `<span class="player-host-icon" title="المضيف" aria-label="المضيف">🏠</span>` : "";
        const roleIcon = isCnSpy
          ? `<span class="player-role-icon" title="القائد" aria-label="القائد">🕵️</span>`
          : (isReferee ? `<span class="player-role-icon" title="الحكم" aria-label="الحكم">${getWhistleIcon("is-gold")}</span>` : "");

        const isOnline = (playerPresenceMap[p.id] === "online");
        const dotClass = isOnline ? "status-dot online" : "status-dot offline";
        const dotTitle = isOnline ? "متصل الآن" : "غير متصل";

        let kickButton = "";
        if (currentPlayer.isHost && !isMe) {
          kickButton = `<button type="button" class="kick-btn" onclick="kickPlayer('${p.id}')" title="طرد اللاعب" aria-label="طرد">✕</button>`;
        }

        li.innerHTML = `
          <div class="player-meta">
            <span class="${dotClass}" title="${dotTitle}"></span>
            <div class="player-text-col">
              <div class="player-name-row">
                <span class="player-name-text">${esc(p.name)}</span>
                ${hostIcon}${roleIcon}
              </div>
            </div>
          </div>
          ${kickButton}
        `;
        return li;
      };

      const st = room.gameState || {};
      const ta = st.teamAssignments || {};
      const sm = st.spymasters || {};
      const showCnTeams = (
        room.status === "in_game" &&
        room.selectedGame === "codenames" &&
        (st.phase === "playing" || st.phase === "finished") &&
        st.playMode !== "local" &&
        (Object.keys(ta).length > 0 || Boolean(sm.red || sm.blue))
      );

      if (showCnTeams) {
        const players = room.players || [];
        const redPlayers = [];
        const bluePlayers = [];
        const otherPlayers = [];

        players.forEach(p => {
          if (sm.red === p.id || ta[p.id] === "red") redPlayers.push(p);
          else if (sm.blue === p.id || ta[p.id] === "blue") bluePlayers.push(p);
          else otherPlayers.push(p);
        });

        redPlayers.sort((a, b) => (sm.red === b.id ? 1 : 0) - (sm.red === a.id ? 1 : 0));
        bluePlayers.sort((a, b) => (sm.blue === b.id ? 1 : 0) - (sm.blue === a.id ? 1 : 0));

        const appendGroup = (title, cls, list, spyId) => {
          const groupLi = document.createElement('li');
          groupLi.className = "cn-popup-team-group";

          const head = document.createElement('div');
          head.className = "cn-popup-team-header " + cls;
          head.innerHTML = `<span>${title}</span><span>${list.length}</span>`;
          groupLi.appendChild(head);

          if (list.length === 0) {
            const empty = document.createElement('div');
            empty.className = "cn-popup-empty";
            empty.innerText = "لا يوجد أعضاء";
            groupLi.appendChild(empty);
          } else {
            const subUl = document.createElement('ul');
            subUl.className = "cn-popup-team-list";
            list.forEach(p => subUl.appendChild(buildPlayerItem(p, Boolean(spyId && spyId === p.id))));
            groupLi.appendChild(subUl);
          }
          ul.appendChild(groupLi);
        };

        const redTitle = "🔴 " + esc(st.redName || "الفريق الأحمر");
        const blueTitle = "🔵 " + esc(st.blueName || "الفريق الأزرق");
        appendGroup(redTitle, "red", redPlayers, sm.red);
        appendGroup(blueTitle, "blue", bluePlayers, sm.blue);
        if (otherPlayers.length > 0) {
          appendGroup("👁️ مشاهدون / غير معيّنين", "neutral", otherPlayers, "");
        }
        return;
      }

      const activeRefereeId = (
        room.status === "in_game" &&
        (
          (room.selectedGame === "mafia" && st.phase && st.phase !== "setup") ||
          (room.selectedGame === "bra_salfa" && st.phase && st.phase !== "select_referee")
        ) &&
        st.refereeId
      ) ? st.refereeId : "";

      (room.players || []).forEach(p => {
        ul.appendChild(buildPlayerItem(p, false, Boolean(activeRefereeId && activeRefereeId === p.id)));
      });
    }

    window.getGameLogoImgHtml = function (gameKey, clsName) {
      const info = window.GAME_BRAND_LOGOS && window.GAME_BRAND_LOGOS[gameKey];
      if (!info) return "";
      const cls = clsName ? ` class="${clsName}"` : "";
      return `<img${cls} src="${info.src}" alt="${info.alt}" decoding="async" />`;
    };

    function renderGameScreen(room) {
      const titles = {
        bra_salfa: "عشرة برا السالفة",
        codenames: "عشرة CODENAMES",
        mafia: "عشرة مافيا"
      };

      const titleEl = document.getElementById('game-title');
      if (titleEl) {
        const logoHtml = (typeof window.getGameLogoImgHtml === "function")
          ? window.getGameLogoImgHtml(room.selectedGame, "topbar-game-logo")
          : "";
        if (logoHtml) {
          titleEl.innerHTML = logoHtml;
        } else {
          titleEl.innerText = titles[room.selectedGame] || "اللعبة جارية";
        }
      }

      const userNameEl = document.getElementById('game-user-name');
      if (userNameEl) userNameEl.innerText = currentPlayer.name;

      const userRoleEl = document.getElementById('game-user-role');
      if (userRoleEl) {
        userRoleEl.innerText = currentPlayer.isHost ? "🏠 المضيف" : "لاعب";
        userRoleEl.className = "badge-role " + (currentPlayer.isHost ? "host" : "player");
        userRoleEl.style.display = "";
      }

      // تلوين رأس اللعبة بهوية إطار شعارها (مع أولوية لون الفريق في Codenames أثناء اللعب)
      const topBarEl = document.querySelector('#screen-game .game-top-bar');
      const userBoxEl = document.querySelector('#screen-game .game-top-bar-user');
      let cnRolePill = document.getElementById('cn-topbar-role-pill');
      if (!cnRolePill && userBoxEl) {
        cnRolePill = document.createElement('span');
        cnRolePill.id = 'cn-topbar-role-pill';
        cnRolePill.className = 'cn-topbar-role-pill';
        userBoxEl.appendChild(cnRolePill);
      }
      if (topBarEl) {
        topBarEl.classList.remove(
          'cn-topbar-red',
          'cn-topbar-blue',
          'has-game-theme',
          'game-theme-codenames',
          'game-theme-mafia',
          'game-theme-bra_salfa'
        );
        if (room.selectedGame === "codenames" || room.selectedGame === "mafia" || room.selectedGame === "bra_salfa") {
          topBarEl.classList.add('has-game-theme', 'game-theme-' + room.selectedGame);
        }
      }
      if (cnRolePill) {
        cnRolePill.style.display = "none";
        cnRolePill.className = 'cn-topbar-role-pill';
      }

      if (
        room.selectedGame === "codenames" &&
        room.gameState &&
        (room.gameState.phase === "playing" || room.gameState.phase === "finished") &&
        typeof CodenamesGame !== "undefined"
      ) {
        const cnState = room.gameState;
        const myTeam = CodenamesGame.getMyTeam(cnState);
        const isSpy = CodenamesGame.isAssignedSpymaster(cnState);
        const hasTeams = Object.keys(cnState.teamAssignments || {}).length > 0;

        if (myTeam === "red" || myTeam === "blue") {
          if (topBarEl) topBarEl.classList.add("cn-topbar-" + myTeam);
          const teamName = CodenamesGame.getTeamName(cnState, myTeam);
          const teamDot = myTeam === "red" ? "🔴" : "🔵";
          if (titleEl) {
            const cnLogo = (typeof window.getGameLogoImgHtml === "function")
              ? window.getGameLogoImgHtml("codenames", "topbar-game-logo")
              : "Codenames";
            const safeTeam = CodenamesGame.escapeHtml(teamName);
            titleEl.innerHTML = cnLogo;
          }
          if (cnRolePill) {
            cnRolePill.innerText = isSpy ? "🕵️ القائد" : "👤 لاعب";
            cnRolePill.className = "cn-topbar-role-pill" + (isSpy ? " is-spy" : "");
            cnRolePill.style.display = "inline-flex";
          }
          if (userRoleEl && !currentPlayer.isHost) {
            userRoleEl.style.display = "none";
          }
        } else if (cnState.playMode === "local") {
          if (cnRolePill) {
            cnRolePill.innerText = "📱 جهاز واحد";
            cnRolePill.style.display = "inline-flex";
          }
          if (userRoleEl && !currentPlayer.isHost) userRoleEl.style.display = "none";
        } else if (hasTeams) {
          if (cnRolePill) {
            cnRolePill.innerText = "👁️ مشاهد";
            cnRolePill.style.display = "inline-flex";
          }
          if (userRoleEl && !currentPlayer.isHost) userRoleEl.style.display = "none";
        }
      } else if (
        (room.selectedGame === "mafia" || room.selectedGame === "bra_salfa") &&
        room.gameState &&
        room.gameState.refereeId &&
        room.gameState.refereeId === currentPlayer.id &&
        ((room.selectedGame === "mafia" && room.gameState.phase !== "setup") ||
         (room.selectedGame === "bra_salfa" && room.gameState.phase !== "select_referee"))
      ) {
        if (cnRolePill) {
          cnRolePill.innerHTML = getWhistleIcon() + " الحكم";
          cnRolePill.className = "cn-topbar-role-pill is-spy";
          cnRolePill.style.display = "inline-flex";
        }
        if (userRoleEl && !currentPlayer.isHost) {
          userRoleEl.style.display = "none";
        }
      }

      const pinEl = document.getElementById('game-top-bar-pin');
      if (pinEl) pinEl.innerText = "الغرفة: " + room.code;

      const countEl = document.getElementById('game-players-count');
      if (countEl && room.players) {
        countEl.innerText = room.players.length;
      }

      if (isPlayerStatusPopupOpen) {
        renderPlayerStatusPopupContent(room);
      }

      const backWrap = document.getElementById('back-to-lobby-wrap');
      if (backWrap) {
        backWrap.style.display = currentPlayer.isHost ? "block" : "none";
        if (!currentPlayer.isHost) cancelReturnLobbyConfirm();
      }

      /* === GAME_ROUTER_START === */
      /* === PLATFORM_SMART_SCROLL_RESTORE_FIX === */
      const gameScrollAreaEl = document.getElementById('game-scroll-area');
      const useInnerGameScroll = Boolean(
        gameScrollAreaEl &&
        window.getComputedStyle &&
        window.getComputedStyle(gameScrollAreaEl).overflowY !== 'visible' &&
        gameScrollAreaEl.scrollHeight > gameScrollAreaEl.clientHeight + 2
      );
      const currentScrollY = useInnerGameScroll
        ? gameScrollAreaEl.scrollTop
        : (window.scrollY || document.documentElement.scrollTop || 0);
      const gamePhaseKey = String(room.selectedGame || '') + ':' + String((room.gameState && room.gameState.phase) || '');
      const isPhaseTransition = Boolean(window._lastGamePhaseKey && window._lastGamePhaseKey !== gamePhaseKey);
      window._lastGamePhaseKey = gamePhaseKey;

      const runGameRender = () => {
        if (room.selectedGame === "bra_salfa" && typeof BraSalfaGame !== "undefined") {
          BraSalfaGame.render(room);
          return true;
        }
        if (room.selectedGame === "codenames" && typeof CodenamesGame !== "undefined") {
          CodenamesGame.render(room);
          return true;
        }
        if (room.selectedGame === "mafia" && typeof MafiaGame !== "undefined") {
          MafiaGame.render(room);
          return true;
        }
        return false;
      };

      const rendered = runGameRender();
      if (rendered) {
        if (isPhaseTransition) {
          if (useInnerGameScroll && gameScrollAreaEl) gameScrollAreaEl.scrollTop = 0;
          else window.scrollTo(0, 0);
        } else if (currentScrollY > 0) {
          // استعادة موضع التمرير بدقة لمنع أي قفز عند نقر الأزرار أو تفاعل اللاعبين
          if (useInnerGameScroll && gameScrollAreaEl) {
            gameScrollAreaEl.scrollTop = currentScrollY;
            if (typeof requestAnimationFrame === 'function') {
              requestAnimationFrame(() => {
                gameScrollAreaEl.scrollTop = currentScrollY;
              });
            }
          } else {
            window.scrollTo(0, currentScrollY);
            if (typeof requestAnimationFrame === 'function') {
              requestAnimationFrame(() => {
                window.scrollTo(0, currentScrollY);
              });
            }
          }
        }
        return;
      }
      /* === GAME_ROUTER_END === */

      const container = document.getElementById('game-container');
      container.innerHTML = `<p style="color: var(--text-muted); padding: 20px 0;">هذه اللعبة قيد الإعداد ولم تُضف بعد.</p>`;
    }

    let returnLobbyConfirmTimer = null;

    function openReturnLobbyConfirm() {
      if (!currentPlayer.isHost) return;
      const btn = document.getElementById('back-to-lobby-btn');
      const box = document.getElementById('back-to-lobby-confirm');
      if (!btn || !box) {
        returnToLobby();
        return;
      }
      btn.style.display = "none";
      box.classList.add("is-open");
      clearTimeout(returnLobbyConfirmTimer);
      returnLobbyConfirmTimer = setTimeout(() => {
        cancelReturnLobbyConfirm();
      }, 5000);
    }

    function cancelReturnLobbyConfirm() {
      clearTimeout(returnLobbyConfirmTimer);
      returnLobbyConfirmTimer = null;
      const btn = document.getElementById('back-to-lobby-btn');
      const box = document.getElementById('back-to-lobby-confirm');
      if (btn) btn.style.display = "";
      if (box) box.classList.remove("is-open");
    }

    async function confirmReturnToLobby() {
      cancelReturnLobbyConfirm();
      await returnToLobby();
    }

    async function returnToLobby() {
      if (!currentPlayer.isHost) return;
      cancelReturnLobbyConfirm();
      await db.collection("rooms").doc(currentRoomCode).update({
        status: "lobby",
        gameState: {}
      });
    }

    function resetApp() {
      if (unsubscribeRoom) unsubscribeRoom();
      removePresence();
      sessionStorage.removeItem("gamehub_active_room");
      currentRoomCode = null;
      latestRoomData = null;
      currentPlayer.isHost = false;
      showScreen('screen-home');
    }

    /* === BRA_SALFA_START === */
    const BraSalfaGame = {
      isCardRevealed: false,
      isWordPeekOpen: false,
      selectedRefereeId: "",
      wordDraft: "",
      audioCtx: null,
      _audioUnlockBound: false,
      lastPlayedRevealKey: "",

      bindAudioUnlock() {
        if (this._audioUnlockBound) return;
        this._audioUnlockBound = true;
        const unlock = () => {
          this.unlockAudio();
        };
        document.addEventListener("pointerdown", unlock, { passive: true, once: true });
        document.addEventListener("touchstart", unlock, { passive: true, once: true });
      },

      unlockAudio() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.audioCtx) {
            this.audioCtx = new AudioCtx();
          }
          if (this.audioCtx.state === "suspended") {
            this.audioCtx.resume();
          }
        } catch (e) {}
      },

      playSpyRevealAlert() {
        try {
          if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
            navigator.vibrate([160, 70, 240]);
          }
        } catch (e) {}

        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.audioCtx) {
            this.audioCtx = new AudioCtx();
          }
          const ctx = this.audioCtx;
          if (ctx.state === "suspended") {
            ctx.resume().catch(() => {});
          }

          const now = ctx.currentTime;
          const notes = [
            { f: 784, t: 0.00, d: 0.16, type: "triangle", g: 0.24 },
            { f: 988, t: 0.17, d: 0.16, type: "triangle", g: 0.26 },
            { f: 1318, t: 0.34, d: 0.32, type: "sine", g: 0.28 }
          ];
          notes.forEach((n) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = n.type;
            osc.frequency.setValueAtTime(n.f, now + n.t);
            gain.gain.setValueAtTime(0.001, now + n.t);
            gain.gain.exponentialRampToValueAtTime(n.g, now + n.t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + n.t);
            osc.stop(now + n.t + n.d + 0.02);
          });
        } catch (e) {}
      },

      maybeTriggerRevealAlert(state) {
        if (!state || !state.spySelfRevealed || !state.spyRevealAt) return;
        const key = String(typeof currentRoomCode !== "undefined" ? currentRoomCode : "") + "_" + String(state.spyRevealAt);
        if (this.lastPlayedRevealKey === key) return;
        try {
          if (sessionStorage.getItem("bra_spy_alert_" + key) === "1") {
            this.lastPlayedRevealKey = key;
            return;
          }
          sessionStorage.setItem("bra_spy_alert_" + key, "1");
        } catch (e) {}
        this.lastPlayedRevealKey = key;
        this.playSpyRevealAlert();
      },

      esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      },

      selectRefereeCard(playerId) {
        this.selectedRefereeId = playerId;
        if (latestRoomData) this.render(latestRoomData);
      },

      /* === PLATFORM_V351_BRA_ROUND_TIMELINE === */
      /* === PLATFORM_V352_BRA_TIMELINE_CLEAN_CENTER_AND_HOST_BTN === */
      /* === PLATFORM_V353_BRA_UNIFIED_DOCK_AND_SPY_TIMELINE === */
      /* === PLATFORM_V354_BRA_SPY_NOTE_AND_CLEANUP === */
      shouldShowRoundTimeline(phase, state) {
        const isHost = Boolean(typeof currentPlayer !== "undefined" && currentPlayer && currentPlayer.isHost);
        const isRef = Boolean(typeof currentPlayer !== "undefined" && currentPlayer && state && currentPlayer.id === state.refereeId);

        if (phase === "select_referee") {
          return !isHost;
        }
        if (phase === "enter_word") {
          return !isRef;
        }
        if (phase === "playing") {
          return !isRef;
        }
        if (phase === "revealed") {
          return !isHost && !isRef;
        }
        return false;
      },

      syncBraInfoNotes(braWrap, phase, state) {
        if (!braWrap || phase !== "playing") return;
        const isSpy = Boolean(typeof currentPlayer !== "undefined" && currentPlayer && state && currentPlayer.id === state.spyId);
        const isSpySelfRevealed = Boolean(state && state.spySelfRevealed);
        const notes = braWrap.querySelectorAll(".bra-info-note");

        notes.forEach(note => {
          const txt = (note.textContent || "").trim();

          // [1] حذف ملاحظة «بانتظار إنهاء الحكم للجولة بعد سماع الكلمة من الجاسوس» نهائياً
          if (
            txt.includes("بانتظار إنهاء الحكم للجولة بعد سماع الكلمة من الجاسوس") ||
            (txt.includes("بانتظار إنهاء الحكم") && txt.includes("سماع الكلمة"))
          ) {
            note.remove();
            return;
          }

          // [2] في صفحة الجاسوس فقط: إخفاء ملاحظة «النقاش جارٍ..» عند كشف البطاقة وتوسّعها وإعادتها عند إخفائها
          if (
            isSpy &&
            !isSpySelfRevealed &&
            (txt.includes("النقاش جارٍ") || txt.includes("الحكم سينهي الجولة"))
          ) {
            const hasLockPrompt = (braWrap.textContent || "").includes("انقر هنا لكشف بطاقتك");
            const isSpyCardOpen = Boolean(this.isCardRevealed) || !hasLockPrompt;
            note.classList.toggle("bra-note-hidden-spy", isSpyCardOpen);
          } else {
            note.classList.remove("bra-note-hidden-spy");
          }
        });
      },

      renderRoundTimeline(phase) {
        const stepMap = {
          select_referee: 1,
          enter_word: 2,
          playing: 3,
          revealed: 4
        };
        const curStep = stepMap[phase] || 1;
        const progressPct = ((curStep - 1) / 3) * 100;

        const steps = [
          { num: 1, label: "تحديد الحكم" },
          { num: 2, label: "كتابة الكلمة" },
          { num: 3, label: "الأسئلة والنقاش" },
          { num: 4, label: "كشف النتيجة" }
        ];

        const stationsHtml = steps.map(s => {
          const isDone = s.num < curStep;
          const isActive = s.num === curStep;
          const cls = [
            "bra-tline-station",
            isDone ? "is-done" : "",
            isActive ? "is-active" : "",
            s.num > curStep ? "is-upcoming" : ""
          ].filter(Boolean).join(" ");

          return `
            <div class="${cls}">
              <div class="bra-tline-dot-wrap">
                <div class="bra-tline-dot">${isDone ? "✓" : ""}</div>
              </div>
              <span class="bra-tline-lbl">${s.label}</span>
            </div>
          `;
        }).join("");

        return `
          <div class="bra-timeline-slot">
            <div class="bra-timeline-card">
              <div class="bra-tline-head">
                <span class="bra-tline-title">📍 مسار الجولة</span>
                <span class="bra-tline-badge">المرحلة ${curStep} من 4</span>
              </div>
              <div class="bra-tline-track-wrap">
                <div class="bra-tline-track-line">
                  <div class="bra-tline-progress" style="width: ${progressPct}%;"></div>
                </div>
                <div class="bra-tline-stations">
                  ${stationsHtml}
                </div>
              </div>
            </div>
          </div>
        `;
      },

      render(room) {
        const res = this._renderCoreV351(room);
        try {
          const screenGame = document.getElementById("screen-game");
          const container = document.getElementById("game-container");
          if (!container) return res;
          const braWrap = container.querySelector(".bra-wrap");
          if (!braWrap) return res;

          const state = (room && room.gameState) || {};
          const phase = state.phase || "select_referee";
          braWrap.setAttribute("data-bra-phase", phase);

          // تطبيق قواعد الملاحظات (إخفاء ملاحظة النقاش للجاسوس عند كشف بطاقته + حذف ملاحظة انتظار سماع الكلمة)
          this.syncBraInfoNotes(braWrap, phase, state);
          if (!braWrap.dataset.braNoteSyncBound) {
            braWrap.dataset.braNoteSyncBound = "1";
            braWrap.addEventListener("click", () => {
              const runSync = () => this.syncBraInfoNotes(braWrap, phase, state);
              if (typeof requestAnimationFrame === "function") {
                requestAnimationFrame(runSync);
              } else {
                setTimeout(runSync, 0);
              }
            });
          }

          // وسم زر «العودة للغرفة» داخل شاشة اللعبة ليُخفى تلقائياً أثناء تحكم الحكم ويعود بعد انتهاء الجولة
          if (screenGame) {
            screenGame.querySelectorAll("button").forEach(btn => {
              if (btn.closest(".game-top-bar")) return;
              const txt = (btn.textContent || "").trim();
              const oc = btn.getAttribute("onclick") || "";
              if (oc.includes("returnToLobby") || txt.includes("العودة للغرفة") || txt.includes("العودة إلى الغرفة")) {
                btn.setAttribute("data-bra-lobby-btn", "1");
              }
            });
          }

          // تنظيف المسار القديم قبل إعادة البناء
          const oldSlot = braWrap.querySelector(":scope > .bra-timeline-slot");
          if (oldSlot) oldSlot.remove();

          const showTimeline = this.shouldShowRoundTimeline(phase, state);

          // تفعيل التخطيط الموحّد (محتوى في المنتصف + قاعدة سفلية للزر أو للمسار)
          braWrap.classList.add("bra-app-layout");
          braWrap.classList.toggle("has-timeline", showTimeline);

          // التأكد من وجود حاوية التوسيط العمودي للمحتوى
          let centerFlow = braWrap.querySelector(":scope > .bra-center-flow");
          if (!centerFlow) {
            centerFlow = document.createElement("div");
            centerFlow.className = "bra-center-flow";
            const directChildren = Array.from(braWrap.children).filter(
              el => !el.classList.contains("bra-timeline-slot") && !el.classList.contains("bra-bottom-dock")
            );
            directChildren.forEach(ch => centerFlow.appendChild(ch));
            braWrap.insertBefore(centerFlow, braWrap.firstChild);
          }

          if (showTimeline) {
            const oldDock = braWrap.querySelector(":scope > .bra-bottom-dock");
            if (oldDock) oldDock.remove();
            braWrap.insertAdjacentHTML("beforeend", this.renderRoundTimeline(phase));
          } else {
            let bottomDock = braWrap.querySelector(":scope > .bra-bottom-dock");
            if (!bottomDock) {
              const primaryBtns = Array.from(centerFlow.querySelectorAll("button.btn")).filter(btn => {
                const oc = btn.getAttribute("onclick") || "";
                const txt = (btn.textContent || "").trim();
                if (oc.includes("returnToLobby") || txt.includes("العودة للغرفة") || txt.includes("العودة إلى الغرفة")) {
                  return false;
                }
                return true;
              });

              if (primaryBtns.length > 0) {
                bottomDock = document.createElement("div");
                bottomDock.className = "bra-bottom-dock";
                primaryBtns.forEach(btn => {
                  const parentForm = btn.closest("form");
                  if (parentForm && (!btn.getAttribute("onclick") || btn.type === "submit")) {
                    if (!parentForm.id) parentForm.id = "bra-auto-form-v353";
                    btn.setAttribute("form", parentForm.id);
                  }
                  bottomDock.appendChild(btn);
                });
                braWrap.appendChild(bottomDock);
              }
            }
          }
        } catch (e) {}
        return res;
      },

      _renderCoreV351(room) {
        const container = document.getElementById('game-container');
        if (!container) return;
        const state = room.gameState || {};
        const phase = state.phase || "select_referee";
        if (this.lastRenderedPhase && this.lastRenderedPhase !== phase) {
          window.scrollTo(0, 0);
        }
        this.lastRenderedPhase = phase;
        const players = room.players || [];

        if (phase === "select_referee") {
          this.isCardRevealed = false;
          this.isWordPeekOpen = false;
          this.wordDraft = "";
          if (currentPlayer.isHost) {
            if (!this.selectedRefereeId || !players.some(p => p.id === this.selectedRefereeId)) {
              this.selectedRefereeId = players.length ? players[0].id : "";
            }

            const cardsHtml = players.map(p => {
              const isMe = (p.id === currentPlayer.id);
              const isHost = (p.id === room.hostId);
              const isSel = (this.selectedRefereeId === p.id);
              const isOnline = (playerPresenceMap[p.id] === "online");
              const dotClass = isOnline ? "status-dot online" : "status-dot offline";
              const hostIcon = isHost ? `<span class="player-host-icon" title="المضيف" aria-label="المضيف">🏠</span>` : "";
              return `
                <button type="button" class="unified-player-card ${isMe ? "is-me" : ""} ${isSel ? "is-selected" : ""}" onclick="BraSalfaGame.selectRefereeCard('${p.id}')">
                  <div class="unified-player-meta">
                    <span class="${dotClass}"></span>
                    <div class="player-text-col">
                      <div class="player-name-row">
                        <span class="player-name-text">${this.esc(p.name)}</span>
                        ${hostIcon}
                      </div>
                    </div>
                  </div>
                  ${isSel ? `<span class="unified-player-side">${getWhistleIcon("is-gold")}</span>` : ""}
                </button>
              `;
            }).join('');

            container.innerHTML = `
              <div class="bra-wrap">
                <div class="bra-banner">
                  <div class="bra-banner-icon">🕵️‍♂️</div>
                  <h3>اختيار حكم الجولة</h3>
                  <p>اتفقوا على من سيكتب الكلمة السرية لهذه الجولة ثم اختر اسمه من القائمة.</p>
                </div>

                <div class="bra-panel">
                  <div class="bra-panel-head">
                    <span class="with-whistle">${getWhistleIcon("is-gold")} اختر الحكم من اللاعبين (${players.length})</span>
                  </div>
                  <div class="unified-player-grid">${cardsHtml}</div>
                  <button type="button" class="btn btn-primary" ${!this.selectedRefereeId ? "disabled" : ""} onclick="BraSalfaGame.setReferee()">تأكيد الحكم ${getWhistleIcon()}</button>
                </div>
              </div>
            `;
          } else {
            container.innerHTML = `
              <div class="bra-wrap">
                <div class="bra-wait-card">
                  <div class="bra-wait-emblem">⏳</div>
                  <h3 style="color: var(--accent); font-size: 1.08rem;">بانتظار تحديد الحكم</h3>
                  <p class="bra-card-desc">يقوم المضيف الآن باختيار حكم هذه الجولة...</p>
                </div>
              </div>
            `;
          }
        } else if (phase === "enter_word") {
          const isReferee = (currentPlayer.id === state.refereeId);
          if (isReferee) {
            const wasFocused = document.activeElement && document.activeElement.id === 'custom-secret-word';
            container.innerHTML = `
              <div class="bra-wrap">
                <div class="bra-banner is-gold">
                  <div class="bra-banner-icon">${getWhistleIcon("is-lg is-gold")}</div>
                  <h3>أنت الحكم في هذه الجولة</h3>
                  <p>اكتب الكلمة السرية، وسيختار النظام الجاسوس عشوائياً من بين بقية اللاعبين.</p>
                </div>

                <div class="bra-panel">
                  <div class="input-group" style="margin-bottom: 0;">
                    <label>🔑 الكلمة السرية:</label>
                    <input type="text" id="custom-secret-word" value="${this.esc(this.wordDraft)}" placeholder="مثال: مندي، مستشفى، طائرة..." maxlength="25" oninput="BraSalfaGame.wordDraft = this.value" onkeydown="if(event.key==='Enter'){event.preventDefault(); BraSalfaGame.confirmWord();}" />
                  </div>
                  <button type="button" class="btn btn-primary" onclick="BraSalfaGame.confirmWord()">توزيع الأدوار وبدء الجولة 🎲</button>
                </div>
              </div>
            `;
            if (wasFocused) {
              const inp = document.getElementById('custom-secret-word');
              if (inp) {
                inp.focus();
                inp.setSelectionRange(inp.value.length, inp.value.length);
              }
            }
          } else {
            container.innerHTML = `
              <div class="bra-wrap">
                <div class="bra-wait-card">
                  <div class="bra-wait-emblem">✍️</div>
                  <div class="bra-ref-pill">${getWhistleIcon()} الحكم: ${this.esc(state.refereeName)}</div>
                  <p class="bra-card-desc">يكتب الكلمة السرية الآن.. استعد لبدء النقاش والأسئلة!</p>
                </div>
              </div>
            `;
          }
        } else if (phase === "playing") {
          this.bindAudioUnlock();
          const isSpy = (currentPlayer.id === state.spyId);
          const isReferee = (currentPlayer.id === state.refereeId);
