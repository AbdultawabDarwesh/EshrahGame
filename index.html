        if (!names || names.length === 0) return "🤐 لا يوجد سكوت";
        const joined = names.map(n => this.escapeHtml(n)).join("، ");
        return names.length === 1 ? `🤐 ${joined} يسكت` : `🤐 ${joined} يسكتوا`;
      },

      formatVotedLine(names) {
        if (!names || names.length === 0) return "";
        const joined = names.map(n => this.escapeHtml(n)).join("، ");
        return names.length === 1 ? `🗳️ ${joined} خرج بالتصويت` : `🗳️ ${joined} خرجوا بالتصويت`;
      },

      evaluateRoundEvents(room, state) {
        const rules = typeof this.getRules === "function"
          ? this.getRules(state)
          : {
              silenceCancelsMafiaKill: Boolean(state && state.rules && state.rules.silenceCancelsMafiaKill),
              extraKillerEnabled: Boolean(state && state.rules && state.rules.extraKillerEnabled)
            };
        const alivePlayers = this.sortPlayersByRoleOrder(this.getAlivePlayersList(room, state), state);
        const roundEvents = state.roundEvents || {};
        const assignments = state.assignments || {};

        const checkIsMafia = (roleName) => {
          if (typeof this.isMafiaRole === "function") return this.isMafiaRole(roleName);
          const norm = String(roleName || "")
            .toLowerCase()
            .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
            .replace(/[أإآ]/g, "ا")
            .replace(/ة/g, "ه");
          return norm.includes("مافيا") || norm.includes("مافيه") || norm.includes("mafia");
        };

        const silencedMafiaPlayers = [];
        if (rules.silenceCancelsMafiaKill) {
          alivePlayers.forEach(p => {
            const ev = roundEvents[p.id] || {};
            const asg = assignments[p.id] || {};
            if (ev.silenced && checkIsMafia(asg.roleName)) {
              silencedMafiaPlayers.push(p);
            }
          });
        }
        const mafiaKillCancelled = silencedMafiaPlayers.length > 0;

        const perPlayer = {};
        const killedOut = [];
        const savedByHeal = [];
        const silencedList = [];
        const eligibleForVote = [];
        const killedTargetsAll = [];
        const killedByMafiaList = [];
        const killedByOtherList = [];
        const killedUnspecifiedList = [];
        const healedTargetsAll = [];

        alivePlayers.forEach(p => {
          const ev = roundEvents[p.id] || {};
          const asg = assignments[p.id] || {};
          const isMafia = checkIsMafia(asg.roleName);

          let rawKillMafia = false;
          let rawKillOther = false;
          let rawKillUnspecified = false;

          if (rules.extraKillerEnabled) {
            rawKillMafia = Boolean(ev.killMafia);
            rawKillOther = Boolean(ev.killOther);
            rawKillUnspecified = Boolean(ev.killed && !rawKillMafia && !rawKillOther);
          } else {
            rawKillMafia = Boolean(ev.killed || ev.killMafia);
            rawKillOther = false;
            rawKillUnspecified = false;
          }

          const rawKilledAny = rawKillMafia || rawKillOther || rawKillUnspecified;
          const effectiveKillMafia = rawKillMafia && !mafiaKillCancelled;
          const effectiveKillOther = rawKillOther;
          const effectiveKillUnspecified = rawKillUnspecified;
          const effectiveKilled = effectiveKillMafia || effectiveKillOther || effectiveKillUnspecified;
          const healed = Boolean(ev.healed);
          const rawSilenced = Boolean(ev.silenced);
          const silenceCancelledOnThisPlayer = rawSilenced && rules.silenceCancelsMafiaKill && isMafia;
          const effectiveSilenced = rawSilenced && !silenceCancelledOnThisPlayer;

          const saved = effectiveKilled && healed;
          const dies = effectiveKilled && !healed;

          perPlayer[p.id] = {
            isMafia,
            rawKillMafia,
            rawKillOther,
            rawKillUnspecified,
            rawKilledAny,
            effectiveKillMafia,
            effectiveKillOther,
            effectiveKillUnspecified,
            effectiveKilled,
            mafiaKillWasCancelledHere: rawKillMafia && mafiaKillCancelled,
            healed,
            rawSilenced,
            silenceCancelledOnThisPlayer,
            effectiveSilenced,
            saved,
            dies
          };

          if (effectiveSilenced) silencedList.push(p);
          if (rawKillMafia) killedByMafiaList.push(p);
          if (rawKillOther) killedByOtherList.push(p);
          if (rawKillUnspecified) killedUnspecifiedList.push(p);
          if (effectiveKilled) killedTargetsAll.push(p);
          if (healed) healedTargetsAll.push(p);

          if (saved) {
            savedByHeal.push(p);
            eligibleForVote.push(p);
          } else if (dies) {
            killedOut.push(p);
          } else {
            eligibleForVote.push(p);
          }
        });

        return {
          rules,
          alivePlayers,
          silencedMafiaPlayers,
          mafiaKillCancelled,
          perPlayer,
          killedOut,
          savedByHeal,
          silencedList,
          eligibleForVote,
          killedTargetsAll,
          killedByMafiaList,
          killedByOtherList,
          killedUnspecifiedList,
          healedTargetsAll
        };
      },

      buildSecretEventLines(data) {
        const d = data || {};
        const normArr = (arr) => Array.isArray(arr) ? arr.filter(Boolean) : [];
        const keyOf = (item) => (item && (item.id || item.name)) ? String(item.id || item.name) : "";
        const nameOf = (item) => this.escapeHtml((item && item.name) ? item.name : String(item || ""));

        const mafiaKillCancelled = Boolean(d.mafiaKillCancelled);
        const rawMafia = normArr(d.killedByMafia);
        const rawOther = normArr(d.killedByOther);
        const rawUnspec = normArr(d.killedUnspecified);
        const legacyTargets = normArr(d.killedTargets);
        const healedAll = normArr(d.healedTargets);
        const savedFallback = normArr(d.savedByHeal);
        const silencedEff = normArr(d.silenced);
        const silencedCancelled = normArr(d.silencedMafiaCancelled);
        const votedOut = normArr(d.eliminatedByVote);

        const healedSet = new Set();
        healedAll.forEach(x => { const k = keyOf(x); if (k) healedSet.add(k); });
        savedFallback.forEach(x => { const k = keyOf(x); if (k) healedSet.add(k); });

        const hasSplitData = (rawMafia.length > 0 || rawOther.length > 0 || rawUnspec.length > 0);
        const mafiaList = hasSplitData ? rawMafia : legacyTargets;
        const otherList = rawOther;
        const unspecList = rawUnspec;

        const otherKeys = new Set(otherList.map(keyOf).filter(Boolean));
        const handledBothKeys = new Set();

        const groupsOrder = [];
        const groupsMap = {};
        const addToGroup = (gKey, icon, prefix, suffix, nameHtml, isCancelled) => {
          if (!groupsMap[gKey]) {
            groupsMap[gKey] = { icon, prefix, suffix, names: [], isCancelled: Boolean(isCancelled) };
            groupsOrder.push(gKey);
          }
          groupsMap[gKey].names.push(nameHtml);
        };

        /* 1. استهداف نفس الشخص من المافيا والقاتل الآخر معاً (عندما لا تكون قتلة المافيا ملغاة بالسكوت) */
        if (!mafiaKillCancelled) {
          mafiaList.forEach(item => {
            const k = keyOf(item);
            if (k && otherKeys.has(k) && !handledBothKeys.has(k)) {
              handledBothKeys.add(k);
              const isHealed = healedSet.has(k);
              const suffix = isHealed ? " وأُلغي القتل بالعلاج" : "";
              addToGroup(
                "both_" + (isHealed ? "1" : "0"),
                "💥",
                "المافيا والقاتل الآخر قتلا ",
                suffix,
                nameOf(item),
                isHealed
              );
            }
          });
        }

        /* 2. قتلة المافيا */
        mafiaList.forEach(item => {
          const k = keyOf(item);
          if (!k || handledBothKeys.has(k)) return;
          const isHealed = healedSet.has(k);
          let suffix = "";
          let cancelled = false;
          if (mafiaKillCancelled && isHealed) {
            suffix = " وأُلغي القتل بالسكوت والعلاج";
            cancelled = true;
          } else if (mafiaKillCancelled) {
            suffix = " وأُلغي القتل بالسكوت";
            cancelled = true;
          } else if (isHealed) {
            suffix = " وأُلغي القتل بالعلاج";
            cancelled = true;
          }
          addToGroup("mafia_" + suffix, "🔫", "المافيا قتلت ", suffix, nameOf(item), cancelled);
        });

        /* 3. قتلة القاتل الآخر */
        otherList.forEach(item => {
          const k = keyOf(item);
          if (!k || handledBothKeys.has(k)) return;
          const isHealed = healedSet.has(k);
          const suffix = isHealed ? " وأُلغي القتل بالعلاج" : "";
          addToGroup("other_" + (isHealed ? "1" : "0"), "🗡️", "القاتل الآخر قتل ", suffix, nameOf(item), isHealed);
        });

        /* 4. قتل بدون تحديد مصدر القاتل */
        unspecList.forEach(item => {
          const k = keyOf(item);
          if (!k) return;
          const isHealed = healedSet.has(k);
          const suffix = isHealed ? " (لم يُحدد القاتل) وأُلغي القتل بالعلاج" : " (لم يُحدد القاتل)";
          addToGroup("unspec_" + (isHealed ? "1" : "0"), "🔪", "قُتل ", suffix, nameOf(item), isHealed);
        });

        const lines = [];
        groupsOrder.forEach(gKey => {
          const g = groupsMap[gKey];
          lines.push({
            html: `${g.icon} ${g.prefix}${g.names.join("، ")}${g.suffix}`,
            isCancelled: g.isCancelled
          });
        });

        /* 5. الطبيب */
        if (healedAll.length > 0) {
          lines.push({
            html: `💉 الطبيب عالج ${healedAll.map(nameOf).join("، ")}`,
            isCancelled: false
          });
        }

        /* 6. السكوت (النافذ والملغى) */
        if (silencedEff.length > 0) {
          lines.push({
            html: `🤐 السكوت على ${silencedEff.map(nameOf).join("، ")}`,
            isCancelled: false
          });
        }
        if (silencedCancelled.length > 0) {
          lines.push({
            html: `🤐 السكوت على ${silencedCancelled.map(nameOf).join("، ")} وأُلغي السكوت`,
            isCancelled: true
          });
        }

        /* 7. التصويت (يظهر في السجل بعد انتهاء الجولة) */
        if (votedOut.length > 0) {
          lines.push({
            html: `🗳️ التصويت أخرج ${votedOut.map(nameOf).join("، ")}`,
            isCancelled: false
          });
        }

        return lines;
      },

      getStatusInfo(statusObj) {
        if (!statusObj) return { text: "نشط", cls: "m-badge-active", icon: "🟢" };
        if (statusObj.status === "killed") return { text: "مقتول", cls: "m-badge-killed", icon: "💀" };
        if (statusObj.status === "voted_out") return { text: "خرج بالتصويت", cls: "m-badge-voted", icon: "🗳️" };
        if (statusObj.status === "healed_saved") return { text: "تمت مداواته", cls: "m-badge-healed", icon: "💚" };
        if (statusObj.isOut) return { text: "خارج اللعبة", cls: "m-badge-out", icon: "🚫" };
        return { text: "نشط", cls: "m-badge-active", icon: "🟢" };
      },

      getActivePlayersList(room, state) {
        const players = room.players || [];
        const refId = state.refereeId || "";
        return players.filter(p => p.id !== refId);
      },

      /* ترتيب اللاعبين في لوحة الحكم حسب الترتيب الذي حدده المضيف للأدوار */
      sortPlayersByRoleOrder(playersList, state) {
        const assignments = state.assignments || {};
        return [...playersList].sort((a, b) => {
          const oa = (assignments[a.id] && typeof assignments[a.id].order === "number")
            ? assignments[a.id].order
            : 9999;
          const ob = (assignments[b.id] && typeof assignments[b.id].order === "number")
            ? assignments[b.id].order
            : 9999;
          return oa - ob;
        });
      },

      getAlivePlayersList(room, state) {
        const statuses = state.playerStatuses || {};
        return this.getActivePlayersList(room, state).filter(p => {
          const st = statuses[p.id];
          return !st || !st.isOut;
        });
      },

      /* =====================================================================
         الموجه الرئيسي لواجهات لعبة المافيا
         ===================================================================== */
      render(room) {
        const container = document.getElementById("game-container");
        if (!container) return;

        const state = room.gameState || {};
        const phase = state.phase || "setup";
        if (this.lastRenderedPhase && this.lastRenderedPhase !== phase) {
          window.scrollTo(0, 0);
        }
        this.lastRenderedPhase = phase;

        this.saveLocalSession(room.code, state);

        if (phase === "setup") {
          this.isPlayerCardRevealed = false;
          this.refereeTab = "board";
          this.stopAndHideTimer();
          if (currentPlayer.isHost) {
            this.renderHostSetup(room, container);
          } else {
            this.lastSetupSignature = "";
            container.innerHTML = `
              <div class="mafia-wrap mafia-app-layout" data-mafia-phase="setup">
                <div class="mafia-center-flow">
                  <div class="mafia-banner">
                    <div style="font-size: 2.6rem; margin-bottom: 8px;">🎭</div>
                    <h3>إعداد لعبة المافيا</h3>
                    <p>يقوم المضيف الآن باختيار الحكم، وتحديد بطاقات البطة وترتيب أسماء الأدوار لهذه المباراة...</p>
                  </div>
                </div>
                ${this.renderWaitingProgressBar("setup", state)}
              </div>
            `;
          }
          const wrapEl = container.querySelector(".mafia-wrap");
          if (wrapEl) wrapEl.setAttribute("data-mafia-phase", phase);
          return;
        }

        /* تصفير توقيع شاشة الإعداد عند الخروج منها */
        this.lastSetupSignature = "";

        const isReferee = (currentPlayer.id === state.refereeId);
        if (isReferee) {
          this.renderRefereeView(room, state, container);
        } else {
          this.stopAndHideTimer();
          this.renderPlayerView(room, state, container);
        }
        const wrapEl = container.querySelector(".mafia-wrap");
        if (wrapEl) wrapEl.setAttribute("data-mafia-phase", phase);
      },

      /* === PLATFORM_V355_MAFIA_SETUP_WAIT_AND_REF_REDESIGN === */
      renderWaitingProgressBar(phase, state) {
        const rawStep = (state && parseInt(state.setupStep, 10)) || 1;
        const activeStep = phase === "referee_ready"
          ? 5
          : Math.min(4, Math.max(1, rawStep));
        const totalSteps = 5;
        const progressPct = ((activeStep - 1) / (totalSteps - 1)) * 100;

        const waitTitles = [
          "تحديد حكم المباراة",
          "اختيار أوراق اللعب",
          "تسمية الأدوار وترتيبها",
          "القواعد الإضافية والتسليم",
          "توزيع البطاقات بواسطة الحكم"
        ];

        const stationsHtml = [1, 2, 3, 4, 5].map(s => {
          const isCompleted = s < activeStep;
          const isActive = s === activeStep;
          const cls = [
            "mafia-station",
            isCompleted ? "is-completed" : "",
            isActive ? "is-active" : "",
            s > activeStep ? "is-upcoming" : ""
          ].filter(Boolean).join(" ");
          return `
            <span class="${cls}" title="${waitTitles[s - 1]}">
              <span class="mafia-station-dot"></span>
            </span>
          `;
        }).join("");

        return `
          <div class="mafia-wait-progress-slot">
            <div class="mafia-stepper-wrap">
              <div class="mafia-stepper-track">
                <div class="mafia-stepper-line">
                  <div class="mafia-stepper-progress" style="width: ${progressPct}%;"></div>
                </div>
                <div class="mafia-stepper-stations">
                  ${stationsHtml}
                </div>
              </div>
              <div class="mafia-stepper-label">
                <span>📍 ${waitTitles[activeStep - 1]}</span>
                <span class="mafia-stepper-counter">${activeStep} / ${totalSteps}</span>
              </div>
            </div>
          </div>
        `;
      },

      syncSetupStepToRoom(stepNum) {
        try {
          if (!currentPlayer || !currentPlayer.isHost || !currentRoomCode || !latestRoomData) return;
          const st = latestRoomData.gameState || {};
          if ((st.phase || "setup") !== "setup") return;
          const cleanStep = Math.min(4, Math.max(1, parseInt(stepNum, 10) || 1));
          if (st.setupStep === cleanStep) return;
          if (this._lastSyncedSetupStep === currentRoomCode + ":" + cleanStep) return;
          this._lastSyncedSetupStep = currentRoomCode + ":" + cleanStep;
          db.collection("rooms").doc(currentRoomCode).update({
            "gameState.setupStep": cleanStep
          }).catch(() => {});
        } catch (e) {}
      },

      openInlineLobbyConfirm() {
        if (!currentPlayer || !currentPlayer.isHost) return;
        const nav = document.getElementById("mafia-step1-nav");
        const box = document.getElementById("mafia-step1-lobby-confirm");
        if (!nav || !box) {
          if (typeof returnToLobby === "function") returnToLobby();
          return;
        }
        nav.style.display = "none";
        box.classList.add("is-open");
        clearTimeout(this._inlineLobbyTimer);
        this._inlineLobbyTimer = setTimeout(() => {
          this.cancelInlineLobbyConfirm();
        }, 5000);
      },

      cancelInlineLobbyConfirm() {
        clearTimeout(this._inlineLobbyTimer);
        this._inlineLobbyTimer = null;
        const nav = document.getElementById("mafia-step1-nav");
        const box = document.getElementById("mafia-step1-lobby-confirm");
        if (nav) nav.style.display = "";
        if (box) box.classList.remove("is-open");
      },

      /* =====================================================================
         1. واجهة إعداد اللعبة بواسطة المضيف (منفصلة تماماً عن الحكم)
         ===================================================================== */
      renderHostSetup(room, container, forceRender) {
        this.loadHostDraftLocal(room.code);
        const participants = room.players || [];

        /* التأكد من أن الحكم المختار لا يزال متصلاً بالغرفة */
        if (this.hostDraft.refereeId && !participants.some(p => p.id === this.hostDraft.refereeId)) {
          this.hostDraft.refereeId = "";
          this.hostDraft.selectedCards = [];
          this.hostDraft.step = 1;
        }

        const requiredPlayers = this.hostDraft.refereeId
          ? participants.filter(p => p.id !== this.hostDraft.refereeId).length
          : 0;

        if (this.hostDraft.refereeId && this.hostDraft.selectedCards.length > requiredPlayers) {
          this.hostDraft.selectedCards = this.hostDraft.selectedCards.slice(0, requiredPlayers);
        }

        const currentStep = Math.min(4, Math.max(1, parseInt(this.hostDraft.step, 10) || 1));
        const selectedCount = this.hostDraft.selectedCards.length;
        const remainingCount = Math.max(0, requiredPlayers - selectedCount);

        /* مزامنة خطوة الإعداد الحالية ليرى اللاعبون المنتظرون مستوى التقدم لحظياً */
        this.syncSetupStepToRoom(currentStep);

        const sig = participants.map(p => p.id + ":" + p.name).join("|") +
          "#" + this.hostDraft.refereeId +
          "#" + currentStep +
          "#" + this.hostDraft.selectedCards.map(c => c.cardId + ":" + c.roleName).join(",") +
          "#" + String(Boolean(this.hostDraft.silenceCancelsMafiaKill)) +
          "#" + String(Boolean(this.hostDraft.extraKillerEnabled)) +
          "#" + this.setupWarning;

        if (!forceRender && this.lastSetupSignature === sig && document.getElementById("mafia-setup-root")) {
          this.refreshHostSetupValidation(room);
          return;
        }
        this.lastSetupSignature = sig;
        this.saveHostDraftLocal();

        if (participants.length < 2) {
          container.innerHTML = `
            <div class="mafia-wrap mafia-app-layout" id="mafia-setup-root" data-mafia-phase="setup">
              <div class="mafia-center-flow">
                <div class="mafia-banner">
                  <h3>🎭 إعداد لعبة المافيا</h3>
                </div>
                <div class="mafia-alert-box danger">
                  ⚠️ يجب وجود مشاركين اثنين على الأقل داخل الغرفة (حكم واحد + لاعب واحد على الأقل) لبدء اللعبة.
                </div>
              </div>
              <div class="mafia-bottom-dock">
                <div class="mafia-nav-row single-btn" id="mafia-step1-nav">
                  <button type="button" class="btn btn-secondary mafia-nav-btn is-prev" onclick="MafiaGame.openInlineLobbyConfirm()">
                    <span>العودة للغرفة</span>
                  </button>
                </div>
                <div id="mafia-step1-lobby-confirm" class="return-lobby-confirm">
                  <span class="return-lobby-confirm-text">تأكيد العودة للغرفة؟</span>
                  <div class="return-lobby-confirm-actions">
                    <button type="button" class="return-confirm-icon-btn is-yes" onclick="confirmReturnToLobby()" title="تأكيد العودة للغرفة" aria-label="تأكيد">✓</button>
                    <button type="button" class="return-confirm-icon-btn is-no" onclick="MafiaGame.cancelInlineLobbyConfirm()" title="إلغاء" aria-label="إلغاء">✕</button>
                  </div>
                </div>
              </div>
            </div>
          `;
          return;
        }

        /* حفظ موضع التمرير لقائمة البطاقات ومحتوى الشاشة بدقة لمنع أي قفز عند النقر */
        const prevDeckEl = document.querySelector(".mafia-deck-grid");
        const prevRolesEl = document.querySelector(".mafia-role-edit-list");
        const prevScrollAreaEl = document.getElementById("game-scroll-area");
        const prevDeckScroll = prevDeckEl ? prevDeckEl.scrollTop : 0;
        const prevRolesScroll = prevRolesEl ? prevRolesEl.scrollTop : 0;
        const prevScrollAreaTop = prevScrollAreaEl ? prevScrollAreaEl.scrollTop : 0;
        const prevWinScrollY = window.scrollY || document.documentElement.scrollTop || 0;

        /* 1. شريط المحطات الدائرية الأنيق (بدون أرقام داخل الدوائر) */
        const stepTitles = [
          "تحديد حكم المباراة",
          "اختيار أوراق اللعب",
          "تسمية الأدوار وترتيبها",
          "القواعد الإضافية والتسليم"
        ];
        const progressPct = ((currentStep - 1) / 3) * 100;

        const stationsHtml = [1, 2, 3, 4].map(s => {
          const isCompleted = s < currentStep;
          const isActive = s === currentStep;
          const isClickable = isCompleted;
          const cls = [
            "mafia-station",
            isCompleted ? "is-completed is-clickable" : "",
            isActive ? "is-active" : "",
            s > currentStep ? "is-upcoming" : ""
          ].filter(Boolean).join(" ");

          const clickAttr = isClickable ? `onclick="MafiaGame.goToStep(${s})"` : "";
          return `
            <button type="button" class="${cls}" ${clickAttr} title="المحطة ${s}: ${stepTitles[s - 1]}">
              <span class="mafia-station-dot"></span>
            </button>
          `;
        }).join("");

        const stepperHtml = `
          <div class="mafia-stepper-wrap">
            <div class="mafia-stepper-track">
              <div class="mafia-stepper-line">
                <div class="mafia-stepper-progress" style="width: ${progressPct}%;"></div>
              </div>
              <div class="mafia-stepper-stations">
                ${stationsHtml}
              </div>
            </div>
            <div class="mafia-stepper-label">
              <span>📍 ${stepTitles[currentStep - 1]}</span>
              <span class="mafia-stepper-counter">${currentStep} / 4</span>
            </div>
          </div>
        `;

        /* 2. محتوى المحطة الحالية + الأزرار المثبتة بالأسفل */
        let stepBodyHtml = "";
        let stepDockHtml = "";

        if (currentStep === 1) {
          /* المحطة 1: تحديد الحكم + زر العودة للغرفة بجانب زر التالي في نفس الصف */
          const refChipsHtml = participants.map(p => {
            const isSel = (this.hostDraft.refereeId === p.id);
            const isMe = (p.id === currentPlayer.id);
            const isHost = (p.id === room.hostId);
            const isOnline = (playerPresenceMap[p.id] === "online");
            const dotClass = isOnline ? "status-dot online" : "status-dot offline";
            const hostIcon = isHost ? `<span class="player-host-icon" title="المضيف" aria-label="المضيف">🏠</span>` : "";
            return `
              <button type="button" class="unified-player-card ${isMe ? "is-me" : ""} ${isSel ? "is-selected" : ""}" onclick="MafiaGame.selectReferee('${p.id}')">
                <div class="unified-player-meta">
                  <span class="${dotClass}"></span>
                  <div class="player-text-col">
                    <div class="player-name-row">
                      <span class="player-name-text">${this.escapeHtml(p.name)}</span>
                      ${hostIcon}
                    </div>
                  </div>
                </div>
                ${isSel ? `<span class="unified-player-side">${getWhistleIcon("is-gold")}</span>` : ""}
              </button>
            `;
          }).join("");

          stepBodyHtml = `
            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span class="with-whistle">${getWhistleIcon("is-gold")} اختر الحكم من المشاركين (${participants.length})</span>
              </div>
              <div class="unified-player-grid">${refChipsHtml}</div>
            </div>
          `;

          stepDockHtml = `
            <div class="mafia-nav-row" id="mafia-step1-nav">
              <button type="button" class="btn btn-secondary mafia-nav-btn is-prev" onclick="MafiaGame.openInlineLobbyConfirm()">
                <span>العودة للغرفة</span>
              </button>
              <button type="button" class="btn btn-primary mafia-nav-btn is-next" ${!this.hostDraft.refereeId ? "disabled" : ""} onclick="MafiaGame.goToStep(2)">
                <span>التالي</span>
              </button>
            </div>
            <div id="mafia-step1-lobby-confirm" class="return-lobby-confirm">
              <span class="return-lobby-confirm-text">تأكيد العودة للغرفة؟</span>
              <div class="return-lobby-confirm-actions">
                <button type="button" class="return-confirm-icon-btn is-yes" onclick="confirmReturnToLobby()" title="تأكيد العودة للغرفة" aria-label="تأكيد">✓</button>
                <button type="button" class="return-confirm-icon-btn is-no" onclick="MafiaGame.cancelInlineLobbyConfirm()" title="إلغاء" aria-label="إلغاء">✕</button>
              </div>
            </div>
          `;
        } else if (currentStep === 2) {
          /* المحطة 2: اختيار أوراق اللعب (بدون البطاقات الثلاث الإحصائية + عداد مضغوط بجانب العنوان) */
          const buildCardPickHtml = (card) => {
            const pickIdx = this.hostDraft.selectedCards.findIndex(sc => sc.cardId === card.id);
            const isPicked = pickIdx !== -1;
            const isMaxed = (!isPicked && selectedCount >= requiredPlayers);
            return `
              <div class="mafia-card-pick ${isPicked ? "selected" : ""} ${isMaxed ? "disabled-pick" : ""}"
                   onclick="MafiaGame.toggleCardSelection('${card.id}')">
                ${isPicked ? `<span class="mafia-card-check">${pickIdx + 1}</span>` : ""}
                ${this.renderCardSVG(card.id, "md")}
              </div>
            `;
          };

          const jokerCardsHtml = this.CARD_DECK
            .filter(c => c.suitCode === "J")
            .map(buildCardPickHtml)
            .join("");

          const regularCardsHtml = this.CARD_DECK
            .filter(c => c.suitCode !== "J")
            .map(buildCardPickHtml)
            .join("");

          const deckHtml = `<div class="mafia-joker-row">${jokerCardsHtml}</div>${regularCardsHtml}`;
          const counterText = remainingCount > 0
            ? `${selectedCount} / ${requiredPlayers} · متبقي ${remainingCount}`
            : `${selectedCount} / ${requiredPlayers} ✓`;

          stepBodyHtml = `
            ${this.setupWarning ? `<div class="mafia-alert-box danger">${this.escapeHtml(this.setupWarning)}</div>` : ""}

            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span>🃏 اختر من أوراق البطة</span>
                <span class="mafia-pick-counter-pill ${remainingCount === 0 ? "is-done" : ""}">${counterText}</span>
              </div>
              <div class="mafia-deck-grid">${deckHtml}</div>
            </div>
          `;

          stepDockHtml = `
            <div class="mafia-nav-row">
              <button type="button" class="btn btn-secondary mafia-nav-btn is-prev" onclick="MafiaGame.goToStep(1)">
                <span>السابق</span>
              </button>
              <button type="button" class="btn btn-primary mafia-nav-btn is-next" ${selectedCount !== requiredPlayers ? "disabled" : ""} onclick="MafiaGame.goToStep(3)">
                <span>التالي</span>
              </button>
            </div>
          `;
        } else if (currentStep === 3) {
          /* المحطة 3: تسمية الأدوار وترتيبها */
          const totalSel = this.hostDraft.selectedCards.length;
          const roleEditsHtml = totalSel === 0
            ? `<p style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:8px;">يرجى العودة واختيار البطاقات أولاً.</p>`
            : this.hostDraft.selectedCards.map((sc, idx) => `
                <div class="mafia-role-edit-row">
                  <div class="mafia-order-controls">
                    <button type="button" class="mafia-order-btn" title="تحريك للأعلى" ${idx === 0 ? "disabled" : ""} onclick="MafiaGame.moveRoleOrder(${idx}, -1)">▲</button>
                    <button type="button" class="mafia-order-btn" title="تحريك للأسفل" ${idx === totalSel - 1 ? "disabled" : ""} onclick="MafiaGame.moveRoleOrder(${idx}, 1)">▼</button>
                  </div>
                  ${this.renderCardSVG(sc.cardId, "sm")}
                  <div style="flex:1; min-width:0;">
                    <div style="font-size:0.74rem; color:var(--text-muted); margin-bottom:4px; display:flex; align-items:center; gap:6px;">
                      <span class="mafia-order-badge">#${idx + 1}</span>
                      <span>تسلسل الدور لدى الحكم</span>
                    </div>
                    <input type="text"
                           value="${this.escapeHtml(sc.roleName)}"
                           placeholder="اكتب اسم الدور (مثال: مافيا، طبيب...)"
                           maxlength="28"
                           oninput="MafiaGame.updateRoleName('${sc.cardId}', this.value)" />
                  </div>
                  <button type="button" class="mafia-remove-card-btn" title="إزالة البطاقة" onclick="MafiaGame.toggleCardSelection('${sc.cardId}')">✕</button>
                </div>
              `).join("");

          const hasEmptyRole = this.hostDraft.selectedCards.some(sc => !sc.roleName || !sc.roleName.trim());

          stepBodyHtml = `
            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span>✍️ اكتب أسماء الأدوار ورتّبها بالتسلسل</span>
              </div>
              <p style="font-size:0.76rem; color:var(--text-muted); margin-bottom:8px;">
                استخدم أزرار <strong>▲ / ▼</strong> لترتيب التسلسل الذي سيمر عليه الحكم في كل جولة.
              </p>
              <div class="mafia-role-edit-list">${roleEditsHtml}</div>
            </div>
          `;

          stepDockHtml = `
            <div class="mafia-nav-row">
              <button type="button" class="btn btn-secondary mafia-nav-btn is-prev" onclick="MafiaGame.goToStep(2)">
                <span>السابق</span>
              </button>
              <button type="button" class="btn btn-primary mafia-nav-btn is-next" ${hasEmptyRole || totalSel === 0 ? "disabled" : ""} onclick="MafiaGame.goToStep(4)">
                <span>التالي</span>
              </button>
            </div>
          `;
        } else if (currentStep === 4) {
          /* المحطة 4: القواعد الإضافية والتسليم (بدون بطاقة المراجعة وبدون رسالة الاكتمال، مع تثبيت الزرين بالأسفل وتوسيط المحتوى) */
          const v = this.getSetupValidation(room);

          stepBodyHtml = `
            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span>⚙️ قواعد إضافية للجولات (اختياري)</span>
              </div>
              <div class="mafia-rules-list">
                <label class="mafia-rule-toggle ${this.hostDraft.silenceCancelsMafiaKill ? "is-checked" : ""}">
                  <input type="checkbox" ${this.hostDraft.silenceCancelsMafiaKill ? "checked" : ""} onchange="MafiaGame.toggleHostRule('silenceCancelsMafiaKill', this.checked)" />
                  <div class="mafia-rule-text">
                    <span class="mafia-rule-title">🤐 السكوت يلغي قتل المافيا</span>
                    <span class="mafia-rule-desc">عند اختيار سكوت لأي فرد من المافيا، تلتغي قتلة المافيا في تلك الجولة ولا يُطبّق عليه السكوت (مطابقة ذكية لأي دور يحوي كلمة مافيا).</span>
                  </div>
                </label>

                <label class="mafia-rule-toggle ${this.hostDraft.extraKillerEnabled ? "is-checked" : ""}">
                  <input type="checkbox" ${this.hostDraft.extraKillerEnabled ? "checked" : ""} onchange="MafiaGame.toggleHostRule('extraKillerEnabled', this.checked)" />
                  <div class="mafia-rule-text">
                    <span class="mafia-rule-title">🗡️ تفعيل قاتل إضافي</span>
                    <span class="mafia-rule-desc">يظهر للحكم خياران سريعان عند القتل (🔫 المافيا / 🗡️ قاتل آخر) مع تمييز سري للحكم فقط، ولا يتأثر القاتل الآخر بقاعدة سكوت المافيا.</span>
                  </div>
                </label>
              </div>
            </div>

            <div id="mafia-setup-validation-msg" style="${v.ok ? "display:none;" : ""}">
              ${v.ok ? "" : `<div class="mafia-alert-box danger">${this.escapeHtml(v.msg)}</div>`}
            </div>
          `;

          stepDockHtml = `
            <div class="mafia-nav-row">
              <button type="button" class="btn btn-secondary mafia-nav-btn is-prev" onclick="MafiaGame.goToStep(3)">
                <span>السابق</span>
              </button>
              <button type="button" id="mafia-handoff-btn" class="btn mafia-btn-gold mafia-nav-btn" ${!v.ok ? "disabled" : ""} onclick="MafiaGame.confirmSetupAndHandoff()">
                <span>بدء وتسليم الحكم 🚀</span>
              </button>
            </div>
          `;
        }

        container.innerHTML = `
          <div class="mafia-wrap mafia-app-layout" id="mafia-setup-root" data-mafia-phase="setup">
            <div class="mafia-center-flow">
              <div class="mafia-banner">
                <h3>🎭 إعداد لعبة المافيا</h3>
              </div>
              ${stepperHtml}
              ${stepBodyHtml}
            </div>
            <div class="mafia-bottom-dock">
              ${stepDockHtml}
            </div>
          </div>
        `;

        this.refreshHostSetupValidation(room);

        /* استعادة مواضع التمرير فوراً للبقاء في نفس مكان القائمة دون أي قفز للأعلى */
        const restoreScrolls = () => {
          const newDeckEl = document.querySelector(".mafia-deck-grid");
          if (newDeckEl && prevDeckScroll > 0) newDeckEl.scrollTop = prevDeckScroll;
          const newRolesEl = document.querySelector(".mafia-role-edit-list");
          if (newRolesEl && prevRolesScroll > 0) newRolesEl.scrollTop = prevRolesScroll;
          const newScrollAreaEl = document.getElementById("game-scroll-area");
          if (newScrollAreaEl && prevScrollAreaTop > 0) newScrollAreaEl.scrollTop = prevScrollAreaTop;
          if (prevWinScrollY > 0) window.scrollTo(0, prevWinScrollY);
        };
        restoreScrolls();
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(restoreScrolls);
        }
        setTimeout(restoreScrolls, 0);
      },

      goToStep(targetStep) {
        if (!latestRoomData) return;
        const current = Math.min(4, Math.max(1, parseInt(this.hostDraft.step, 10) || 1));
        const participants = latestRoomData.players || [];
        const requiredPlayers = this.hostDraft.refereeId
          ? participants.filter(p => p.id !== this.hostDraft.refereeId).length
          : 0;

        if (targetStep > current) {
          if (!this.hostDraft.refereeId) {
            alert("يرجى اختيار الحكم أولاً.");
            return;
          }
          if (targetStep >= 3 && this.hostDraft.selectedCards.length !== requiredPlayers) {
            alert(`يرجى إكمال اختيار البطاقات بالضبط (${this.hostDraft.selectedCards.length}/${requiredPlayers}).`);
            return;
          }
          if (targetStep >= 4) {
            const hasEmpty = this.hostDraft.selectedCards.some(sc => !sc.roleName || !sc.roleName.trim());
            if (hasEmpty) {
              alert("يرجى تسمية جميع الأدوار قبل الانتقال للقواعد ومراجعة التسليم.");
              return;
            }
          }
        }

        this.setupWarning = "";
        this.hostDraft.step = Math.min(4, Math.max(1, targetStep));
        this.saveHostDraftLocal();
        this.syncSetupStepToRoom(this.hostDraft.step);
        this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);
      },

      selectReferee(playerId) {
        this.setupWarning = "";
        this.hostDraft.refereeId = playerId;
        this.saveHostDraftLocal();
        if (latestRoomData) {
          this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      toggleCardSelection(cardId) {
        if (!latestRoomData) return;
        const participants = latestRoomData.players || [];
        const requiredPlayers = participants.filter(p => p.id !== this.hostDraft.refereeId).length;
        const existsIdx = this.hostDraft.selectedCards.findIndex(sc => sc.cardId === cardId);

        const deckEl = document.querySelector(".mafia-deck-grid");
        const deckScroll = deckEl ? deckEl.scrollTop : 0;
        const scrollArea = document.getElementById("game-scroll-area");
        const scrollAreaTop = scrollArea ? scrollArea.scrollTop : 0;

        if (existsIdx !== -1) {
          this.hostDraft.selectedCards.splice(existsIdx, 1);
          this.setupWarning = "";
        } else {
          if (this.hostDraft.selectedCards.length >= requiredPlayers) {
            this.setupWarning = `لا يمكن اختيار أكثر من ${requiredPlayers} بطاقة (بعدد اللاعبين الفعليين). قم بإلغاء بطاقة أولاً للاستبدال.`;
            this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);
            return;
          }
          const meta = this.getCardMeta(cardId);
          this.hostDraft.selectedCards.push({
            cardId: cardId,
            roleName: meta.defaultRole
          });
          this.setupWarning = "";
        }

        this.saveHostDraftLocal();
        this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);

        const restoreNow = () => {
          const newDeck = document.querySelector(".mafia-deck-grid");
          if (newDeck && deckScroll > 0) newDeck.scrollTop = deckScroll;
          const newScroll = document.getElementById("game-scroll-area");
          if (newScroll && scrollAreaTop > 0) newScroll.scrollTop = scrollAreaTop;
        };
        restoreNow();
        if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(restoreNow);
        }
        setTimeout(restoreNow, 0);
      },

      /* تحريك ترتيب الدور للأعلى أو للأسفل في لوحة المضيف */
      moveRoleOrder(index, direction) {
        const list = this.hostDraft.selectedCards;
        const targetIdx = index + direction;
        if (targetIdx < 0 || targetIdx >= list.length) return;
        const temp = list[index];
        list[index] = list[targetIdx];
        list[targetIdx] = temp;
        this.saveHostDraftLocal();
        if (latestRoomData) {
          this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      toggleHostRule(ruleKey, checked) {
        this.hostDraft[ruleKey] = Boolean(checked);
        this.saveHostDraftLocal();
        if (latestRoomData) {
          this.renderHostSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      updateRoleName(cardId, newValue) {
        const item = this.hostDraft.selectedCards.find(sc => sc.cardId === cardId);
        if (item) {
          item.roleName = newValue;
          this.saveHostDraftLocal();
          if (latestRoomData) this.refreshHostSetupValidation(latestRoomData);
        }
      },

      getSetupValidation(room) {
        const participants = room.players || [];
        if (participants.length < 2) {
          return { ok: false, msg: "تحتاج إلى مشاركين اثنين على الأقل (حكم + لاعب واحد على الأقل)." };
        }
        if (!this.hostDraft.refereeId || !participants.some(p => p.id === this.hostDraft.refereeId)) {
          return { ok: false, msg: "يرجى اختيار الحكم أولاً." };
        }
        const requiredPlayers = participants.filter(p => p.id !== this.hostDraft.refereeId).length;
        if (this.hostDraft.selectedCards.length < requiredPlayers) {
          return { ok: false, msg: `اخترت ${this.hostDraft.selectedCards.length} من أصل ${requiredPlayers} بطاقة. متبقي ${requiredPlayers - this.hostDraft.selectedCards.length} بطاقة.` };
        }
        if (this.hostDraft.selectedCards.length > requiredPlayers) {
          return { ok: false, msg: `البطاقات المختارة أكثر من عدد اللاعبين الفعليين (${requiredPlayers}).` };
        }
        const emptyIdx = this.hostDraft.selectedCards.findIndex(sc => !sc.roleName || !sc.roleName.trim());
        if (emptyIdx !== -1) {
          return { ok: false, msg: `يرجى كتابة اسم الدور للبطاقة رقم ${emptyIdx + 1}.` };
        }
        return { ok: true, msg: "✅ الإعدادات والترتيب مكتملان! يمكنك الآن تسليم الإدارة للحكم." };
      },

      refreshHostSetupValidation(room) {
        const btn = document.getElementById("mafia-handoff-btn");
        const msgBox = document.getElementById("mafia-setup-validation-msg");
        if (!btn) return;

        const v = this.getSetupValidation(room);
        btn.disabled = !v.ok;
        if (msgBox) {
          if (v.ok) {
            msgBox.style.display = "none";
            msgBox.innerHTML = "";
          } else {
            msgBox.style.display = "";
            msgBox.innerHTML = `<div class="mafia-alert-box danger">${this.escapeHtml(v.msg)}</div>`;
          }
        }
      },

      async confirmSetupAndHandoff() {
        if (!currentPlayer.isHost || !latestRoomData) return;
        const v = this.getSetupValidation(latestRoomData);
        if (!v.ok) {
          alert(v.msg);
          return;
        }

        const refObj = (latestRoomData.players || []).find(p => p.id === this.hostDraft.refereeId);
        /* حفظ الترتيب الصريح (order: 1..N) المعتمد من المضيف */
        const cleanCards = this.hostDraft.selectedCards.map((sc, idx) => ({
          cardId: sc.cardId,
          roleName: sc.roleName.trim(),
          order: idx + 1
        }));

        const nextState = {
          phase: "referee_ready",
          refereeId: refObj.id,
          refereeName: refObj.name,
          selectedCards: cleanCards,
          rules: {
            silenceCancelsMafiaKill: Boolean(this.hostDraft.silenceCancelsMafiaKill),
            extraKillerEnabled: Boolean(this.hostDraft.extraKillerEnabled)
          },
          assignments: {},
          playerStatuses: {},
          currentRound: 0,
          roundEvents: {},
          votingSelection: [],
          roundHistory: []
        };

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            gameState: nextState
          });
        } catch (err) {
          alert("تعذر تسليم الحكم: " + err.message);
        }
      },

      /* =====================================================================
         2 & 3 & 4 & 6. لوحة الحكم (مرتّبة حسب ترتيب الأدوار المعتمد من المضيف)
         ===================================================================== */
      renderRefereeView(room, state, container) {
        this.initTimerPrefs();
        const phase = state.phase;
        const activePlayers = this.getActivePlayersList(room, state);
        const alivePlayers = this.getAlivePlayersList(room, state);
        const roundHistory = state.roundHistory || [];

        /* مرحلة استلام الحكم قبل التوزيع العشوائي */
        /* مرحلة استلام الحكم قبل التوزيع العشوائي: عمودان متجاوران بنفس حجم البطاقات + زر توزيع عشوائي مثبت بالأسفل */
        if (phase === "referee_ready") {
          const cardsList = state.selectedCards || [];

          const playersColumnHtml = activePlayers.map((p) => {
            const isMe = (p.id === currentPlayer.id);
            const isHost = (p.id === room.hostId);
            const isOnline = (playerPresenceMap[p.id] === "online");
            const dotClass = isOnline ? "status-dot online" : "status-dot offline";
            const hostIcon = isHost ? `<span class="player-host-icon" title="المضيف" aria-label="المضيف">🏠</span>` : "";
            return `
              <div class="mafia-ref-ready-card ${isMe ? "is-me" : ""}">
                <span class="${dotClass}"></span>
                <span class="mafia-ref-card-label" title="${this.escapeHtml(p.name)}">${this.escapeHtml(p.name)}</span>
                ${hostIcon}
              </div>
            `;
          }).join("");

          const rolesColumnHtml = cardsList.map((sc, idx) => {
            const ord = typeof sc.order === "number" ? sc.order : (idx + 1);
            return `
              <div class="mafia-ref-ready-card is-role-card">
                <span class="mafia-ref-card-num">#${ord}</span>
                <span class="mafia-ref-card-svg">${this.renderCardSVG(sc.cardId, "sm")}</span>
                <span class="mafia-ref-card-label" title="${this.escapeHtml(sc.roleName)}">${this.escapeHtml(sc.roleName)}</span>
              </div>
            `;
          }).join("");

          const mismatchWarning = activePlayers.length !== cardsList.length
            ? `<div class="mafia-alert-box danger">⚠️ تنبيه: عدد اللاعبين الحالي (${activePlayers.length}) لا يطابق عدد البطاقات (${cardsList.length}). تأكد من تواجد جميع اللاعبين قبل التوزيع.</div>`
            : "";

          container.innerHTML = `
            <div class="mafia-wrap mafia-app-layout is-ref-ready-screen" data-mafia-phase="referee_ready">
              <div class="mafia-center-flow">
                <div class="mafia-banner mafia-ref-ready-banner">
                  <h3 class="with-whistle center">${getWhistleIcon("is-gold")} لوحة الحكم — استلام إدارة اللعبة</h3>
                </div>

                ${mismatchWarning}

                <div class="mafia-ref-ready-columns">
                  <div class="mafia-ref-ready-col">
                    <div class="mafia-ref-ready-col-head">
                      <span>👥 اللاعبون</span>
                      <span class="mafia-ref-col-count">${activePlayers.length}</span>
                    </div>
                    <div class="mafia-ref-ready-list">
                      ${playersColumnHtml}
                    </div>
                  </div>

                  <div class="mafia-ref-ready-col">
                    <div class="mafia-ref-ready-col-head">
                      <span>🃏 الأدوار</span>
                      <span class="mafia-ref-col-count">${cardsList.length}</span>
                    </div>
                    <div class="mafia-ref-ready-list">
                      ${rolesColumnHtml}
                    </div>
                  </div>
                </div>
              </div>

              <div class="mafia-bottom-dock">
                <button type="button" class="btn mafia-btn-crimson"
                        ${activePlayers.length !== cardsList.length || activePlayers.length === 0 ? "disabled" : ""}
                        onclick="MafiaGame.distributeCardsRandomly()">
                  🎲 توزيع عشوائي
                </button>
              </div>
            </div>
          `;
          return;
        }

        /* شريط التبويبات والإحصائيات الدائم في لوحة الحكم بعد التوزيع */
        const roundLabel = state.currentRound > 0 ? `الجولة ${state.currentRound}` : "قبل الجولة الأولى";
        const topSummaryHtml = `
          <div class="mafia-banner" style="padding:12px;">
            <h3 class="with-whistle center">${getWhistleIcon("is-gold")} لوحة الحكم — ${roundLabel}</h3>
            <p>القائمة مرتّبة حسب تسلسل الأدوار المعتمد لكل جولة (سري للحكم فقط).</p>
          </div>
          <div class="mafia-stats-bar">
            <div class="mafia-stat-box">
              <span class="mafia-stat-val">${state.currentRound || 0}</span>
              <span class="mafia-stat-lbl">رقم الجولة</span>
            </div>
            <div class="mafia-stat-box">
              <span class="mafia-stat-val done">${alivePlayers.length}</span>
              <span class="mafia-stat-lbl">المتبقون نشطين</span>
            </div>
            <div class="mafia-stat-box">
              <span class="mafia-stat-val warn">${activePlayers.length - alivePlayers.length}</span>
              <span class="mafia-stat-lbl">خارج اللعبة</span>
            </div>
          </div>
          <div class="mafia-tabs">
            <button type="button" class="mafia-tab-btn ${this.refereeTab === "board" ? "active" : ""}" onclick="MafiaGame.setRefereeTab('board')">
              🎮 الجولة
            </button>
            <button type="button" class="mafia-tab-btn ${this.refereeTab === "history" ? "active" : ""}" onclick="MafiaGame.setRefereeTab('history')">
              📜 السجل (${roundHistory.length})
            </button>
            <button type="button" id="mafia-timer-trigger-btn" class="mafia-tab-btn mafia-timer-trigger ${this.getTimerTriggerClass()}" onclick="MafiaGame.openTimerModal()">
              ${this.getTimerTriggerLabel()}
            </button>
          </div>
        `;

        if (this.refereeTab === "history") {
          container.innerHTML = `
            <div class="mafia-wrap">
              ${topSummaryHtml}
              ${this.buildRoundHistoryHtml(roundHistory)}
            </div>
          `;
          return;
        }

        /* عرض لوحة إدارة الجولة بحسب المرحلة */
        let mainBodyHtml = "";

        if (phase === "distributed" || phase === "round_ready") {
          const nextRoundNum = (state.currentRound || 0) + 1;
          const startBtnText = `🌙 المدينة تنام ${this.formatRoundEmoji(nextRoundNum)}`;

          mainBodyHtml = `
            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span>🃏 بطاقات وأدوار اللاعبين (مرتّبة حسب الأدوار)</span>
              </div>
              ${this.buildRefereePlayersCardsHtml(room, state, false)}
            </div>

            ${alivePlayers.length > 0 ? `
              <button type="button" class="btn mafia-btn-emerald" onclick="MafiaGame.startNextRound()">
                ${startBtnText}
              </button>
            ` : `
              <div class="mafia-alert-box danger">لم يبقَ أي لاعب نشط داخل اللعبة.</div>
            `}

            ${state.currentRound >= 1 ? `
              <button type="button" class="btn btn-secondary" onclick="MafiaGame.finishGame()">
                🏁 إنهاء المباراة وكشف جميع الأدوار للكل
              </button>
            ` : ""}
          `;
        } else if (phase === "round_active") {
          const evalRes = this.evaluateRoundEvents(room, state);
          const cancelNoticeHtml = evalRes.mafiaKillCancelled ? `
            <div class="mafia-alert-box danger">
              ⚠️ <strong>قاعدة السكوت مفعّلة:</strong> أُلغيت قتلة المافيا وأُلغي السكوت عن (${evalRes.silencedMafiaPlayers.map(x => this.escapeHtml(x.name)).join("، ")}) في هذه الجولة.
            </div>
          ` : "";

          mainBodyHtml = `
            ${cancelNoticeHtml}
            <div class="mafia-panel">
              <div class="mafia-panel-title">
                <span>⚡ أدوات الحكم حسب ترتيب الأدوار (${alivePlayers.length})</span>
              </div>
              ${this.buildRefereePlayersCardsHtml(room, state, true)}
            </div>

            <button type="button" class="btn mafia-btn-gold" onclick="MafiaGame.goToVotingStep()">
              ☀️ المدينة تصحى
            </button>
          `;
        } else if (phase === "voting_elimination") {
          mainBodyHtml = this.buildVotingEliminationHtml(room, state);
        } else if (phase === "game_over") {
          mainBodyHtml = `
            <div class="mafia-alert-box success">
              🏁 <strong>انتهت المباراة!</strong> تم كشف جميع الأدوار وسجل الجولات لجميع المشاركين.
            </div>
            <div class="mafia-panel">
              <div class="mafia-panel-title"><span>📋 التوزيع النهائي وحالات اللاعبين</span></div>
              ${this.buildRefereePlayersCardsHtml(room, state, false)}
            </div>
            ${currentPlayer.isHost ? `
              <button type="button" class="btn mafia-btn-gold" onclick="MafiaGame.restartNewMatch()">
                🔄 إعداد مباراة مافيا جديدة
              </button>
            ` : ""}
          `;
        }

        container.innerHTML = `
          <div class="mafia-wrap">
            ${topSummaryHtml}
            ${mainBodyHtml}
          </div>
        `;
      },

      setRefereeTab(tabName) {
        this.refereeTab = tabName;
        window.scrollTo(0, 0);
        if (latestRoomData) this.render(latestRoomData);
      },

buildRefereePlayersCardsHtml(room, state, showActionControls) {
        const sortedPlayers = this.sortPlayersByRoleOrder(this.getActivePlayersList(room, state), state);
        const assignments = state.assignments || {};
        const statuses = state.playerStatuses || {};
        const rules = this.getRules(state);
        const evalRes = showActionControls ? this.evaluateRoundEvents(room, state) : null;
        const roundEvents = state.roundEvents || {};

        const aliveList = sortedPlayers.filter(p => !(statuses[p.id] && statuses[p.id].isOut));
        const outList = sortedPlayers.filter(p => statuses[p.id] && statuses[p.id].isOut);

        const renderOne = (p, isOutPlayer) => {
          const asg = assignments[p.id] || { cardId: "AS", roleName: "—", order: null };
          const st = statuses[p.id] || { status: "active", isOut: false };
          const isMafia = this.isMafiaRole(asg.roleName);
          const ev = roundEvents[p.id] || {};
          const pe = (evalRes && evalRes.perPlayer && evalRes.perPlayer[p.id]) || {
            rawKillMafia: false,
            rawKillOther: false,
            rawKilledAny: false,
            effectiveKillMafia: false,
            effectiveKillOther: false,
            effectiveKilled: false,
            mafiaKillWasCancelledHere: false,
            healed: false,
            rawSilenced: false,
            silenceCancelledOnThisPlayer: false,
            effectiveSilenced: false,
            saved: false,
            dies: false
          };

          const stInfo = this.getStatusInfo(st);
          const orderBadge = typeof asg.order === "number"
            ? `<span class="mafia-order-badge">#${asg.order}</span>`
            : "";
          const mafiaRecognizedTag = (rules.silenceCancelsMafiaKill && isMafia)
            ? `<span class="m-badge m-badge-mafia-tag">🩸 مافيا</span>`
            : "";

          let extraCardCls = isOutPlayer ? "is-out" : "";
          let liveBadges = "";

          if (!isOutPlayer && showActionControls) {
            if (pe.saved) {
              extraCardCls = "is-saved";
              liveBadges += `<span class="m-badge m-badge-healed">💚 مداواة (يبقى في اللعبة)</span>`;
            } else if (pe.dies) {
              extraCardCls = "is-killed";
              if (rules.extraKillerEnabled) {
                if (pe.effectiveKillMafia) {
                  liveBadges += `<span class="m-badge m-badge-killed">🔫 مقتول (المافيا)</span>`;
                }
                if (pe.effectiveKillOther) {
                  liveBadges += `<span class="m-badge m-badge-other-kill">🗡️ مقتول (قاتل آخر)</span>`;
                }
                if (pe.effectiveKillUnspecified) {
                  liveBadges += `<span class="m-badge m-badge-killed">🔪 مقتول (حدد القاتل)</span>`;
                }
              } else {
                liveBadges += `<span class="m-badge m-badge-killed">💀 مقتول (يخرج عند الانتقال)</span>`;
              }
            } else if (pe.healed) {
              liveBadges += `<span class="m-badge m-badge-healed">💉 علاج</span>`;
            }

            if (pe.mafiaKillWasCancelledHere) {
              liveBadges += `<span class="m-badge m-badge-cancelled">🚫 قتلة المافيا ملغاة</span>`;
            }

            if (pe.silenceCancelledOnThisPlayer) {
              liveBadges += `<span class="m-badge m-badge-cancelled">🤐 سكوت ملغي (أُلغيت قتلة المافيا)</span>`;
            } else if (pe.effectiveSilenced) {
              liveBadges += `<span class="m-badge m-badge-silenced">🤐 سكوت</span>`;
            }
          }

          let outBadgeHtml = "";
          if (isOutPlayer) {
            outBadgeHtml = `
              <span class="m-badge ${stInfo.cls}">${stInfo.icon} ${stInfo.text}</span>
              <span class="m-badge m-badge-out">خارج اللعبة${st.outRound ? " (ج" + st.outRound + ")" : ""}</span>
            `;
          } else {
            outBadgeHtml = `<span class="m-badge ${stInfo.cls}">${stInfo.icon} ${stInfo.text}</span>`;
          }

          /* الشريط المضيء المميّز الذي يظهر أسفل الأزرار لتحديد مصدر القتل (المافيا أو قاتل آخر أو كلاهما) */
          let killGlowStripHtml = "";
          if (!isOutPlayer && showActionControls && rules.extraKillerEnabled && Boolean(ev.killed)) {
            const isMafiaActive = Boolean(ev.killMafia);
            const isOtherActive = Boolean(ev.killOther);
            killGlowStripHtml = `
              <div class="mafia-kill-glow-box">
                <div class="mafia-kill-glow-title">✨ حدد من استهدف هذا اللاعب بالقتل (يمكن تفعيل الاثنين معاً):</div>
                <div class="mafia-kill-glow-buttons">
                  <button type="button" class="mafia-glow-btn ${isMafiaActive ? "on-mafia" : ""}" onclick="MafiaGame.toggleKillChoice('${p.id}', 'killMafia')">
                    🔫 المافيا ${isMafiaActive ? "✓" : ""}
                  </button>
                  <button type="button" class="mafia-glow-btn ${isOtherActive ? "on-other" : ""}" onclick="MafiaGame.toggleKillChoice('${p.id}', 'killOther')">
                    🗡️ قاتل آخر ${isOtherActive ? "✓" : ""}
                  </button>
                </div>
              </div>
            `;
          }

          const isKilledBtnActive = Boolean(ev.killed);
          const actionsHtml = (!isOutPlayer && showActionControls) ? `
            <div class="mafia-action-row">
              <button type="button" class="mafia-act-btn ${ev.silenced ? "on-silence" : ""}" onclick="MafiaGame.togglePlayerRoundAction('${p.id}', 'silenced')">
                🤐 سكوت
              </button>
              <button type="button" class="mafia-act-btn ${isKilledBtnActive ? "on-kill" : ""}" onclick="MafiaGame.toggleKillAction('${p.id}')">
                🔪 مقتول
              </button>
              <button type="button" class="mafia-act-btn ${ev.healed ? "on-heal" : ""}" onclick="MafiaGame.togglePlayerRoundAction('${p.id}', 'healed')">
                💉 علاج
              </button>
            </div>
            ${killGlowStripHtml}
          ` : "";

          return `
            <div class="mafia-ref-player-card ${extraCardCls}">
              <div class="mafia-ref-player-top">
                <div class="mafia-ref-player-info">
                  ${this.renderCardSVG(asg.cardId, "sm")}
                  <div class="mafia-ref-player-text">
                    <span class="mafia-player-name">${this.escapeHtml(p.name)}</span>
                    <span class="mafia-player-role">${orderBadge} 🎭 ${this.escapeHtml(asg.roleName)} ${mafiaRecognizedTag}</span>
                    <div class="mafia-badges-row">
                      ${outBadgeHtml}
                      ${liveBadges}
                    </div>
                  </div>
                </div>
              </div>
              ${actionsHtml}
            </div>
          `;
        };

        let html = aliveList.map(p => renderOne(p, false)).join("");
        if (outList.length > 0) {
          html += `
            <div style="margin-top:12px; padding-top:10px; border-top:1px dashed var(--border);">
              <div style="font-size:0.8rem; color:var(--text-muted); font-weight:700; margin-bottom:8px;">
                🚫 لاعبون خارج اللعبة (${outList.length}) — لا يعودون للجولات التالية
              </div>
              ${outList.map(p => renderOne(p, true)).join("")}
            </div>
          `;
        }
        return html;
      },

      buildRoundSummaryCardHtml(room, state, options) {
        const opts = options || {};
        const includeSecret = Boolean(opts.includeSecret);
        const secretTitle = opts.secretTitle || "🔒 كواليس الجولة";
        const showDiscussionNote = Boolean(opts.showDiscussionNote);

        const evalRes = this.evaluateRoundEvents(room, state);
        const killedOut = evalRes.killedOut || [];
        const silencedList = evalRes.silencedList || [];

        const fmtKilledShort = (names) => {
          if (!names || names.length === 0) return "💀 لم يُقتل أحد";
          const joined = names.map(n => this.escapeHtml(n)).join("، ");
          return names.length === 1 ? `💀 ${joined} مقتول` : `💀 ${joined} مقتولين`;
        };

        const fmtSilencedShort = (names) => {
          if (!names || names.length === 0) return "🤐 لا يوجد سكوت";
          const joined = names.map(n => this.escapeHtml(n)).join("، ");
          return names.length === 1 ? `🤐 ${joined} يسكت` : `🤐 ${joined} يسكتوا`;
        };

        const publicSectionHtml = `
          <div class="mafia-summary-sec-public">
            <div class="mafia-summary-sec-title">📢 الخلاصة المعلنة</div>
            <div class="mafia-secret-event-line">${fmtKilledShort(killedOut.map(p => p.name))}</div>
            <div class="mafia-secret-event-line">${fmtSilencedShort(silencedList.map(p => p.name))}</div>
          </div>
        `;

        let secretSectionHtml = "";
        if (includeSecret) {
          const secretLines = this.buildSecretEventLines({
            mafiaKillCancelled: evalRes.mafiaKillCancelled,
            killedByMafia: evalRes.killedByMafiaList,
            killedByOther: evalRes.killedByOtherList,
            killedUnspecified: evalRes.killedUnspecifiedList,
            killedTargets: evalRes.killedTargetsAll,
            healedTargets: evalRes.healedTargetsAll,
            savedByHeal: evalRes.savedByHeal,
            silenced: evalRes.silencedList,
            silencedMafiaCancelled: evalRes.silencedMafiaPlayers,
            eliminatedByVote: []
          });

          const secretLinesHtml = secretLines.length > 0
            ? secretLines.map(item => `<div class="mafia-secret-event-line ${item.isCancelled ? "is-cancelled" : ""}">${item.html}</div>`).join("")
            : `<div class="mafia-secret-event-line is-empty">لا توجد أحداث في هذه الجولة</div>`;

          secretSectionHtml = `
            <div class="mafia-summary-sec-secret">
              <div class="mafia-summary-secret-title">${secretTitle}</div>
              ${secretLinesHtml}
            </div>
          `;
        }

        const discussionHtml = showDiscussionNote
          ? `<div style="font-size:0.76rem; color:var(--text-muted); text-align:center; margin-top:2px;">🗣️ النقاش والتصويت الشفهي جارٍ الآن...</div>`
          : "";

        return `
          <div class="mafia-panel" style="border-color: rgba(239, 68, 68, 0.35);">
            <div class="mafia-panel-title"><span>☀️ ملخص أحداث الجولة ${state.currentRound || 1}</span></div>
            <div class="mafia-summary-split">
              ${publicSectionHtml}
              ${secretSectionHtml}
              ${discussionHtml}
            </div>
          </div>
        `;
      },

      buildVotingEliminationHtml(room, state) {
        const evalRes = this.evaluateRoundEvents(room, state);
        const killedOut = evalRes.killedOut || [];
        const eligibleForVote = evalRes.eligibleForVote || [];
        const votingSelection = state.votingSelection || [];
        const assignments = state.assignments || {};

        const nightSummaryHtml = this.buildRoundSummaryCardHtml(room, state, {
          includeSecret: true,
          secretTitle: "🔒 تفاصيل سرية للحكم",
          showDiscussionNote: false
        });

        const voteRowsHtml = eligibleForVote.length === 0
          ? `<p style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:8px;">لا يوجد لاعبون متبقون لتحديد خروجهم بالتصويت.</p>`
          : eligibleForVote.map(p => {
              const isMarked = votingSelection.includes(p.id);
              const asg = assignments[p.id] || { cardId: "AS", roleName: "—", order: null };
              const orderBadge = typeof asg.order === "number" ? `<span class="mafia-order-badge">#${asg.order}</span>` : "";
              return `
                <div class="mafia-vote-row ${isMarked ? "marked-out" : ""}">
                  <div style="display:flex; align-items:center; gap:10px; min-width:0;">
                    ${this.renderCardSVG(asg.cardId, "sm")}
                    <div style="min-width:0;">
                      <div class="mafia-player-name">${this.escapeHtml(p.name)}</div>
                      <div class="mafia-player-role">${orderBadge} 🎭 ${this.escapeHtml(asg.roleName)}</div>
                    </div>
                  </div>
                  <button type="button" class="mafia-x-btn ${isMarked ? "active" : ""}" onclick="MafiaGame.toggleVoteOutPlayer('${p.id}')" title="تحديد خروج بالتصويت">
                    ✕
                  </button>
                </div>
              `;
            }).join("");

        const hasVoteSelected = votingSelection.length > 0;
        const hasAnyExit = hasVoteSelected || killedOut.length > 0;

        return `
          ${nightSummaryHtml}

          <div class="mafia-panel">
            <div class="mafia-panel-title">
              <span>🗣️ نتيجة التصويت الشفهي</span>
            </div>
            ${voteRowsHtml}
          </div>

          ${hasVoteSelected ? `
            <button type="button" class="btn mafia-btn-crimson" onclick="MafiaGame.confirmRoundTransition()">
              ✅ تأكيد خروج اللاعبين (${votingSelection.length + killedOut.length}) وإغلاق الجولة
            </button>
          ` : `
            <button type="button" class="btn ${hasAnyExit ? "mafia-btn-crimson" : "mafia-btn-emerald"}" onclick="MafiaGame.confirmRoundTransition()">
              ${hasAnyExit
                ? `✅ تأكيد خروج المقتولين (${killedOut.length}) وإغلاق الجولة`
                : "✅ تأكيد إغلاق الجولة (بدون خروج أحد)"}
            </button>
          `}

          <button type="button" class="btn btn-secondary" onclick="MafiaGame.backToRoundActions()">
            ↩️ رجوع لتعديل أحداث الجولة ${state.currentRound}
          </button>
        `;
      },

      buildRoundHistoryHtml(roundHistory) {
        if (!roundHistory || roundHistory.length === 0) {
          return `
            <div class="mafia-panel" style="text-align:center; padding:22px 12px; color:var(--text-muted); font-size:0.85rem;">
              📜 لا توجد جولات مكتملة في السجل بعد.
            </div>
          `;
        }
        const reversed = [...roundHistory].reverse();
        const items = reversed.map(entry => {
          const lines = this.buildSecretEventLines(entry);
          const linesHtml = lines.length > 0
            ? lines.map(item => `<div class="mafia-secret-event-line ${item.isCancelled ? "is-cancelled" : ""}">${item.html}</div>`).join("")
            : `<div class="mafia-secret-event-line is-empty">لا توجد أحداث في هذه الجولة</div>`;

          return `
            <div class="mafia-log-card">
              <div class="mafia-log-head">
                <span>📌 الجولة ${entry.roundNumber}</span>
                <span style="font-size:0.74rem; color:var(--text-muted);">المتبقون بعدها: ${entry.remainingCount}</span>
              </div>
              <div style="display:flex; flex-direction:column; gap:5px;">
                ${linesHtml}
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="mafia-panel">
            <div class="mafia-panel-title">
              <span>📜 سجل الجولات السابقة</span>
            </div>
            ${items}
          </div>
        `;
      },

      /* السجل العام لبقية اللاعبين (بدون كشف الأدوار أو العلاج أو مصدر القتل أو إلغاء المافيا) */
      buildPublicRoundHistoryHtml(roundHistory) {
        if (!roundHistory || roundHistory.length === 0) {
          return `
            <div class="mafia-panel" style="text-align:center; padding:22px 12px; color:var(--text-muted); font-size:0.85rem;">
              📜 لا توجد جولات مكتملة في السجل بعد.
            </div>
          `;
        }
        const fmtKilledShort = (names) => {
          if (!names || names.length === 0) return "💀 لم يُقتل أحد";
          const joined = names.map(n => this.escapeHtml(n)).join("، ");
          return names.length === 1 ? `💀 ${joined} مقتول` : `💀 ${joined} مقتولين`;
        };
        const fmtSilencedShort = (names) => {
          if (!names || names.length === 0) return "🤐 لا يوجد سكوت";
          const joined = names.map(n => this.escapeHtml(n)).join("، ");
          return names.length === 1 ? `🤐 ${joined} يسكت` : `🤐 ${joined} يسكتوا`;
        };
        const fmtVotedShort = (names) => {
          if (!names || names.length === 0) return "";
          const joined = names.map(n => this.escapeHtml(n)).join("، ");
          return `🗳️ التصويت أخرج ${joined}`;
        };

        const reversed = [...roundHistory].reverse();
        const items = reversed.map(entry => {
          const killedNames = (entry.eliminatedByKill || []).map(x => x.name);
          const silencedNames = (entry.silenced || []).map(x => x.name);
          const votedNames = (entry.eliminatedByVote || []).map(x => x.name);
          const votedLine = fmtVotedShort(votedNames);
          return `
            <div class="mafia-log-card">
              <div class="mafia-log-head">
                <span>📌 الجولة ${entry.roundNumber}</span>
                <span style="font-size:0.74rem; color:var(--text-muted);">المتبقون بعدها: ${entry.remainingCount}</span>
              </div>
              <div style="display:flex; flex-direction:column; gap:5px;">
                <div class="mafia-secret-event-line">${fmtKilledShort(killedNames)}</div>
                <div class="mafia-secret-event-line">${fmtSilencedShort(silencedNames)}</div>
                ${votedLine ? `<div class="mafia-secret-event-line">${votedLine}</div>` : ""}
              </div>
            </div>
          `;
        }).join("");

        return `
          <div class="mafia-panel">
            <div class="mafia-panel-title">
              <span>📜 سجل الجولات السابقة</span>
            </div>
            ${items}
          </div>
        `;
      },

      /* بناء صندوق نتائج الجولة العلنية للاعبين قبل التصويت (صياغة مختصرة بدون ذكر العلاج أو المصدر) */
      buildPublicRoundResultBanner(room, state, isSpectator) {
        if (state.phase !== "voting_elimination") return "";
        return this.buildRoundSummaryCardHtml(room, state, {
          includeSecret: Boolean(isSpectator),
          secretTitle: "🔒 كواليس الجولة",
          showDiscussionNote: true
        });
      },

      renderPlayerView(room, state, container) {
        const phase = state.phase;
        const assignments = state.assignments || {};
        const statuses = state.playerStatuses || {};
        const activePlayers = this.getActivePlayersList(room, state);
        const alivePlayers = this.getAlivePlayersList(room, state);
        const roundHistory = state.roundHistory || [];

        if (phase === "referee_ready") {
          container.innerHTML = `
            <div class="mafia-wrap mafia-app-layout" data-mafia-phase="referee_ready">
              <div class="mafia-center-flow">
                <div class="mafia-banner">
                  <div style="font-size: 2.6rem; margin-bottom: 8px;">🃏</div>
                  <h3>تم تسليم الإدارة للحكم</h3>
                  <p>الحكم <strong>(${this.escapeHtml(state.refereeName)})</strong> يستعد الآن لتوزيع البطاقات عشوائياً على اللاعبين...</p>
                </div>
              </div>
              ${this.renderWaitingProgressBar("referee_ready", state)}
            </div>
          `;
          return;
        }

        const myAssignment = assignments[currentPlayer.id];
        const myStatus = statuses[currentPlayer.id];

        /* في حال انضمام مشاهد لم يكن ضمن التوزيع */
        if (!myAssignment) {
          container.innerHTML = `
            <div class="mafia-wrap">
              <div class="mafia-banner">
                <h3>🎭 مباراة المافيا جارية</h3>
                <p>بدأت هذه المباراة قبل انضمامك. انتظر الجولة أو المباراة القادمة للمشاركة.</p>
              </div>
            </div>
          `;
          return;
        }

        /* حالة انتهاء المباراة: كشف كامل للجميع */
        if (phase === "game_over") {
          container.innerHTML = `
            <div class="mafia-wrap">
              <div class="mafia-banner">
                <h3>🏁 انتهت مباراة المافيا!</h3>
                <p>تم كشف جميع الأدوار وسجل الجولات للجميع.</p>
              </div>
              ${this.buildAllRolesRevealBox(room, state)}
              ${this.buildRoundHistoryHtml(roundHistory)}
            </div>
          `;
          return;
        }

        if (!this.playerTab) this.playerTab = "game";

        /* 5. اللاعب الخارج (وضع المشاهد): نفس تصميم إعلان النتائج والسجل والأدوار مثل الحكم تماماً (للقراءة فقط) */
        if (myStatus && myStatus.isOut) {
          const spectatorRoundBannerHtml = this.buildPublicRoundResultBanner(room, state, true);
          const exitReasonText = myStatus.outReason === "killed"
            ? `خرجت بالقتل دون مداواة في الجولة ${myStatus.outRound || ""}`
            : `خرجت بالإقصاء بالتصويت في الجولة ${myStatus.outRound || ""}`;

          const outTabsHtml = `
            <div class="mafia-player-tabs">
              <button type="button" class="mafia-tab-btn ${this.playerTab === "game" ? "active" : ""}" onclick="MafiaGame.setPlayerTab('game')">
                👁️ الأدوار (${activePlayers.length})
              </button>
              <button type="button" class="mafia-tab-btn ${this.playerTab === "history" ? "active" : ""}" onclick="MafiaGame.setPlayerTab('history')">
                📜 السجل (${roundHistory.length})
              </button>
            </div>
          `;

          container.innerHTML = `
            <div class="mafia-wrap">
              <div class="mafia-banner" style="border-color:#ef4444;">
                <div style="font-size:2rem; margin-bottom:4px;">${myStatus.outReason === "killed" ? "💀" : "🗳️"}</div>
                <h3 style="color:#f87171;">لقد خرجت من اللعبة (وضع المشاهد)</h3>
                <p>${exitReasonText}</p>
                <div style="margin-top:8px; display:inline-flex; align-items:center; gap:8px; background:#0b1120; padding:6px 12px; border-radius:8px; border:1px solid var(--border);">
                  <span style="font-size:0.82rem; color:var(--text-muted);">دورك كان:</span>
                  <strong style="color:#fbbf24;">🎭 ${this.escapeHtml(myAssignment.roleName)}</strong>
                </div>
              </div>

              ${outTabsHtml}

              ${this.playerTab === "history"
                ? this.buildRoundHistoryHtml(roundHistory)
                : `
                  ${spectatorRoundBannerHtml}
                  ${this.buildAllRolesRevealBox(room, state)}
                `}
            </div>
          `;
          return;
        }

        /* اللاعب النشط (لا يزال داخل اللعبة): نفس القالب البصري لإعلان النتائج والسجل لكن بالمعلومات العلنية فقط */
        const publicRoundBannerHtml = this.buildPublicRoundResultBanner(room, state, false);
        const stInfo = this.getStatusInfo(myStatus);
        const roundText = state.currentRound > 0 ? `الجولة ${state.currentRound}` : "البطاقات موزعة — بانتظار بدء الجولة الأولى";

        /* عدم إظهار كلمة "تمت مداواته" للاعبين النشطين حتى لا يُكشف العلاج */
        const safePublicStatus = (myStatus && myStatus.status === "healed_saved")
          ? { text: "نشط", cls: "m-badge-active", icon: "🟢" }
          : stInfo;

        const cardBoxHtml = this.isPlayerCardRevealed
          ? `
            <div class="mafia-secret-card-box revealed-state" onclick="MafiaGame.toggleMyCard()">
              ${this.renderCardSVG(myAssignment.cardId, "lg")}
              <div style="font-size:1.5rem; font-weight:900; color:#fbbf24;">🎭 ${this.escapeHtml(myAssignment.roleName)}</div>
              <div style="font-size:0.76rem; color:var(--text-muted);">(اضغط على البطاقة لإخفائها فوراً)</div>
            </div>
          `
          : `
            <div class="mafia-secret-card-box hidden-state" onclick="MafiaGame.toggleMyCard()">
              <div style="font-size:2.5rem;">🔒</div>
              <h3 style="color:var(--accent);">اضغط هنا لكشف بطاقتك ودورك</h3>
              <p style="font-size:0.78rem; color:var(--text-muted);">تأكد أنه لا أحد ينظر إلى شاشة هاتفك</p>
            </div>
          `;

        const publicPlayersList = `<div class="unified-player-grid">` + activePlayers.map(p => {
          const pSt = statuses[p.id];
          const isOut = Boolean(pSt && pSt.isOut);
          const isMe = (p.id === currentPlayer.id);
          const lifeDotClass = isOut ? "mafia-life-dot dead" : "mafia-life-dot alive";
          const lifeTitle = isOut ? "خارج اللعبة" : "داخل اللعبة";
          const pInfo = this.getStatusInfo(pSt);
          const statusSide = isOut
            ? `<span class="unified-player-side"><span class="m-badge ${pInfo.cls}">${pInfo.icon} ${pInfo.text}</span></span>`
            : "";
          return `
            <div class="unified-player-card ${isMe ? "is-me" : ""} ${isOut ? "is-mafia-out" : ""}">
              <div class="unified-player-meta">
                <span class="${lifeDotClass}" title="${lifeTitle}"></span>
                <div class="player-text-col">
                  <div class="player-name-row">
                    <span class="player-name-text">${this.escapeHtml(p.name)}</span>
                  </div>
                </div>
              </div>
              ${statusSide}
            </div>
          `;
        }).join("") + `</div>`;

        const playerTabsHtml = `
          <div class="mafia-player-tabs">
            <button type="button" class="mafia-tab-btn ${this.playerTab === "game" ? "active" : ""}" onclick="MafiaGame.setPlayerTab('game')">
              🎮 اللعب
            </button>
            <button type="button" class="mafia-tab-btn ${this.playerTab === "history" ? "active" : ""}" onclick="MafiaGame.setPlayerTab('history')">
