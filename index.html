        return { total: 25, cols: 5, startTeam: 9, otherTeam: 8, neutral: 7, assassin: 1, label: "5×5 (25 كلمة)" };
      },

      /* =====================================================================
         نظام الأصوات والاهتزاز (Web Audio API بدون ملفات خارجية)
         ===================================================================== */
      vibrate(pattern) {
        if (!this.prefs.vibration) return;
        if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
          try { navigator.vibrate(pattern); } catch (e) {}
        }
      },

      /* === CODENAMES_V334_DISTINCT_CLICK_SOUNDS === */
      playSound(type) {
        if (!this.prefs.sound) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!this.audioCtx) this.audioCtx = new AudioCtx();
          const ctx = this.audioCtx;

          const runSynth = () => {
            const now = ctx.currentTime + 0.015;

            const beep = (freq, startOff, dur, wave, vol, endFreq, filterFreq) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = wave || "sine";
              osc.frequency.setValueAtTime(freq, now + startOff);
              if (typeof endFreq === "number" && endFreq > 0) {
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + startOff + dur);
              }
              gain.gain.setValueAtTime(0.001, now + startOff);
              gain.gain.exponentialRampToValueAtTime(vol || 0.14, now + startOff + 0.015);
              gain.gain.exponentialRampToValueAtTime(0.001, now + startOff + dur);

              if (typeof filterFreq === "number" && filterFreq > 0) {
                const filter = ctx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.setValueAtTime(filterFreq, now + startOff);
                osc.connect(filter);
                filter.connect(gain);
              } else {
                osc.connect(gain);
              }
              gain.connect(ctx.destination);
              osc.start(now + startOff);
              osc.stop(now + startOff + dur + 0.02);
            };

            if (type === "tap") {
              beep(520, 0, 0.06, "triangle", 0.09);
            } else if (type === "correct") {
              /* صوت الصحيح: نغمة صاعدة مبهجة وواضحة من 3 درجات */
              beep(523.25, 0, 0.11, "sine", 0.16);
              beep(659.25, 0.08, 0.12, "sine", 0.17);
              beep(1046.5, 0.16, 0.24, "sine", 0.18);
              beep(1046.5, 0.16, 0.20, "triangle", 0.06);
            } else if (type === "wrong") {
              /* صوت الخطأ: نغمة تنبيه هابطة مميزة (Buzzer) بنبرتين واضحتين */
              beep(265, 0, 0.14, "sawtooth", 0.16, 225, 850);
              beep(205, 0.16, 0.24, "sawtooth", 0.18, 160, 720);
            } else if (type === "neutral") {
              /* صوت المحايد: طرقة خشبية جوفاء هادئة ومحايدة */
              beep(410, 0, 0.085, "sine", 0.15, 290);
              beep(305, 0.10, 0.10, "triangle", 0.12, 255);
            } else if (type === "turn") {
              beep(440, 0, 0.1, "sine", 0.12);
              beep(349, 0.1, 0.14, "sine", 0.11);
            } else if (type === "timer_end") {
              beep(784, 0, 0.14, "sine", 0.15);
              beep(659, 0.18, 0.18, "sine", 0.15);
            } else if (type === "win") {
              beep(523.25, 0, 0.14, "sine", 0.15);
              beep(659.25, 0.12, 0.14, "sine", 0.15);
              beep(783.99, 0.24, 0.16, "sine", 0.16);
              beep(1046.5, 0.38, 0.28, "sine", 0.18);
            } else if (type === "assassin") {
              beep(220, 0, 0.20, "sawtooth", 0.14, 185, 750);
              beep(155, 0.20, 0.22, "sawtooth", 0.15, 130, 650);
              beep(110, 0.42, 0.34, "sawtooth", 0.16, 85, 550);
            }
          };

          if (ctx.state === "suspended") {
            ctx.resume().then(runSynth).catch(() => {});
          } else {
            runSynth();
          }
        } catch (e) {}
      },

      /* =====================================================================
         أدوات الصلاحيات وحالة الفريق للاعب الحالي
         ===================================================================== */
      hasExplicitSpymasters(state) {
        if (!state || state.playMode === "local") return false;
        const sm = state.spymasters || {};
        return Boolean(sm.red || sm.blue);
      },

      getMyTeam(state) {
        if (!state || state.playMode === "local") return null;
        const sm = state.spymasters || {};
        if (sm.red === currentPlayer.id) return "red";
        if (sm.blue === currentPlayer.id) return "blue";
        const ta = state.teamAssignments || {};
        return ta[currentPlayer.id] || null;
      },

      isAssignedSpymaster(state) {
        if (!state || state.playMode === "local") return false;
        const sm = state.spymasters || {};
        return (sm.red === currentPlayer.id || sm.blue === currentPlayer.id);
      },

      canOpenSpymasterView(state) {
        if (!this.hasExplicitSpymasters(state)) return true;
        return this.isAssignedSpymaster(state);
      },

      /* === CODENAMES_V33_SPY_TOGGLE_FIXES === */
      saveSpyViewPref(matchId, visible) {
        if (!matchId) return;
        try {
          sessionStorage.setItem("eshrah_cn_spyview_" + matchId, visible ? "1" : "0");
        } catch (e) {}
      },

      loadSpyViewPref(matchId) {
        if (!matchId) return null;
        try {
          const v = sessionStorage.getItem("eshrah_cn_spyview_" + matchId);
          if (v === "0") return false;
          if (v === "1") return true;
        } catch (e) {}
        return null;
      },

      canSubmitCurrentClue(state) {
        if (!state || state.phase !== "playing" || state.turnStage !== "spymaster_clue") return false;
        if (!this.hasExplicitSpymasters(state)) {
          return this.isSpymasterView;
        }
        const sm = state.spymasters || {};
        return Boolean(sm[state.currentTeam] && sm[state.currentTeam] === currentPlayer.id);
      },

      canClickCardsNow(state) {
        if (!state || state.phase !== "playing" || state.turnStage !== "operative_guess") return false;
        /* منع القائد منعاً باتاً من التفكير أو تحديد البطاقات أو تأكيدها */
        if (this.isSpymasterView) return false;
        if (this.isAssignedSpymaster(state)) return false;
        const myTeam = this.getMyTeam(state);
        const hasTeams = Object.keys(state.teamAssignments || {}).length > 0;
        if (state.playMode !== "local" && hasTeams && !myTeam) return false;
        if (myTeam && myTeam !== state.currentTeam) return false;
        return true;
      },

      getCardNominations(state, idx) {
        const nomMap = (state && state.nominations && state.nominations[String(idx)]) || {};
        return Object.keys(nomMap)
          .filter(pid => Boolean(nomMap[pid]))
          .map(pid => ({ id: pid, name: nomMap[pid] }));
      },

      buildNominationChipsHtml(noms) {
        if (!noms || noms.length === 0) return "";
        const safeMyId = String(currentPlayer.id || "").replace(/[^a-zA-Z0-9_-]/g, "_");
        const count = noms.length;

        const renderName = (n, sideCls) => {
          const isMe = (n.id === safeMyId || n.id === currentPlayer.id);
          const cls = ["cn-nom-chip", sideCls || "", isMe ? "is-me" : ""].filter(Boolean).join(" ");
          return `<span class="${cls}">${this.escapeHtml(n.name)}</span>`;
        };

        /* 1 أو 2: فوق بعض بعرض البطاقة الكامل بدون إطار */
        if (count <= 2) {
          const items = noms.map(n => renderName(n, "")).join("");
          return `<div class="cn-nom-list nom-stack">${items}</div>`;
        }

        /* 3 أو 4 (أو أكثر): صفّان، كل صف باسمين مزاحين يميناً ويساراً بفاصل | */
        const row1 = `<div class="cn-nom-row is-pair">${renderName(noms[0], "nom-right")}<span class="cn-nom-sep">|</span>${renderName(noms[1], "nom-left")}</div>`;
        let row2 = "";
        if (count === 3) {
          row2 = `<div class="cn-nom-row is-single">${renderName(noms[2], "")}</div>`;
        } else if (count === 4) {
          row2 = `<div class="cn-nom-row is-pair">${renderName(noms[2], "nom-right")}<span class="cn-nom-sep">|</span>${renderName(noms[3], "nom-left")}</div>`;
        } else {
          const extra = count - 3;
          row2 = `<div class="cn-nom-row is-pair">${renderName(noms[2], "nom-right")}<span class="cn-nom-sep">|</span><span class="cn-nom-chip is-more nom-left">+${extra}</span></div>`;
        }
        return `<div class="cn-nom-list nom-rows">${row1}${row2}</div>`;
      },

      buildMyIdentityBarHtml(state) {
        if (state.playMode === "local") {
          return `
            <div class="cn-my-identity-bar id-neutral">
              <div class="cn-id-main">
                <span>📱 وضع الجهاز الواحد</span>
                <span class="cn-id-role-pill">${this.isSpymasterView ? "🕵️ عرض القائد" : "👤 عرض اللاعبين"}</span>
              </div>
            </div>
          `;
        }

        const myTeam = this.getMyTeam(state);
        const isSpy = this.isAssignedSpymaster(state);
        const hasTeams = Object.keys(state.teamAssignments || {}).length > 0;

        if (myTeam === "red" || myTeam === "blue") {
          const teamName = this.getTeamName(state, myTeam);
          const teamDot = myTeam === "red" ? "🔴" : "🔵";
          const isMyTurn = (state.phase === "playing" && state.currentTeam === myTeam);
          let turnPill = "";
          if (isMyTurn) {
            if (isSpy && state.turnStage === "spymaster_clue") {
              turnPill = `<span class="cn-id-turn-now">⚡ دورك لتقديم التلميح</span>`;
            } else if (!isSpy && state.turnStage === "operative_guess") {
              turnPill = `<span class="cn-id-turn-now">⚡ دور فريقك للتخمين</span>`;
            } else {
              turnPill = `<span class="cn-id-role-pill">دور فريقك</span>`;
            }
          }
          return `
            <div class="cn-my-identity-bar id-${myTeam}">
              <div class="cn-id-main">
                <span>${teamDot} أنت في <strong>${this.escapeHtml(teamName)}</strong></span>
                <span class="cn-id-role-pill ${isSpy ? "is-spy" : ""}">${isSpy ? "🕵️ القائد" : "👤 لاعب"}</span>
              </div>
              ${turnPill}
            </div>
          `;
        }

        if (hasTeams) {
          return `
            <div class="cn-my-identity-bar id-neutral">
              <div class="cn-id-main">
                <span>👁️ أنت مشاهد (غير معيّن في فريق)</span>
              </div>
            </div>
          `;
        }

        return `
          <div class="cn-my-identity-bar id-neutral">
            <div class="cn-id-main">
              <span>👥 اللعب المفتوح — لم يتم تعيين فرق</span>
              <span class="cn-id-role-pill">${this.isSpymasterView ? "🕵️ وضع القائد" : "👤 لاعب"}</span>
            </div>
          </div>
        `;
      },

      canControlTimer(state) {
        if (!state || state.phase !== "playing") return false;
        if (state.playMode === "local") return true;
        return Boolean(currentPlayer.isHost);
      },

      canEndTurnByExpiry(state) {
        if (!state || state.phase !== "playing") return false;
        const myTeam = this.getMyTeam(state);
        const oppTeam = state.currentTeam === "red" ? "blue" : "red";
        const hasTeams = Object.keys(state.teamAssignments || {}).length > 0;
        if (state.playMode === "local" || !hasTeams) return true;
        /* عند تعيين الفرق: الفريق المنافس فقط (أو المضيف إذا كان مشاهداً خارج الفريقين) */
        if (myTeam === oppTeam) return true;
        if (!myTeam) return Boolean(currentPlayer.isHost);
        return false;
      },

      getTeamName(state, teamKey) {
        if (teamKey === "red") return (state && state.redName) || "الفريق الأحمر";
        return (state && state.blueName) || "الفريق الأزرق";
      },

      getCounts(state) {
        const types = (state && state.types) || [];
        const revealed = (state && state.revealed) || [];
        let redTotal = 0, redFound = 0, blueTotal = 0, blueFound = 0;
        for (let i = 0; i < types.length; i++) {
          if (types[i] === "red") {
            redTotal++;
            if (revealed[i]) redFound++;
          } else if (types[i] === "blue") {
            blueTotal++;
            if (revealed[i]) blueFound++;
          }
        }
        return {
          redTotal, redFound, redRem: redTotal - redFound,
          blueTotal, blueFound, blueRem: blueTotal - blueFound
        };
      },

      /* =====================================================================
         إدارة المؤقت بالوقت الفعلي (Date.now) دون تعدد مؤقتات أو انحراف
         ===================================================================== */
      formatMMSS(totalSeconds) {
        const s = Math.max(0, Math.ceil(totalSeconds));
        const mins = Math.floor(s / 60);
        const rem = s % 60;
        return String(mins).padStart(2, "0") + ":" + String(rem).padStart(2, "0");
      },

      computeRemainingMs(timerObj) {
        if (!timerObj || timerObj.mode === "off") return null;
        if (timerObj.paused) {
          return Math.max(0, timerObj.pausedRemainingMs || 0);
        }
        if (!timerObj.endAt) return 0;
        return Math.max(0, timerObj.endAt - getServerNow());
      },

      buildTurnTimerPayload(timerConfig, turnStage, isFirstClueForTeam) {
        const mode = (timerConfig && timerConfig.mode) || "off";
        const spymasterSec = (timerConfig && timerConfig.spymasterSec) || 120;
        const operativeSec = (timerConfig && timerConfig.operativeSec) || 120;
        const firstClueBonusSec = (timerConfig && typeof timerConfig.firstClueBonusSec === "number")
          ? timerConfig.firstClueBonusSec
          : 60;

        if (mode === "off") {
          return {
            mode: "off",
            spymasterSec,
            operativeSec,
            firstClueBonusSec,
            paused: false,
            pausedRemainingMs: 0,
            durationMs: 0,
            endAt: 0
          };
        }

        let sec = (turnStage === "spymaster_clue") ? spymasterSec : operativeSec;
        if (turnStage === "spymaster_clue" && isFirstClueForTeam) {
          sec += firstClueBonusSec;
        }
        const durationMs = Math.max(5, sec) * 1000;
        return {
          mode,
          spymasterSec,
          operativeSec,
          firstClueBonusSec,
          paused: false,
          pausedRemainingMs: 0,
          durationMs,
          endAt: getServerNow() + durationMs
        };
      },

      stopTimerLoop() {
        if (this.timerIntervalId) {
          clearInterval(this.timerIntervalId);
          this.timerIntervalId = null;
        }
      },

      syncTimerLoop(room) {
        const isActivePlaying = Boolean(
          room &&
          room.status === "in_game" &&
          room.selectedGame === "codenames" &&
          room.gameState &&
          room.gameState.phase === "playing" &&
          room.gameState.timer &&
          room.gameState.timer.mode !== "off"
        );

        if (!isActivePlaying) {
          this.stopTimerLoop();
          return;
        }

        this.updateTimerDOM(room.gameState);

        if (room.gameState.timer.paused) {
          this.stopTimerLoop();
          return;
        }

        if (!this.timerIntervalId) {
          this.timerIntervalId = setInterval(() => {
            if (!latestRoomData || latestRoomData.status !== "in_game" || latestRoomData.selectedGame !== "codenames") {
              this.stopTimerLoop();
              return;
            }
            const st = latestRoomData.gameState;
            if (!st || st.phase !== "playing" || !st.timer || st.timer.mode === "off" || st.timer.paused) {
              this.stopTimerLoop();
              return;
            }
            this.updateTimerDOM(st);
          }, 250);
        }
      },

      updateTimerDOM(state) {
        if (!state || !state.timer || state.timer.mode === "off") return;
        const clockEl = document.getElementById("cn-timer-clock");
        const barEl = document.getElementById("cn-timer-bar");
        const expWrap = document.getElementById("cn-expire-wrap");
        if (!clockEl) return;

        const remMs = this.computeRemainingMs(state.timer);
        const remSec = Math.ceil(remMs / 1000);
        const durMs = Math.max(1000, state.timer.durationMs || 60000);
        const pct = Math.max(0, Math.min(100, (remMs / durMs) * 100));

        clockEl.innerText = this.formatMMSS(remSec);
        let lvl = "";
        if (remMs <= 0 || remSec <= 10) lvl = "danger";
        else if (remSec <= 20 || pct <= 25) lvl = "warn";

        clockEl.className = "cn-timer-clock " + lvl;
        if (barEl) {
          barEl.style.width = pct + "%";
          barEl.className = "cn-timer-bar-fill " + lvl;
        }

        const isExpired = (remMs <= 0 && !state.timer.paused);
        if (expWrap) {
          expWrap.classList.toggle("show", isExpired);
        }
        const pauseBtn = document.getElementById("cn-timer-pause-btn");
        if (pauseBtn) {
          pauseBtn.disabled = isExpired;
        }

        if (isExpired) {
          const chimeKey = `${state.matchId || ""}_${state.turnId || 0}_${state.turnStage || ""}`;
          if (this.lastExpiredChimeKey !== chimeKey) {
            this.lastExpiredChimeKey = chimeKey;
            this.playSound("timer_end");
            this.vibrate([120, 80, 120]);
          }
        }
      },

      /* =====================================================================
         الموجه الرئيسي للشاشات داخل Codenames
         ===================================================================== */
      render(room) {
        this.loadPrefs();
        const container = document.getElementById("game-container");
        if (!container) return;

        const state = room.gameState || {};
        const phase = state.phase || "splash";

        if (this.lastRenderedPhase && this.lastRenderedPhase !== phase) {
          this.closeModal();
          window.scrollTo(0, 0);
        }
        this.lastRenderedPhase = phase;

        if (state.matchId && state.matchId !== this.lastMatchId) {
          this.lastMatchId = state.matchId;
          this.lastRevealedIdx = -1;
          this.lastKnownRevealedCount = 0;
          this.lastExpiredChimeKey = "";
          this.endingTurnLockKey = "";
          this.clueDraftWord = "";
          this.clueDraftCount = 1;
          if (!this.isAssignedSpymaster(state)) {
            this.isSpymasterView = false;
          } else {
            const savedPref = this.loadSpyViewPref(state.matchId);
            this.isSpymasterView = (savedPref === null) ? true : savedPref;
          }
        }

        if (phase === "splash") {
          this.stopTimerLoop();
          this.closeModal();
          this.lastSetupSignature = "";
          this.renderSplash(room, container);
          return;
        }

        if (phase === "setup") {
          this.stopTimerLoop();
          this.renderSetup(room, container, false);
          return;
        }

        this.lastSetupSignature = "";

        if (phase === "playing") {
          const revArr = state.revealed || [];
          const revCount = revArr.filter(Boolean).length;
          if (revCount > this.lastKnownRevealedCount) {
            this.lastKnownRevealedCount = revCount;
          }
          this.renderPlaying(room, state, container);
          this.syncTimerLoop(room);
          return;
        }

        if (phase === "finished") {
          this.stopTimerLoop();
          this.closeModal();
          this.renderFinished(room, state, container);
          return;
        }

        this.stopTimerLoop();
        this.renderSplash(room, container);
      },

      /* =====================================================================
         1. شاشة البداية (Splash Screen)
         ===================================================================== */
      renderSplash(room, container) {
        const logoHtml = (typeof window.getGameLogoImgHtml === "function")
          ? window.getGameLogoImgHtml("codenames", "cn-splash-logo")
          : `<div class="cn-title-ar">Codenames</div><div class="cn-title-en">CODE NAMES</div>`;

        container.innerHTML = `
          <div id="cn-root">
            <div class="cn-hero">
              <div class="cn-splash-logo-wrap">${logoHtml}</div>
              <p class="cn-tagline">
                تلميح واحد ذكي قد يقود فريقك إلى النصر... أو يشعل فخ كلمة الخطر!
              </p>

              <div class="cn-splash-actions">
                ${currentPlayer.isHost ? `
                  <button type="button" class="cn-btn cn-btn-primary" onclick="CodenamesGame.goToSetup()">
                    🚀 ابدأ اللعبة
                  </button>
                ` : `
                  <div style="background:rgba(15,23,42,0.82); border:1px solid rgba(56,189,248,0.35); border-radius:12px; padding:11px; font-size:0.84rem; color:#cbd5e1;">
                    ⏳ في انتظار المضيف لبدء إعداد المباراة...
                  </div>
                `}

                <div class="cn-splash-row">
                  <button type="button" class="cn-btn cn-btn-ghost" onclick="CodenamesGame.openHowToPlayModal()">
                    📖 طريقة اللعب
                  </button>
                  <button type="button" class="cn-btn cn-btn-ghost" onclick="CodenamesGame.openSettingsModal()">
                    ⚙️ إعدادات
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      /* =====================================================================
         2. شاشة إعداد المباراة (Setup Screen)
         ===================================================================== */
      renderSetup(room, container, forceRender) {
        if (!currentPlayer.isHost) {
          container.innerHTML = `
            <div id="cn-root">
              <div class="cn-hero" style="padding:22px 16px;">
                <div style="font-size:2.4rem; margin-bottom:8px;">🎯</div>
                <h3 style="color:#f8fafc; font-size:1.15rem; margin-bottom:6px;">إعداد مباراة Codenames</h3>
                <p style="font-size:0.86rem; color:#94a3b8; margin-bottom:16px;">
                  يقوم المضيف الآن بضبط أسماء الفرق، توزيع اللاعبين، وإعدادات المؤقت...
                </p>
                <div class="cn-splash-row" style="max-width:300px; margin:0 auto;">
                  <button type="button" class="cn-btn cn-btn-ghost cn-btn-sm" onclick="CodenamesGame.openHowToPlayModal()">📖 طريقة اللعب</button>
                  <button type="button" class="cn-btn cn-btn-ghost cn-btn-sm" onclick="CodenamesGame.openSettingsModal()">⚙️ إعدادات</button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        if (this.setupDraft.roomCode !== room.code) {
          this.setupDraft.roomCode = room.code;
          this.setupDraft.teamAssignments = {};
          this.setupDraft.spymasters = { red: "", blue: "" };
          this.setupDraft.playMode = (room.players && room.players.length >= 2) ? "room" : "local";
        }
        /* === PLATFORM_V347_CN_REMOVE_GRID_MODE_PANEL === */
        this.setupDraft.gridSize = "5x5";
        this.setupDraft.playMode = (room.players && room.players.length >= 2) ? "room" : "local";

        const players = room.players || [];
        const sig = players.map(p => p.id + ":" + p.name).join("|") +
          "#" + this.setupDraft.startingTeam +
          "#" + this.setupDraft.gridSize +
          "#" + this.setupDraft.playMode +
          "#" + this.setupDraft.timerMode +
          "#" + this.setupDraft.spymasterSec + ":" + this.setupDraft.operativeSec + ":" + this.setupDraft.firstClueBonusSec +
          "#" + JSON.stringify(this.setupDraft.teamAssignments) +
          "#" + JSON.stringify(this.setupDraft.spymasters) +
          "#" + String(this.prefs.sound);

        if (!forceRender && this.lastSetupSignature === sig && document.getElementById("cn-setup-root")) {
          return;
        }
        this.lastSetupSignature = sig;

        const d = this.setupDraft;
        const spec = this.getGridSpec(d.gridSize);

        let rosterSectionHtml = "";
        if (d.playMode === "room") {
          const rows = players.map(p => {
            const tm = d.teamAssignments[p.id] || "";
            const isRedSpy = d.spymasters.red === p.id;
            const isBlueSpy = d.spymasters.blue === p.id;
            const isMe = (p.id === currentPlayer.id);
            const isHost = (p.id === room.hostId);
            const isOnline = (playerPresenceMap[p.id] === "online");
            const dotClass = isOnline ? "status-dot online" : "status-dot offline";
            const hostIcon = isHost ? `<span class="player-host-icon" title="المضيف" aria-label="المضيف">🏠</span>` : "";
            return `
              <div class="cn-roster-row ${isMe ? "is-me" : ""}">
                <div class="cn-roster-meta">
                  <span class="${dotClass}"></span>
                  <div class="player-name-row">
                    <span class="cn-roster-name">${this.escapeHtml(p.name)}</span>
                    ${hostIcon}
                  </div>
                </div>
                <div class="cn-roster-btns">
                  <button type="button" class="cn-mini-chip ${tm === "red" ? "is-red" : ""}" onclick="CodenamesGame.assignPlayerTeam('${p.id}', 'red')">أحمر</button>
                  <button type="button" class="cn-mini-chip ${tm === "blue" ? "is-blue" : ""}" onclick="CodenamesGame.assignPlayerTeam('${p.id}', 'blue')">أزرق</button>
                  <button type="button" class="cn-mini-chip ${(isRedSpy || isBlueSpy) ? "is-spy" : ""}" onclick="CodenamesGame.togglePlayerSpymaster('${p.id}')" title="تعيين كقائد للفريق">
                    🕵️ قائد
                  </button>
                </div>
              </div>
            `;
          }).join("");

          rosterSectionHtml = `
            <div class="cn-panel">
              <div class="cn-panel-head">
                <span>👥 توزيع الفرق والقادة</span>
                <button type="button" class="cn-mini-chip is-spy" onclick="CodenamesGame.randomizeTeams()">🎲 توزيع عشوائي</button>
              </div>
              <p style="font-size:0.74rem; color:#94a3b8; margin-bottom:8px;">
                عند تعيين قائد لكل فريق تظهر خريطة الألوان له وحده تلقائياً وتُحجب عن باقي اللاعبين.
              </p>
              ${rows}
            </div>
          `;
        }

        const timerDesc = d.timerMode === "off"
          ? "بدون مؤقت"
          : `${this.getTimerModeLabel(d.timerMode)} • القائد ${this.formatMMSS(d.spymasterSec)} • اللاعبون ${this.formatMMSS(d.operativeSec)} • إضافي أول تلميح +${d.firstClueBonusSec}ث`;

        container.innerHTML = `
          <div id="cn-root">
            <div id="cn-setup-root" style="display:flex; flex-direction:column; gap:12px;">
              <div class="cn-panel">
                <div class="cn-panel-head">
                  <span>🎯 إعدادات مباراة Codenames</span>
                  <button type="button" class="cn-mini-chip" onclick="CodenamesGame.backToSplash()">↩️ البداية</button>
                </div>

                <div class="cn-setup-teams">
                  <div class="cn-team-input-box red">
                    <label>🔴 اسم الفريق الأول</label>
                    <input type="text" id="cn-red-name" value="${this.escapeHtml(d.redName)}" maxlength="20" oninput="CodenamesGame.setupDraft.redName = this.value" />
                  </div>
                  <div class="cn-team-input-box blue">
                    <label>🔵 اسم الفريق الثاني</label>
                    <input type="text" id="cn-blue-name" value="${this.escapeHtml(d.blueName)}" maxlength="20" oninput="CodenamesGame.setupDraft.blueName = this.value" />
                  </div>
                </div>
              </div>

              <div class="cn-panel">
                <div class="cn-panel-head"><span>⚡ الفريق الذي يبدأ أولاً (يمتلك كلمة إضافية)</span></div>
                <div class="cn-seg-group">
                  <button type="button" class="cn-seg-btn ${d.startingTeam === "random" ? "active" : ""}" onclick="CodenamesGame.setSetupField('startingTeam', 'random')">🎲 عشوائي</button>
                  <button type="button" class="cn-seg-btn ${d.startingTeam === "red" ? "active-red" : ""}" onclick="CodenamesGame.setSetupField('startingTeam', 'red')">🔴 الأحمر</button>
                  <button type="button" class="cn-seg-btn ${d.startingTeam === "blue" ? "active-blue" : ""}" onclick="CodenamesGame.setSetupField('startingTeam', 'blue')">🔵 الأزرق</button>
                </div>
              </div>


              ${rosterSectionHtml}

              <div class="cn-panel">
                <div class="cn-panel-head">
                  <span>⏱️ نظام المؤقت والأصوات</span>
                  <button type="button" class="cn-mini-chip is-spy" onclick="CodenamesGame.openTimerSettingsModal()">⚙️ ضبط المؤقت</button>
                </div>
                <div style="font-size:0.8rem; color:#cbd5e1; margin-bottom:10px; background:#0b1120; border:1px solid var(--border); border-radius:9px; padding:8px 10px;">
                  ${timerDesc}
                </div>
                <div class="cn-seg-group cols-2">
                  <button type="button" class="cn-seg-btn ${this.prefs.sound ? "active" : ""}" onclick="CodenamesGame.toggleSoundPref(true)">
                    ${this.prefs.sound ? "🔊 الأصوات: مفعّلة" : "🔇 الأصوات: متوقفة"}
                  </button>
                  <button type="button" class="cn-seg-btn ${this.prefs.vibration ? "active" : ""}" onclick="CodenamesGame.toggleVibrationPref(true)">
                    ${this.prefs.vibration ? "📳 الاهتزاز: مفعّل" : "📴 الاهتزاز: متوقف"}
                  </button>
                </div>
              </div>

              <button type="button" class="cn-btn cn-btn-primary" onclick="CodenamesGame.startNewMatch()">
                🚀 بدء المباراة الآن
              </button>
            </div>
          </div>
        `;
      },

      setSetupField(field, val) {
        this.setupDraft[field] = val;
        if (latestRoomData) {
          this.renderSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      assignPlayerTeam(playerId, team) {
        if (this.setupDraft.teamAssignments[playerId] === team) {
          delete this.setupDraft.teamAssignments[playerId];
          if (this.setupDraft.spymasters.red === playerId) this.setupDraft.spymasters.red = "";
          if (this.setupDraft.spymasters.blue === playerId) this.setupDraft.spymasters.blue = "";
        } else {
          this.setupDraft.teamAssignments[playerId] = team;
          const other = team === "red" ? "blue" : "red";
          if (this.setupDraft.spymasters[other] === playerId) {
            this.setupDraft.spymasters[other] = "";
          }
        }
        if (latestRoomData) {
          this.renderSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      togglePlayerSpymaster(playerId) {
        let team = this.setupDraft.teamAssignments[playerId];
        if (!team) {
          team = !this.setupDraft.spymasters.red ? "red" : "blue";
          this.setupDraft.teamAssignments[playerId] = team;
        }
        if (this.setupDraft.spymasters[team] === playerId) {
          this.setupDraft.spymasters[team] = "";
        } else {
          this.setupDraft.spymasters[team] = playerId;
        }
        if (latestRoomData) {
          this.renderSetup(latestRoomData, document.getElementById("game-container"), true);
        }
      },

      randomizeTeams() {
        if (!latestRoomData) return;
        const players = [...(latestRoomData.players || [])];
        for (let i = players.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = players[i];
          players[i] = players[j];
          players[j] = tmp;
        }
        const ta = {};
        const redIds = [];
        const blueIds = [];
        players.forEach((p, idx) => {
          const tm = (idx % 2 === 0) ? "red" : "blue";
          ta[p.id] = tm;
          if (tm === "red") redIds.push(p.id);
          else blueIds.push(p.id);
        });
        this.setupDraft.teamAssignments = ta;
        this.setupDraft.spymasters = {
          red: redIds.length >= 2 ? redIds[0] : "",
          blue: blueIds.length >= 2 ? blueIds[0] : ""
        };
        this.renderSetup(latestRoomData, document.getElementById("game-container"), true);
      },

      /* =====================================================================
         3. شاشة اللعب النشط (Playing Screen)
         ===================================================================== */
      renderPlaying(room, state, container) {
        const counts = this.getCounts(state);
        const curTeam = state.currentTeam || "red";
        const oppTeam = curTeam === "red" ? "blue" : "red";
        const curTeamName = this.getTeamName(state, curTeam);
        const oppTeamName = this.getTeamName(state, oppTeam);
        const spec = this.getGridSpec(state.gridSize || "5x5");

        /* حماية إضافية: إذا كانت القيادة مخصصة ومقيدة فلا يُسمح لغير القائد برؤية خريطة الألوان */
        if (!this.canOpenSpymasterView(state)) {
          this.isSpymasterView = false;
        }

        const redPct = counts.redTotal > 0 ? Math.round((counts.redFound / counts.redTotal) * 100) : 0;
        const bluePct = counts.blueTotal > 0 ? Math.round((counts.blueFound / counts.blueTotal) * 100) : 0;

        /* الصندوق الموحّد للدور والمؤقت والتلميح */
        const timerEnabled = Boolean(state.timer && state.timer.mode !== "off");
        const remMs = timerEnabled ? this.computeRemainingMs(state.timer) : null;
        const isExpiredNow = Boolean(timerEnabled && remMs <= 0 && !state.timer.paused);
        const canPressExpire = this.canEndTurnByExpiry(state);
        const canControlTimer = this.canControlTimer(state);

        const timerCtrlHtml = timerEnabled ? `
          <div class="cn-unified-timer-ctrl">
            <div id="cn-timer-clock" class="cn-timer-clock">${this.formatMMSS(Math.ceil((remMs || 0) / 1000))}</div>
            ${canControlTimer ? `
              <button type="button" id="cn-timer-pause-btn" class="cn-icon-btn" ${isExpiredNow ? "disabled" : ""} onclick="CodenamesGame.toggleTimerPause()" title="${state.timer.paused ? "استئناف المؤقت" : "إيقاف مؤقت"}">
                ${state.timer.paused ? "▶️" : "⏸️"}
              </button>
              <button type="button" class="cn-icon-btn" onclick="CodenamesGame.openTimerSettingsModal()" title="إعدادات المؤقت">⏱️</button>
            ` : ""}
          </div>
        ` : (canControlTimer ? `
          <button type="button" class="cn-mini-chip" onclick="CodenamesGame.openTimerSettingsModal()">⏱️ تفعيل المؤقت</button>
        ` : "");

        const timerBarHtml = timerEnabled ? `
          <div class="cn-unified-bar-wrap">
            <div id="cn-timer-bar" class="cn-timer-bar-fill"></div>
          </div>
        ` : "";

        const expireWrapHtml = timerEnabled ? `
          <div id="cn-expire-wrap" class="cn-expire-wrap ${isExpiredNow ? "show" : ""}">
            ${canPressExpire ? `
              <button type="button" class="cn-expire-check-btn opp-${curTeam}" onclick="CodenamesGame.endTurnByTimerExpiry(${state.turnId || 1})">
                ✓ انتهى الوقت — إنهاء دور ${this.escapeHtml(curTeamName)}
              </button>
            ` : `
              <div class="cn-expire-note">⏰ انتهى الوقت — يمكن للفريق المنافس إنهاء الدور</div>
            `}
          </div>
        ` : "";

        let stageBodyHtml = "";
        if (state.turnStage === "spymaster_clue") {
          const maxNum = Math.max(1, curTeam === "red" ? counts.redRem : counts.blueRem);
          if (this.clueDraftCount > maxNum) this.clueDraftCount = maxNum;
          if (this.clueDraftCount < 1) this.clueDraftCount = 1;

          if (this.canSubmitCurrentClue(state)) {
            stageBodyHtml = `
              <div style="font-size:0.78rem; font-weight:800; color:${curTeam === "red" ? "#fca5a5" : "#93c5fd"}; margin-bottom:7px;">
                🕵️ أدخل التلميح والعدد لفريقك:
              </div>
              <div class="cn-clue-composer">
                <input type="text" id="cn-clue-word-input" placeholder="كلمة التلميح (مثال: بحر)" maxlength="24"
                       value="${this.escapeHtml(this.clueDraftWord)}"
                       oninput="CodenamesGame.clueDraftWord = this.value" />
                <div class="cn-count-stepper">
                  <button type="button" onclick="CodenamesGame.stepClueCount(-1, ${maxNum})">−</button>
                  <span id="cn-clue-count-val">${this.clueDraftCount}</span>
                  <button type="button" onclick="CodenamesGame.stepClueCount(1, ${maxNum})">+</button>
                </div>
                <button type="button" class="cn-btn cn-btn-sm ${curTeam === "red" ? "cn-btn-red" : "cn-btn-blue"}" style="width:auto; padding:10px 14px;" onclick="CodenamesGame.submitClue()">
                  إرسال التلميح 📨
                </button>
              </div>
            `;
          } else {
            const hintAction = (!this.hasExplicitSpymasters(state) && !this.isSpymasterView)
              ? `<button type="button" class="cn-mini-chip is-spy" style="margin-top:6px;" onclick="CodenamesGame.requestSpymasterToggle()">👁️ إظهار الألوان لتقديم التلميح</button>`
              : "";
            stageBodyHtml = `
              <div style="text-align:center;">
                <div style="font-size:0.86rem; font-weight:800; color:#f8fafc;">
                  🕵️ بانتظار تلميح القائد...
                </div>
                ${hintAction}
              </div>
            `;
          }
        } else {
          const clue = state.currentClue || { word: "—", count: 1 };
          const guessesLeft = typeof state.guessesLeft === "number" ? state.guessesLeft : 1;
          const canPassTurn = this.canClickCardsNow(state) || currentPlayer.isHost;

          stageBodyHtml = `
            <div class="cn-active-clue-bar">
              <div class="cn-clue-main">
                <span class="cn-clue-num-badge ${curTeam}">${clue.count}</span>
                <div>
                  <div style="font-size:0.72rem; color:#94a3b8; font-weight:700;">التلميح الحالي</div>
                  <div class="cn-clue-word">«${this.escapeHtml(clue.word)}»</div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span class="cn-clue-meta">المحاولات: <strong style="color:#fbbf24;">${guessesLeft}</strong></span>
                ${canPassTurn ? `
                  <button type="button" class="cn-btn cn-btn-ghost cn-btn-sm" style="width:auto;" onclick="CodenamesGame.endOperativeTurn(${state.turnId || 1})">
                    إنهاء الدور ⏭️
                  </button>
                ` : ""}
              </div>
            </div>
            ${this.canClickCardsNow(state) ? `<div class="cn-think-hint">👆 اضغط على أي بطاقة للتفكير، ثم اضغط <strong>✓</strong> للتأكيد النهائي</div>` : ""}
          `;
        }

        const cluePanelHtml = `
          <div class="cn-clue-box cn-unified-box ${curTeam}">
            <div class="cn-unified-head">
              <span class="cn-turn-pill ${curTeam}">
                ${curTeam === "red" ? "🔴" : "🔵"} دور ${this.escapeHtml(curTeamName)}
              </span>
              ${timerCtrlHtml}
            </div>
            ${timerBarHtml}
            <div class="cn-unified-body">
              ${stageBodyHtml}
            </div>
            ${expireWrapHtml}
          </div>
        `;

        /* بناء شبكة الكلمات مع علامات التفكير للجميع + زر تأكيد ✓ للمخمّنين + اسم المؤكِّد بعد الكشف */
        const words = state.words || [];
        const types = state.types || [];
        const revealed = state.revealed || [];
        const revealedBy = state.revealedBy || {};
        const canClick = this.canClickCardsNow(state);
        const myTeam = this.getMyTeam(state);

        const cardsHtml = words.map((word, idx) => {
          const isRev = Boolean(revealed[idx]);
          const justRev = (idx === this.lastRevealedIdx && isRev);

          if (isRev) {
            const t = types[idx];
            const revCls = t === "red" ? "rev-red" : (t === "blue" ? "rev-blue" : (t === "assassin" ? "rev-assassin" : "rev-neutral"));
            const dimCls = this.isSpymasterView ? "spy-dimmed" : "";
            const pickerName = revealedBy[String(idx)] || "";
            const icon = t === "assassin" ? "☠️" : "✓";
            const pickerHtml = pickerName
              ? `<span class="cn-picker-badge" title="اختارها: ${this.escapeHtml(pickerName)}">${icon} ${this.escapeHtml(pickerName)}</span>`
              : `<span class="cn-card-tag">${t === "assassin" ? "☠️" : (t === "red" ? "🔴" : (t === "blue" ? "🔵" : "✓"))}</span>`;
            return `
              <div class="cn-card is-revealed ${revCls} ${dimCls} ${justRev ? "just-revealed" : ""}">
                <span>${this.escapeHtml(word)}</span>
                ${pickerHtml}
              </div>
            `;
          }

          /* علامات التفكير يراها الجميع (القادة والفريقان) */
          const noms = this.getCardNominations(state, idx);
          const hasNom = noms.length > 0;
          const nomChipsHtml = this.buildNominationChipsHtml(noms);
          const nomTitle = hasNom ? `title="تفكير: ${this.escapeHtml(noms.map(n => n.name).join("، "))}"` : "";
          const nomCls = hasNom ? `has-nom nom-${curTeam}` : "";

          /* وضع القائد: يرى الخريطة السرية وعلامات تفكير اللاعبين دون أي إمكانية للنقر أو التفكير */
          if (this.isSpymasterView && this.canOpenSpymasterView(state)) {
            const t = types[idx];
            const spyCls = t === "red" ? "spy-red" : (t === "blue" ? "spy-blue" : (t === "assassin" ? "spy-assassin" : "spy-neutral"));
            const dot = t === "assassin" ? "☠️" : (t === "red" ? "🔴" : (t === "blue" ? "🔵" : "⚪"));
            return `
              <div class="cn-card is-locked ${spyCls} ${nomCls}" ${nomTitle}>
                <span class="cn-spy-dot">${dot}</span>
                <span>${this.escapeHtml(word)}</span>
                ${nomChipsHtml}
              </div>
            `;
          }

          /* بطاقة اللاعبين: النقر على البطاقة يحدد للتفكير، والنقر على زر ✓ يكشف البطاقة نهائياً */
          const confirmBtnHtml = (canClick && hasNom)
            ? `<button type="button" class="cn-confirm-pick-btn" title="تأكيد اختيار البطاقة" onclick="event.stopPropagation(); CodenamesGame.revealCard(${idx})">✓</button>`
            : "";

          if (canClick) {
            return `
              <div class="cn-card ${nomCls}" role="button" tabindex="0" ${nomTitle}
                   onclick="CodenamesGame.toggleCardNomination(${idx})">
                ${confirmBtnHtml}
                <span>${this.escapeHtml(word)}</span>
                ${nomChipsHtml}
              </div>
            `;
          }

          return `
            <div class="cn-card is-locked ${nomCls}" ${nomTitle}>
              <span>${this.escapeHtml(word)}</span>
              ${nomChipsHtml}
            </div>
          `;
        }).join("");

        const spyToggleBtnHtml = this.canOpenSpymasterView(state) ? `
          <button type="button" class="cn-btn cn-btn-sm ${this.isSpymasterView ? "cn-btn-amber" : "cn-btn-ghost"}" onclick="CodenamesGame.requestSpymasterToggle()">
            ${this.isSpymasterView ? "🙈 إخفاء الألوان" : "👁️ إظهار الألوان"}
          </button>
        ` : `
          <button type="button" class="cn-btn cn-btn-sm cn-btn-ghost" onclick="CodenamesGame.openHowToPlayModal()">
            📖 القواعد
          </button>
        `;

        const activeClueInputFocused = document.activeElement && document.activeElement.id === "cn-clue-word-input";

        container.innerHTML = `
          <div id="cn-root">
            <div class="cn-scoreboard">
              <div class="cn-score-card red ${curTeam === "red" ? "active-red" : ""}">
                <div class="cn-score-top">
                  <span class="cn-score-name">🔴 ${this.escapeHtml(state.redName || "الفريق الأحمر")}</span>
                  <span class="cn-score-rem">${counts.redRem}</span>
                </div>
                <div class="cn-progress-track"><div class="cn-progress-fill red" style="width:${redPct}%;"></div></div>
                <div class="cn-score-sub">
                  <span>المتبقي</span>
                  <span>مكتشف: ${counts.redFound}/${counts.redTotal}</span>
                </div>
              </div>

              <div class="cn-score-card blue ${curTeam === "blue" ? "active-blue" : ""}">
                <div class="cn-score-top">
                  <span class="cn-score-name">🔵 ${this.escapeHtml(state.blueName || "الفريق الأزرق")}</span>
                  <span class="cn-score-rem">${counts.blueRem}</span>
                </div>
                <div class="cn-progress-track"><div class="cn-progress-fill blue" style="width:${bluePct}%;"></div></div>
                <div class="cn-score-sub">
                  <span>المتبقي</span>
                  <span>مكتشف: ${counts.blueFound}/${counts.blueTotal}</span>
                </div>
              </div>
            </div>

            ${cluePanelHtml}

            <div class="cn-board ${spec.cols === 4 ? "cols-4" : ""}">
              ${cardsHtml}
            </div>

            <div class="cn-toolbar">
              ${spyToggleBtnHtml}
              <button type="button" class="cn-btn cn-btn-sm cn-btn-ghost" onclick="CodenamesGame.openClueHistoryModal()">
                📜 التلميحات (${(state.clueHistory || []).length})
              </button>
              <button type="button" class="cn-btn cn-btn-sm cn-btn-ghost" onclick="CodenamesGame.openSettingsModal()">
                ⚙️ الإعدادات
              </button>
              ${currentPlayer.isHost ? `
                <button type="button" class="cn-btn cn-btn-sm cn-btn-ghost" onclick="CodenamesGame.confirmRestartMatch()">
                  🔄 مباراة جديدة
                </button>
              ` : `
                <button type="button" class="cn-btn cn-btn-sm cn-btn-ghost" onclick="CodenamesGame.openHowToPlayModal()">
                  📖 طريقة اللعب
                </button>
              `}
            </div>
          </div>
        `;

        if (activeClueInputFocused) {
          const inp = document.getElementById("cn-clue-word-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }
      },

      /* =====================================================================
         4. شاشة نهاية المباراة (Finished Screen)
         ===================================================================== */
      renderFinished(room, state, container) {
        const counts = this.getCounts(state);
        const winner = state.winner || "red";
        const loser = winner === "red" ? "blue" : "red";
        const winnerName = this.getTeamName(state, winner);
        const loserName = this.getTeamName(state, loser);
        const isAssassin = (state.endReason === "assassin");
        const spec = this.getGridSpec(state.gridSize || "5x5");

        const bannerCls = isAssassin ? "assassin-end" : (winner === "red" ? "win-red" : "win-blue");
        const headline = isAssassin
          ? `☠️ انتهت المباراة — فوز ${this.escapeHtml(winnerName)}`
          : `🏆 مبروك! فاز ${this.escapeHtml(winnerName)}`;
        const subtext = isAssassin
          ? `خسر ${this.escapeHtml(loserName)} فورًا بعد كشف كلمة الخطر («${this.escapeHtml(state.assassinWord || "")}»).`
          : `نجح ${this.escapeHtml(winnerName)} في كشف جميع كلماته السرية ببراعة وتفوق استراتيجي!`;

        const words = state.words || [];
        const types = state.types || [];
        const revealed = state.revealed || [];
        const revealedBy = state.revealedBy || {};
        const boardPreview = words.map((w, idx) => {
          const t = types[idx];
          const cls = t === "red" ? "rev-red" : (t === "blue" ? "rev-blue" : (t === "assassin" ? "rev-assassin" : "rev-neutral"));
          const dim = revealed[idx] ? "" : "opacity:0.62; border-style:dashed;";
          const picker = revealedBy[String(idx)] || "";
          const mark = t === "assassin" ? "☠️" : (revealed[idx] ? "✓" : "");
          const tagHtml = picker
            ? `<span class="cn-picker-badge">${mark} ${this.escapeHtml(picker)}</span>`
            : (mark ? `<span class="cn-card-tag">${mark}</span>` : "");
          return `
            <div class="cn-card is-revealed ${cls}" style="min-height:46px; font-size:0.74rem; ${dim}">
              <span>${this.escapeHtml(w)}</span>
              ${tagHtml}
            </div>
          `;
        }).join("");

        container.innerHTML = `
          <div id="cn-root">
            <div class="cn-finish-banner ${bannerCls}">
              <div style="font-size:2.4rem; margin-bottom:6px;">${isAssassin ? "☠️" : "🎉"}</div>
              <h2 style="font-size:1.35rem; font-weight:900; color:#f8fafc; margin-bottom:6px;">${headline}</h2>
              <p style="font-size:0.86rem; color:#cbd5e1; line-height:1.6;">${subtext}</p>

              <div class="cn-summary-grid">
                <div class="cn-summary-stat">
                  <strong style="color:#fca5a5;">${counts.redFound}/${counts.redTotal}</strong>
                  <span>${this.escapeHtml(state.redName || "الأحمر")}</span>
                </div>
                <div class="cn-summary-stat">
                  <strong style="color:#93c5fd;">${counts.blueFound}/${counts.blueTotal}</strong>
                  <span>${this.escapeHtml(state.blueName || "الأزرق")}</span>
                </div>
                <div class="cn-summary-stat">
                  <strong style="color:#fbbf24;">${(state.clueHistory || []).length}</strong>
                  <span>إجمالي التلميحات</span>
                </div>
              </div>
            </div>

            <div class="cn-panel">
              <div class="cn-panel-head">
                <span>🗺️ الخريطة الكاملة للمباراة</span>
                <button type="button" class="cn-mini-chip" onclick="CodenamesGame.openClueHistoryModal()">📜 سجل التلميحات</button>
              </div>
              <div class="cn-board ${spec.cols === 4 ? "cols-4" : ""}">
                ${boardPreview}
              </div>
            </div>

            ${currentPlayer.isHost ? `
              <div class="cn-splash-row">
                <button type="button" class="cn-btn cn-btn-primary" onclick="CodenamesGame.startNewMatch()">
                  🔄 لعبة جديدة
                </button>
                <button type="button" class="cn-btn cn-btn-ghost" onclick="CodenamesGame.backToSplash()">
                  🏠 العودة إلى الرئيسية
                </button>
              </div>
              <button type="button" class="cn-btn cn-btn-ghost cn-btn-sm" onclick="CodenamesGame.goToSetup()">
                ⚙️ تعديل إعدادات الفرق والمؤقت
              </button>
            ` : `
              <div style="text-align:center; font-size:0.84rem; color:#94a3b8; padding:8px;">
                بانتظار المضيف لبدء لعبة جديدة...
              </div>
            `}
          </div>
        `;
      },

      /* =====================================================================
         5. منطق اللعبة والعمليات على Firebase Firestore
         ===================================================================== */
      async goToSetup() {
        if (!currentPlayer.isHost) return;
        this.playSound("tap");
        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "setup"
          });
        } catch (err) {
          alert("تعذر الانتقال للإعدادات: " + err.message);
        }
      },

      async backToSplash() {
        if (!currentPlayer.isHost) return;
        this.playSound("tap");
        this.stopTimerLoop();
        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.phase": "splash"
          });
        } catch (err) {
          alert("تعذر العودة للرئيسية: " + err.message);
        }
      },

      async startNewMatch() {
        if (!currentPlayer.isHost || !latestRoomData) return;
        this.loadPrefs();
        this.playSound("tap");

        const d = this.setupDraft;
        if (d.playMode === "room") {
          const hasRedSpy = Boolean(d.spymasters && d.spymasters.red);
          const hasBlueSpy = Boolean(d.spymasters && d.spymasters.blue);
          if (hasRedSpy !== hasBlueSpy) {
            alert("⚠️ يرجى تعيين قائد لكل فريق (الأحمر والأزرق معاً)، أو إلغاء تعيين القادة للعب المفتوح.");
            return;
          }
        }
        const redName = (d.redName || "").trim() || "الفريق الأحمر";
        const blueName = (d.blueName || "").trim() || "الفريق الأزرق";
        const spec = this.getGridSpec(d.gridSize);

        const startingTeam = (d.startingTeam === "red" || d.startingTeam === "blue")
          ? d.startingTeam
          : (Math.random() < 0.5 ? "red" : "blue");
        const secondTeam = startingTeam === "red" ? "blue" : "red";

        /* اختيار كلمات عشوائية غير مكررة من بنك الكلمات */
        const pool = [...this.WORD_BANK];
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = pool[i];
          pool[i] = pool[j];
          pool[j] = tmp;
        }
        const words = pool.slice(0, spec.total);

        /* توزيع الأنواع السرية بدقة وخلطها عشوائياً */
        const types = [];
        for (let i = 0; i < spec.startTeam; i++) types.push(startingTeam);
        for (let i = 0; i < spec.otherTeam; i++) types.push(secondTeam);
        for (let i = 0; i < spec.neutral; i++) types.push("neutral");
        types.push("assassin");

        for (let i = types.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = types[i];
          types[i] = types[j];
          types[j] = tmp;
        }

        const revealed = new Array(spec.total).fill(false);

        const presetDurs = this.getPresetDurations(d.timerMode);
        const timerCfg = {
          mode: d.timerMode,
          spymasterSec: presetDurs.spymasterSec,
          operativeSec: presetDurs.operativeSec,
          firstClueBonusSec: presetDurs.firstClueBonusSec
        };

        const initialTimer = this.buildTurnTimerPayload(timerCfg, "spymaster_clue", true);

        const nextState = {
          phase: "playing",
          matchId: "cn_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          redName,
          blueName,
          gridSize: d.gridSize,
          playMode: d.playMode,
          teamAssignments: d.playMode === "room" ? { ...d.teamAssignments } : {},
          spymasters: d.playMode === "room" ? { ...d.spymasters } : { red: "", blue: "" },
          startingTeam,
          currentTeam: startingTeam,
          turnStage: "spymaster_clue",
          turnId: 1,
          words,
          types,
          revealed,
          nominations: {},
          revealedBy: {},
          currentClue: null,
          guessesLeft: 0,
          clueHistory: [],
          firstClueUsed: { red: false, blue: false },
          timer: initialTimer,
          winner: "",
          endReason: "",
          assassinWord: ""
        };

        this.isSpymasterView = (d.playMode === "room" && (d.spymasters.red === currentPlayer.id || d.spymasters.blue === currentPlayer.id));
        this.clueDraftWord = "";
        this.clueDraftCount = 1;
        this.lastRevealedIdx = -1;
        this.lastKnownRevealedCount = 0;
        this.lastExpiredChimeKey = "";
        this.endingTurnLockKey = "";

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            gameState: nextState
          });
        } catch (err) {
          alert("تعذر بدء المباراة: " + err.message);
        }
      },

      confirmRestartMatch() {
        if (!currentPlayer.isHost) return;
        if (!confirm("هل تريد بدء مباراة جديدة بكلمات وتوزيع جديد؟")) return;
        this.startNewMatch();
      },

      stepClueCount(delta, maxNum) {
        const next = Math.max(1, Math.min(maxNum, (this.clueDraftCount || 1) + delta));
        this.clueDraftCount = next;
        const el = document.getElementById("cn-clue-count-val");
        if (el) el.innerText = String(next);
      },

      async submitClue() {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        if (!this.canSubmitCurrentClue(state)) return;

        const inp = document.getElementById("cn-clue-word-input");
        const word = (inp ? inp.value : this.clueDraftWord).trim();
        if (!word) {
          alert("يرجى كتابة كلمة التلميح أولاً.");
          return;
        }
        if (/^[0-9٠-٩\s]+$/.test(word)) {
          alert("لا يمكن أن يكون التلميح أرقاماً فقط؛ اكتب كلمة عربية واضحة.");
          return;
        }
        if (word.split(/\s+/).length > 2) {
          alert("التلميح يجب أن يكون كلمة واحدة (أو كلمتين كحد أقصى).");
          return;
        }

        const unrevealedWords = (state.words || []).filter((w, i) => !(state.revealed || [])[i]);
        const normalizedClue = word.toLowerCase();
        if (unrevealedWords.some(w => w.trim().toLowerCase() === normalizedClue)) {
          alert("لا يجوز استخدام كلمة موجودة حرفياً على اللوحة كتلميح!");
          return;
        }

        const counts = this.getCounts(state);
        const teamRem = state.currentTeam === "red" ? counts.redRem : counts.blueRem;
        const count = parseInt(this.clueDraftCount, 10);
        if (isNaN(count) || count < 1 || count > teamRem) {
          alert(`يرجى اختيار عدد صحيح بين 1 و ${teamRem}.`);
          return;
        }

        const nextTurnId = (state.turnId || 1) + 1;
        const firstClueUsed = { ...(state.firstClueUsed || { red: false, blue: false }) };
        firstClueUsed[state.currentTeam] = true;

        const nextTimer = this.buildTurnTimerPayload(state.timer, "operative_guess", false);
        const nextHistory = [
          ...(state.clueHistory || []),
          {
            team: state.currentTeam,
            word,
            count,
            turn: (state.clueHistory || []).length + 1,
            leaderName: currentPlayer.name || "",
            picks: []
          }
        ];

        this.playSound("tap");
        this.clueDraftWord = "";
        this.clueDraftCount = 1;

        /* في وضع الجهاز الواحد نخفي خريطة القائد تلقائياً بعد إرسال التلميح لحماية السرية */
        if (!this.isAssignedSpymaster(state)) {
          this.isSpymasterView = false;
        }

        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.turnStage": "operative_guess",
            "gameState.turnId": nextTurnId,
            "gameState.currentClue": { word, count },
            "gameState.guessesLeft": count + 1,
            "gameState.firstClueUsed": firstClueUsed,
            "gameState.clueHistory": nextHistory,
            "gameState.nominations": {},
            "gameState.timer": nextTimer
          });
        } catch (err) {
          alert("تعذر إرسال التلميح: " + err.message);
        }
      },

      async toggleCardNomination(idx) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        /* يمنع القائد وغير المخوّلين من التفكير أو تحديد البطاقات */
        if (!this.canClickCardsNow(state)) return;

        const revealed = state.revealed || [];
        if (idx < 0 || idx >= revealed.length || revealed[idx]) return;

        const safePid = String(currentPlayer.id || "").replace(/[^a-zA-Z0-9_-]/g, "_");
        const existingMap = (state.nominations && state.nominations[String(idx)]) || {};
        const alreadyMarked = Boolean(existingMap[safePid]);

        this.playSound("tap");
        this.vibrate(25);

        const fieldPath = `gameState.nominations.${idx}.${safePid}`;
        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            [fieldPath]: alreadyMarked
              ? RTDB_FIELD_VALUE.delete()
              : (currentPlayer.name || "لاعب")
          });
        } catch (err) {
          alert("تعذر تحديث علامة التفكير: " + err.message);
        }
      },

      async revealCard(idx) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        if (!this.canClickCardsNow(state)) return;
        if (this._revealingIdx === idx) return;

        const revealed = [...(state.revealed || [])];
        if (idx < 0 || idx >= revealed.length || revealed[idx]) return;

        this._revealingIdx = idx;
        const types = state.types || [];
        const words = state.words || [];
        const cardType = types[idx];
        const curTeam = state.currentTeam;
        const oppTeam = curTeam === "red" ? "blue" : "red";
        const pickerName = currentPlayer.name || "لاعب";
        const pickerPath = `gameState.revealedBy.${idx}`;

        revealed[idx] = true;
        this.lastRevealedIdx = idx;

        /* توثيق البطاقة المختارة (صحيحة أو خطأ + اسم من اختارها) داخل سجل التلميح الحالي */
        const nextHistory = (state.clueHistory || []).map(item => ({
          ...item,
          picks: Array.isArray(item.picks) ? [...item.picks] : []
        }));
        if (nextHistory.length > 0) {
          const lastEntry = nextHistory[nextHistory.length - 1];
          lastEntry.picks.push({
            word: words[idx] || "",
            type: cardType,
            correct: cardType === curTeam,
            by: pickerName
          });
        }

        try {
          /* 1. كلمة الخطر: خسارة فورية للفريق الحالي وفوز الفريق المنافس */
          if (cardType === "assassin") {
            this.playSound("assassin");
            this.vibrate([180, 70, 240]);
            await db.collection("rooms").doc(currentRoomCode).update({
              "gameState.revealed": revealed,
              [pickerPath]: pickerName,
              "gameState.clueHistory": nextHistory,
              "gameState.nominations": {},
              "gameState.phase": "finished",
              "gameState.winner": oppTeam,
              "gameState.endReason": "assassin",
              "gameState.assassinWord": words[idx] || ""
            });
            return;
          }

          /* حساب المتبقي بعد كشف هذه البطاقة */
          let redRem = 0, blueRem = 0;
          for (let i = 0; i < types.length; i++) {
            if (!revealed[i]) {
              if (types[i] === "red") redRem++;
              else if (types[i] === "blue") blueRem++;
            }
          }

          /* 2. فحص الفوز المباشر لأي فريق وصل متبقيه إلى صفر */
          if (redRem === 0 || blueRem === 0) {
            const winnerTeam = redRem === 0 ? "red" : "blue";
            this.playSound(winnerTeam === curTeam ? "win" : "wrong");
            this.vibrate(winnerTeam === curTeam ? [80, 50, 120] : [110, 55, 140]);
            await db.collection("rooms").doc(currentRoomCode).update({
              "gameState.revealed": revealed,
              [pickerPath]: pickerName,
              "gameState.clueHistory": nextHistory,
              "gameState.nominations": {},
              "gameState.phase": "finished",
              "gameState.winner": winnerTeam,
              "gameState.endReason": "all_found"
            });
            return;
          }

          /* 3. كلمة تابعة للفريق الحالي */
          if (cardType === curTeam) {
            const nextGuesses = Math.max(0, (state.guessesLeft || 1) - 1);
            this.playSound("correct");
            this.vibrate(45);

            if (nextGuesses === 0) {
              const nextTurnId = (state.turnId || 1) + 1;
              const isFirstNext = !(state.firstClueUsed && state.firstClueUsed[oppTeam]);
              const nextTimer = this.buildTurnTimerPayload(state.timer, "spymaster_clue", isFirstNext);
              await db.collection("rooms").doc(currentRoomCode).update({
                "gameState.revealed": revealed,
                [pickerPath]: pickerName,
                "gameState.clueHistory": nextHistory,
                "gameState.nominations": {},
                "gameState.currentTeam": oppTeam,
                "gameState.turnStage": "spymaster_clue",
                "gameState.turnId": nextTurnId,
                "gameState.currentClue": null,
                "gameState.guessesLeft": 0,
                "gameState.timer": nextTimer
              });
            } else {
              /* تبقى علامات التفكير على البطاقات الأخرى وتُحذف من البطاقة المكشوفة فقط */
              await db.collection("rooms").doc(currentRoomCode).update({
                "gameState.revealed": revealed,
                [pickerPath]: pickerName,
                "gameState.clueHistory": nextHistory,
                [`gameState.nominations.${idx}`]: RTDB_FIELD_VALUE.delete(),
                "gameState.guessesLeft": nextGuesses
              });
            }
            return;
          }

          /* 4. كلمة محايدة أو تابعة للفريق المنافس -> ينتهي الدور فوراً */
          this.playSound(cardType === "neutral" ? "neutral" : "wrong");
          this.vibrate(cardType === "neutral" ? 35 : [90, 50, 110]);

          const nextTurnId = (state.turnId || 1) + 1;
          const isFirstNext = !(state.firstClueUsed && state.firstClueUsed[oppTeam]);
          const nextTimer = this.buildTurnTimerPayload(state.timer, "spymaster_clue", isFirstNext);

          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.revealed": revealed,
            [pickerPath]: pickerName,
            "gameState.clueHistory": nextHistory,
            "gameState.nominations": {},
            "gameState.currentTeam": oppTeam,
            "gameState.turnStage": "spymaster_clue",
            "gameState.turnId": nextTurnId,
            "gameState.currentClue": null,
            "gameState.guessesLeft": 0,
            "gameState.timer": nextTimer
          });
        } catch (err) {
          alert("تعذر كشف البطاقة: " + err.message);
        } finally {
          this._revealingIdx = null;
        }
      },

      async endOperativeTurn(expectedTurnId) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        if (state.phase !== "playing" || state.turnStage !== "operative_guess") return;
        await this.performAtomicTurnSwitch(expectedTurnId, "manual");
      },

      /* إنهاء الدور عبر علامة الصح (✓) للفريق المنافس بعد انتهاء الوقت فقط */
      async endTurnByTimerExpiry(expectedTurnId) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        if (state.phase !== "playing" || !state.timer || state.timer.mode === "off") return;
        if (!this.canEndTurnByExpiry(state)) return;

        /* التحقق الصارم أن الوقت انتهى فعلاً */
        const remMs = this.computeRemainingMs(state.timer);
        if (remMs > 0 || state.timer.paused) return;

        await this.performAtomicTurnSwitch(expectedTurnId, "timer");
      },

      /* منع إنهاء الدور مرتين أو تكرار الانتقال عبر قفل + Transaction */
      async performAtomicTurnSwitch(expectedTurnId, endReason) {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        const lockKey = `${state.matchId || ""}_${expectedTurnId}`;
        if (this.endingTurnLockKey === lockKey) return;
        if (state.turnId !== expectedTurnId) return;

        this.endingTurnLockKey = lockKey;
        this.playSound("turn");
        this.vibrate(50);

        const reason = endReason === "timer" ? "timer" : "manual";
        const enderName = (currentPlayer && currentPlayer.name) ? currentPlayer.name : "لاعب";

        const roomRef = db.collection("rooms").doc(currentRoomCode);
        try {
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(roomRef);
            if (!snap.exists) return;
            const liveState = snap.data().gameState || {};
            if (liveState.phase !== "playing" || liveState.turnId !== expectedTurnId) return;

            const oppTeam = liveState.currentTeam === "red" ? "blue" : "red";
            const isFirstNext = !(liveState.firstClueUsed && liveState.firstClueUsed[oppTeam]);
            const nextTimer = this.buildTurnTimerPayload(liveState.timer, "spymaster_clue", isFirstNext);

            const enderTeam = this.getMyTeam(liveState) || "";
            const enderTeamName = (enderTeam === "red" || enderTeam === "blue")
              ? this.getTeamName(liveState, enderTeam)
              : "";
            const endedByObj = {
              name: enderName,
              reason: reason,
              team: enderTeam,
              teamName: enderTeamName
            };

            const nextHistory = (liveState.clueHistory || []).map(item => ({
              ...item,
              picks: Array.isArray(item.picks) ? [...item.picks] : []
            }));

            if (liveState.turnStage === "operative_guess" && nextHistory.length > 0) {
              const lastEntry = nextHistory[nextHistory.length - 1];
              lastEntry.endedBy = endedByObj;
            } else if (liveState.turnStage === "spymaster_clue") {
              nextHistory.push({
                team: liveState.currentTeam,
                word: "",
                count: 0,
                turn: nextHistory.length + 1,
                leaderName: "",
                picks: [],
                skippedNoClue: true,
                endedBy: endedByObj
              });
            }

            tx.update(roomRef, {
              "gameState.currentTeam": oppTeam,
              "gameState.turnStage": "spymaster_clue",
              "gameState.turnId": expectedTurnId + 1,
              "gameState.currentClue": null,
              "gameState.guessesLeft": 0,
              "gameState.nominations": {},
              "gameState.clueHistory": nextHistory,
              "gameState.timer": nextTimer
            });
          });
        } catch (err) {
          this.endingTurnLockKey = "";
          alert("تعذر انتقال الدور: " + err.message);
        }
      },

      async toggleTimerPause() {
        if (!latestRoomData || !latestRoomData.gameState) return;
        const state = latestRoomData.gameState;
        if (state.phase !== "playing" || !state.timer || state.timer.mode === "off") return;
        if (!this.canControlTimer(state)) return;

        const t = { ...state.timer };
        if (t.paused) {
          const rem = Math.max(0, t.pausedRemainingMs || 0);
          t.paused = false;
          t.endAt = getServerNow() + rem;
          t.pausedRemainingMs = 0;
        } else {
          const rem = this.computeRemainingMs(t);
          /* منع إيقاف المؤقت بعد وصوله إلى 00:00 حتى لا يختفي زر إنهاء الدور */
          if (rem <= 0) return;
          t.paused = true;
          t.pausedRemainingMs = rem;
          t.endAt = 0;
        }

        this.playSound("tap");
        try {
          await db.collection("rooms").doc(currentRoomCode).update({
            "gameState.timer": t
          });
        } catch (err) {
          alert("تعذر تعديل حالة المؤقت: " + err.message);
        }
      },

        if (modal) return modal;
        modal = document.createElement("div");
        modal.id = "cn-modal-backdrop";
        modal.className = "modal-backdrop";
        modal.onclick = (e) => {
          if (e.target === modal) this.closeModal();
        };
        modal.innerHTML = `<div class="modal-content" id="cn-modal-content" onclick="event.stopPropagation()"></div>`;
        document.body.appendChild(modal);
        return modal;
      },

        const box = document.getElementById("cn-modal-content");
        box.innerHTML = `

        modal.classList.add("active");

        const modal = document.getElementById("cn-modal-backdrop");
        if (modal) modal.classList.remove("active");

    const MafiaGame = {
      /* توليد أوراق البطة كاملة (الجوكر في الأعلى ثم كل رتبة في صف من 4 أوراق = 54 بطاقة) */
      CARD_DECK: (function buildFullDeck() {
        const suits = [
          { code: "S", suit: "♠", color: "#0f172a" },
          { code: "H", suit: "♥", color: "#dc2626" },
          { code: "D", suit: "♦", color: "#dc2626" },

        ];
        const ranks = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
        const defaultRolesMap = {
          "AS": "مافيا",
          "KS": "زعيم المافيا",
          "QS": "مافيا",
          "JS": "قاتل مأجور",
          "AH": "الطبيب",
          "KH": "المحقق",
          "QH": "حارس شخصي",
          "KD": "العمدة",
          "QD": "الساحرة",
          "AC": "القناص",
          "JC": "الجاسوس"
        };
        const deck = [
          { id: "JR", rank: "★", suit: "🃏", suitCode: "J", color: "#dc2626", defaultRole: "المهرج" },
          { id: "JB", rank: "★", suit: "🃏", suitCode: "J", color: "#0f172a", defaultRole: "مافيا" }
        ];
        ranks.forEach(r => {
          suits.forEach(s => {
            const id = r + s.code;
            deck.push({
              id: id,
              rank: r,
              suit: s.suit,
              suitCode: s.code,
              color: s.color,
              defaultRole: defaultRolesMap[id] || "مواطن"
            });
          });
        });
        return deck;
      })(),

      /* حالة محلية لواجهة المضيف واللاعب والحكم */
      hostDraft: {
        roomCode: null,
        refereeId: "",
        selectedCards: [], // [{ cardId, roleName }] مرتبة حسب ترتيب المضيف
        silenceCancelsMafiaKill: false,
        extraKillerEnabled: false
      },
      setupWarning: "",
      isPlayerCardRevealed: false,
      refereeTab: "board", // "board" | "history"
      playerTab: "game",
      activeKillPickerPlayerId: null,
      killPickerDraft: null,   // "game" | "history"
      lastSetupSignature: "",

      /* حالة مؤقت النقاش المحلي الخاص بالحكم */
      timer: {
        initialized: false,
        duration: 30,
        remaining: 30,
        isRunning: false,
        finished: false,
        soundEnabled: true,
        isOpen: false,
        intervalId: null,
        audioCtx: null
      },

      escapeHtml(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      },

      getCardMeta(cardId) {
        return this.CARD_DECK.find(c => c.id === cardId) || {
          id: cardId, rank: "?", suit: "♠", suitCode: "S", color: "#0f172a", defaultRole: "دور"
        };
      },

      /* توليد صورة SVG لبطاقة البطة بدون الاعتماد على روابط خارجية */
      renderCardSVG(cardId, size) {
        const c = this.getCardMeta(cardId);
        const w = size === "lg" ? 98 : (size === "sm" ? 42 : 58);
        const h = size === "lg" ? 136 : (size === "sm" ? 58 : 80);
        const isJoker = (c.id === "JR" || c.id === "JB");
        const rankSize = c.rank.length > 1 ? 15 : 18;
        const centerSize = isJoker ? 34 : 38;
        const borderCol = c.color === "#dc2626" ? "#fca5a5" : "#94a3b8";
        const jokerTint = isJoker
          ? `<rect x="7" y="7" width="66" height="98" rx="6" fill="${c.color}" fill-opacity="0.09" stroke="${c.color}" stroke-opacity="0.35" stroke-width="1.2"/>`
          : `<rect x="7" y="7" width="66" height="98" rx="6" fill="none" stroke="${c.color}" stroke-opacity="0.18" stroke-width="1"/>`;

        return `
          <svg width="${w}" height="${h}" viewBox="0 0 80 112" xmlns="http://www.w3.org/2000/svg" style="display:block; flex-shrink:0; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45));">
            <rect x="2" y="2" width="76" height="108" rx="9" fill="#f8fafc" stroke="${borderCol}" stroke-width="2.2"/>
            ${jokerTint}
            <text x="15" y="24" font-family="system-ui, sans-serif" font-size="${rankSize}" font-weight="900" fill="${c.color}" text-anchor="middle">${c.rank}</text>
            <text x="15" y="38" font-family="system-ui, sans-serif" font-size="13" fill="${c.color}" text-anchor="middle">${c.suit}</text>
            <text x="40" y="68" font-family="system-ui, sans-serif" font-size="${centerSize}" fill="${c.color}" text-anchor="middle">${c.suit}</text>
            <text x="65" y="99" font-family="system-ui, sans-serif" font-size="${rankSize}" font-weight="900" fill="${c.color}" text-anchor="middle">${c.rank}</text>
          </svg>
        `;
      },

      /* حفظ الجلسة والبيانات في التخزين المحلي */
      saveLocalSession(roomCode, state) {
        if (!roomCode) return;
        try {
          localStorage.setItem("eshrah_mafia_state_" + roomCode, JSON.stringify({
            savedAt: Date.now(),
            state: state
          }));
        } catch (e) {}
      },

      saveHostDraftLocal() {
        if (!currentRoomCode) return;
        try {
          localStorage.setItem("eshrah_mafia_draft_" + currentRoomCode, JSON.stringify(this.hostDraft));
        } catch (e) {}
      },

      loadHostDraftLocal(roomCode) {
        if (this.hostDraft.roomCode === roomCode) return;
        this.hostDraft = {
          roomCode: roomCode,
          refereeId: "",
          selectedCards: [],
          silenceCancelsMafiaKill: false,
          extraKillerEnabled: false,
          step: 1
        };
        try {
          const raw = localStorage.getItem("eshrah_mafia_draft_" + roomCode);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.roomCode === roomCode) {
              this.hostDraft = {
                roomCode: roomCode,
                refereeId: parsed.refereeId || "",
                selectedCards: Array.isArray(parsed.selectedCards) ? parsed.selectedCards : [],
                silenceCancelsMafiaKill: Boolean(parsed.silenceCancelsMafiaKill),
                extraKillerEnabled: Boolean(parsed.extraKillerEnabled),
                step: 1
              };
            }
          }
        } catch (e) {}
      },

      formatRoundEmoji(num) {
        const map = ["", "1️⃣", "2️⃣", "3️⃣", "4️⃣", "5️⃣", "6️⃣", "7️⃣", "8️⃣", "9️⃣", "🔟"];
        const n = parseInt(num, 10) || 1;
        if (n >= 1 && n <= 10) return map[n];
        return `(${n})`;
      },

      isMafiaRole(roleName) {
        const norm = String(roleName || "")
          .toLowerCase()
          .replace(/[ً-ٰٟـ]/g, "")
          .replace(/[أإآ]/g, "ا")
          .replace(/ة/g, "ه");
        return norm.includes("مافيا") || norm.includes("مافيه") || norm.includes("mafia");
      },

      getRules(state) {
        const r = (state && state.rules) || {};
        return {
          silenceCancelsMafiaKill: Boolean(r.silenceCancelsMafiaKill),
          extraKillerEnabled: Boolean(r.extraKillerEnabled)
        };
      },

      formatKilledLine(names) {
        if (!names || names.length === 0) return "💀 لم يُقتل أحد";
        const joined = names.map(n => this.escapeHtml(n)).join("، ");
        return names.length === 1 ? `💀 ${joined} مقتول` : `💀 ${joined} مقتولين`;
      },

      formatSilencedLine(names) {
