<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="ashrah-theme-color" content="#faf2db" />
  <title>عشرة — منصة الألعاب الجماعية</title>

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #ca8a04;
      --border: #334155;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      margin-top: 10px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: #0b1120;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary { background-color: var(--accent); color: #0b1120; }
    .btn-primary:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #334155; color: var(--text-main); margin-top: 10px; }
    .btn-danger { background-color: var(--danger); color: white; }

    /* شاشة الغرفة */
    .room-header {
      background: #0b1120;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
    }

    .room-code {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--accent);
      user-select: all;
    }

    .player-list {
      list-style: none;
      margin-bottom: 20px;
      max-height: 240px;
      overflow-y: auto;
    }

    .player-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0b1120;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .player-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge-host { background-color: var(--warning); color: white; }
    .badge-you { background-color: #0284c7; color: white; }

    .kick-btn {
      background: none;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .games-selector {
      margin-bottom: 20px;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .app-footer {
      text-align: center;
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* === EXTRA_STYLES_START === */
    /* تنسيقات النقطة اللحظية وزر المغادرة */
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-left: 8px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .status-dot.online {
      background-color: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }
    .status-dot.offline {
      background-color: #64748b;
      box-shadow: none;
    }
    .btn-leave {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 14px;
      width: 100%;
      transition: all 0.2s;
    }
    .btn-leave:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* الشريط العلوي في شاشات اللعب (سطران مرتبان بدون أي انضغاط) */
    .game-top-bar {
      display: flex;
      flex-direction: column;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      gap: 8px;
      width: 100%;
    }
    .game-top-bar-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .game-top-bar-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
      text-align: right;
    }
    .game-top-bar-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .game-top-bar-btn:active {
      transform: scale(0.96);
    }
    .game-top-bar-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      font-size: 0.82rem;
    }
    .game-top-bar-user {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      font-weight: 600;
    }
    .badge-role {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-role.host {
      background-color: var(--warning);
      color: #fff;
    }
    .badge-role.player {
      background-color: #334155;
      color: var(--text-muted);
    }
    .game-top-bar-pin {
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      font-family: monospace;
      font-weight: bold;
    }

    /* إلغاء الإطار الخارجي الكبير في شاشة اللعب وتوسيط الواجهة في منتصف الشاشة */
    #screen-game {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
    }
    #screen-game.active {
      display: flex;
      flex-direction: column;
      min-height: 78vh;
    }
    #game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      text-align: center;
      padding: 10px 0;
    }
    #game-container > * {
      width: 100%;
    }

    /* نافذة منبثقة لحالة اللاعبين أثناء اللعب */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      padding: 18px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.2s ease;
    }
    @keyframes modalFadeIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .modal-header h3 {
      font-size: 1.05rem;
      color: var(--accent);
    }
    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }
    .modal-close-btn:hover {
      color: var(--danger);
    }
    /* === MAFIA_CSS_START === */

    /* =====================================================================
       تنسيقات لعبة المافيا (اللعبة الثانية) - طابع داكن وغامض ومتجاوب
       ===================================================================== */
    .mafia-wrap {
      width: 100%;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mafia-banner {
      background: linear-gradient(135deg, rgba(127, 29, 29, 0.38), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .mafia-banner h3 {
      color: #fca5a5;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .mafia-banner p {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .mafia-panel {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .mafia-panel-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .mafia-stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .mafia-stat-box {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }
    .mafia-stat-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent);
      display: block;
    }
    .mafia-stat-val.done {
      color: #22c55e;
    }
    .mafia-stat-val.warn {
      color: #f59e0b;
    }
    .mafia-stat-lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    /* اختيار الحكم */
    .mafia-ref-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .mafia-ref-chip {
      flex: 1 1 45%;
      background: #111827;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .mafia-ref-chip.selected {
      background: rgba(202, 138, 4, 0.2);
      border-color: #eab308;
      color: #fde047;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.25);
    }
    /* شبكة بطاقات البطة الكاملة (54 بطاقة: الجوكر بالأعلى ثم كل رتبة في صف من 4) */
    .mafia-deck-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-height: 330px;
      overflow-y: auto;
      padding: 6px 2px;
    }
    .mafia-joker-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 2px;
      border-bottom: 1px dashed rgba(51, 65, 85, 0.75);
    }
    .mafia-joker-row .mafia-card-pick {
      width: calc((100% - 24px) / 4);
    }
    .mafia-card-pick {
      position: relative;
      background: #111827;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 6px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
      user-select: none;
    }
    .mafia-card-pick:active {
      transform: scale(0.95);
    }
    .mafia-card-pick.selected {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.14);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.35);
    }
    .mafia-card-pick.disabled-pick {
      opacity: 0.42;
    }
    .mafia-card-check {
      position: absolute;
      top: -6px;
      left: -6px;
      min-width: 22px;
      height: 22px;
      padding: 0 4px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-size: 0.72rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    /* قائمة تعديل وترتيب الأدوار */
    .mafia-role-edit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    .mafia-role-edit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .mafia-role-edit-row input {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.9rem;
      border-radius: 8px;
    }
    .mafia-order-controls {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .mafia-order-btn {
      width: 30px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .mafia-order-btn:active {
      transform: scale(0.92);
    }
    .mafia-order-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .mafia-order-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 900;
    }
    .mafia-remove-card-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #f87171;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-weight: 800;
      flex-shrink: 0;
    }
    /* تنبيه مضمّن */
    .mafia-alert-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.82rem;
      text-align: center;
      line-height: 1.5;
    }
    .mafia-alert-box.danger {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
    }
    .mafia-alert-box.success {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.45);
      color: #bbf7d0;
    }
    /* صندوق إعلان نتيجة الجولة للاعبين قبل التصويت الشفهي */
    .mafia-round-announce {
      background: linear-gradient(145deg, rgba(127, 29, 29, 0.28), rgba(15, 23, 42, 0.96));
      border: 1.5px solid rgba(239, 68, 68, 0.6);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .mafia-round-announce-title {
      font-size: 0.98rem;
      font-weight: 900;
      color: #fca5a5;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(239, 68, 68, 0.25);
      text-align: center;
    }
    .mafia-round-announce-item {
      background: rgba(11, 17, 32, 0.85);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 8px;
      font-size: 0.86rem;
      line-height: 1.55;
    }
    /* بطاقات اللاعبين في لوحة الحكم */
    .mafia-ref-player-card {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      transition: border-color 0.2s, background 0.2s;
    }
    .mafia-ref-player-card.is-killed {
      border-color: rgba(239, 68, 68, 0.7);
      background: rgba(127, 29, 29, 0.22);
    }
    .mafia-ref-player-card.is-saved {
      border-color: rgba(16, 185, 129, 0.75);
      background: rgba(6, 78, 59, 0.25);
    }
    .mafia-ref-player-card.is-out {
      opacity: 0.72;
      background: #090e1a;
      border-style: dashed;
    }
    .mafia-ref-player-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .mafia-ref-player-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .mafia-ref-player-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .mafia-player-name {
      font-weight: 800;
      font-size: 0.96rem;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mafia-player-role {
      font-size: 0.82rem;
      color: #fbbf24;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mafia-badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }
    /* شارات الحالات */
    .m-badge {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .m-badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .m-badge-killed { background: rgba(239, 68, 68, 0.22); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.45); }
    .m-badge-healed { background: rgba(20, 184, 166, 0.22); color: #2dd4bf; border: 1px solid rgba(20, 184, 166, 0.45); }
    .m-badge-voted { background: rgba(245, 158, 11, 0.22); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .m-badge-out { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; border: 1px solid rgba(100, 116, 139, 0.45); }
    .m-badge-silenced { background: rgba(168, 85, 247, 0.22); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.45); }

    /* أزرار أدوات الحكم في الجولة */
    .mafia-action-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .mafia-act-btn {
      padding: 9px 6px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .mafia-act-btn:active { transform: scale(0.96); }
    .mafia-act-btn.on-silence {
      background: rgba(147, 51, 234, 0.28);
      border-color: #a855f7;
      color: #f3e8ff;
    }
    .mafia-act-btn.on-kill {
      background: rgba(220, 38, 38, 0.32);
      border-color: #ef4444;
      color: #fee2e2;
    }
    .mafia-act-btn.on-heal {
      background: rgba(13, 148, 136, 0.32);
      border-color: #14b8a6;
      color: #ccfbf1;
    }

    /* شاشة التصويت الشفهي (علامة X) */
    .mafia-vote-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .mafia-vote-row.marked-out {
      background: rgba(239, 68, 68, 0.18);
      border-color: #ef4444;
    }
    .mafia-x-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #1e293b;
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .mafia-x-btn.active {
      background: #ef4444;
      border-color: #fca5a5;
      color: #fff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    /* تبويبات لوحة الحكم (الجولة / سجل الجولات / المؤقت) */
    .mafia-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr 0.85fr;
      gap: 6px;
    }
    .mafia-tab-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .mafia-tab-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mafia-timer-trigger {
      color: #fde047;
      border-color: rgba(234, 179, 8, 0.45);
      background: rgba(202, 138, 4, 0.12);
    }
    .mafia-timer-trigger.timer-running {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.18);
    }
    .mafia-timer-trigger.timer-warn {
      color: #fbbf24;
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.2);
    }
    .mafia-timer-trigger.timer-danger {
      color: #fecaca;
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.28);
      animation: mafiaTimerPulse 0.9s infinite;
    }
    @keyframes mafiaTimerPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
      50% { box-shadow: 0 0 12px 2px rgba(239, 68, 68, 0.55); }
    }

    /* نافذة مؤقت النقاش للحكم */
    .mafia-timer-box {
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }
    .mafia-timer-display {
      font-size: 3.1rem;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 2px;
      color: var(--accent);
      line-height: 1.1;
      padding: 10px 0 4px;
      transition: color 0.25s;
    }
    .mafia-timer-display.warn { color: #f59e0b; }
    .mafia-timer-display.danger { color: #ef4444; }
    .mafia-timer-progress-wrap {
      width: 100%;
      height: 10px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .mafia-timer-progress-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.35s linear, background-color 0.25s;
    }
    .mafia-timer-progress-bar.warn { background: #f59e0b; }
    .mafia-timer-progress-bar.danger { background: #ef4444; }
    .mafia-timer-ended-badge {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fecaca;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-weight: 800;
    }
    .mafia-timer-ended-badge.show { display: block; }
    .mafia-timer-presets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .mafia-timer-preset-btn {
      padding: 8px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mafia-timer-preset-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .mafia-timer-custom-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .mafia-timer-step-btn {
      width: 44px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mafia-timer-step-btn:active { transform: scale(0.95); }
    .mafia-timer-custom-input {
      width: 96px !important;
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      padding: 9px 8px !important;
    }
    .mafia-timer-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .mafia-timer-controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mafia-timer-sound-btn {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* سجل الجولات */
    .mafia-log-card {
      background: #111827;
      border: 1px solid var(--border);
      border-right: 4px solid var(--accent);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 0.82rem;
    }
    .mafia-log-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 800;
      color: var(--accent);
    }
    .mafia-log-line {
      margin-bottom: 5px;
      color: var(--text-main);
      line-height: 1.5;
    }
    .mafia-log-line span.lbl {
      color: var(--text-muted);
      font-weight: 700;
    }

    /* بطاقة اللاعب السرية */
    .mafia-secret-card-box {
      border-radius: 14px;
      padding: 22px 16px;
      cursor: pointer;
      user-select: none;
      text-align: center;
      transition: transform 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .mafia-secret-card-box:active {
      transform: scale(0.98);
    }
    .mafia-secret-card-box.hidden-state {
      background: linear-gradient(145deg, #0b1120, #172033);
      border: 2px dashed var(--border);
    }
    .mafia-secret-card-box.revealed-state {
      background: linear-gradient(145deg, rgba(127, 29, 29, 0.28), #0b1120);
      border: 2px solid #ef4444;
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.2);
    }

    /* شاشة كشف الأدوار للاعبين الخارجين فقط */
    .mafia-spectator-box {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(234, 179, 8, 0.45);
      border-radius: 12px;
      padding: 14px;
    }
    .mafia-reveal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }

    .mafia-btn-gold {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #0b1120;
    }
    .mafia-btn-crimson {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
    }
    .mafia-btn-emerald {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* === MAFIA_CSS_END === */
    /* === CODENAMES_CSS_START === */

    /* =====================================================================
       تنسيقات لعبة Codenames | CODE NAMES (اللعبة الثالثة)
       ===================================================================== */
    .app-container:has(#cn-root) {
      max-width: 820px;
      transition: max-width 0.25s ease;
    }

    #cn-root {
      width: 100%;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* خلفية إضاءة خافتة بطابع الألغاز */
    .cn-hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 15%, rgba(239, 68, 68, 0.24), transparent 48%),
        radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.26), transparent 52%),
        linear-gradient(155deg, #0b1224 0%, #111c36 55%, #0a1020 100%);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 18px;
      padding: 26px 18px 22px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .cn-emblem {
      width: 82px;
      height: 82px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.22), rgba(59, 130, 246, 0.22));
      border: 1.5px solid rgba(248, 250, 252, 0.16);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      animation: cnFloat 3.6s ease-in-out infinite;
    }
    @keyframes cnFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .cn-title-ar {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fca5a5 0%, #f8fafc 48%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .cn-title-en {
      font-size: 0.78rem;
      letter-spacing: 4px;
      color: #94a3b8;
      font-weight: 800;
      margin-top: 3px;
      margin-bottom: 12px;
    }
    .cn-tagline {
      font-size: 0.92rem;
      color: #cbd5e1;
      max-width: 380px;
      margin: 0 auto 20px;
      line-height: 1.65;
    }
    .cn-splash-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 340px;
      margin: 0 auto;
    }
    .cn-splash-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* أزرار مخصصة لCodenames */
    .cn-btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease, border-color 0.2s ease;
      user-select: none;
    }
    .cn-btn:active { transform: scale(0.97); }
    .cn-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }
    .cn-btn-primary {
      background: linear-gradient(135deg, #ef4444 0%, #7c3aed 52%, #2563eb 100%);
      color: #fff;
      box-shadow: 0 8px 22px rgba(59, 130, 246, 0.28);
    }
    .cn-btn-primary:hover { filter: brightness(1.08); }
    .cn-btn-red {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
    }
    .cn-btn-blue {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
    }
    .cn-btn-ghost {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(148, 163, 184, 0.26);
      color: #e2e8f0;
    }
    .cn-btn-ghost:hover {
      border-color: rgba(56, 189, 248, 0.6);
      color: #fff;
    }
    .cn-btn-amber {
      background: linear-gradient(135deg, #f59e0b, #b45309);
      color: #0b1120;
    }
    .cn-btn-sm {
      padding: 8px 10px;
      font-size: 0.8rem;
      border-radius: 10px;
    }

    /* لوحات الإعداد والمباراة */
    .cn-panel {
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.96), rgba(11, 17, 32, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
    }
    .cn-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      color: #f8fafc;
    }

    /* شاشة إعداد المباراة */
    .cn-setup-teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 420px) {
      .cn-setup-teams { grid-template-columns: 1fr; }
    }
    .cn-team-input-box {
      border-radius: 12px;
      padding: 10px;
      border: 1px solid var(--border);
    }
    .cn-team-input-box.red {
      background: linear-gradient(155deg, rgba(153, 27, 27, 0.28), rgba(11, 17, 32, 0.92));
      border-color: rgba(239, 68, 68, 0.45);
    }
    .cn-team-input-box.blue {
      background: linear-gradient(155deg, rgba(30, 64, 175, 0.3), rgba(11, 17, 32, 0.92));
      border-color: rgba(59, 130, 246, 0.45);
    }
    .cn-team-input-box label {
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .cn-team-input-box.red label { color: #fca5a5; }
    .cn-team-input-box.blue label { color: #93c5fd; }
    .cn-team-input-box input {
      padding: 9px 10px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .cn-seg-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .cn-seg-group.cols-2 { grid-template-columns: 1fr 1fr; }
    .cn-seg-group.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cn-seg-btn {
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: #0b1120;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.16s;
      text-align: center;
    }
    .cn-seg-btn.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.22);
    }
    .cn-seg-btn.active-red {
      background: rgba(239, 68, 68, 0.24);
      border-color: #ef4444;
      color: #fecaca;
    }
    .cn-seg-btn.active-blue {
      background: rgba(59, 130, 246, 0.24);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    /* توزيع اللاعبين والقيادة في الغرفة */
    .cn-roster-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: #0b1120;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 10px;
      padding: 7px 9px;
      margin-bottom: 6px;
    }
    .cn-roster-name {
      font-weight: 700;
      font-size: 0.86rem;
      color: #f8fafc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .cn-roster-btns {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .cn-mini-chip {
      padding: 4px 8px;
      border-radius: 7px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #1e293b;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
    }
    .cn-mini-chip.is-red { background: rgba(239, 68, 68, 0.28); border-color: #ef4444; color: #fecaca; }
    .cn-mini-chip.is-blue { background: rgba(59, 130, 246, 0.28); border-color: #3b82f6; color: #bfdbfe; }
    .cn-mini-chip.is-spy { background: rgba(234, 179, 8, 0.25); border-color: #eab308; color: #fde047; }

    /* لوحة الحالة أثناء اللعب */
    .cn-scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: stretch;
    }
    @media (max-width: 520px) {
      .cn-scoreboard {
        grid-template-columns: 1fr 1fr;
      }
      .cn-turn-hub {
        grid-column: 1 / -1;
        order: -1;
      }
    }
    .cn-score-card {
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      border: 1.5px solid transparent;
      transition: transform 0.2s, box-shadow 0.25s, border-color 0.25s;
    }
    .cn-score-card.red {
      background: linear-gradient(155deg, rgba(153, 27, 27, 0.34), rgba(15, 23, 42, 0.96));
      border-color: rgba(239, 68, 68, 0.35);
    }
    .cn-score-card.blue {
      background: linear-gradient(155deg, rgba(30, 64, 175, 0.36), rgba(15, 23, 42, 0.96));
      border-color: rgba(59, 130, 246, 0.35);
    }
    .cn-score-card.active-red {
      border-color: #ef4444;
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.32);
    }
    .cn-score-card.active-blue {
      border-color: #3b82f6;
      box-shadow: 0 0 22px rgba(59, 130, 246, 0.32);
    }
    .cn-score-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .cn-score-name {
      font-size: 0.84rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cn-score-card.red .cn-score-name { color: #fca5a5; }
    .cn-score-card.blue .cn-score-name { color: #93c5fd; }
    .cn-score-rem {
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1;
      color: #f8fafc;
    }
    .cn-score-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cn-progress-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.85);
      overflow: hidden;
    }
    .cn-progress-fill.red { background: linear-gradient(90deg, #f87171, #ef4444); height: 100%; transition: width 0.35s ease; }
    .cn-progress-fill.blue { background: linear-gradient(90deg, #60a5fa, #2563eb); height: 100%; transition: width 0.35s ease; }

    /* مركز الدور والمؤقت */
    .cn-turn-hub {
      background: linear-gradient(160deg, #0c1428, #131f3b);
      border: 1.5px solid rgba(148, 163, 184, 0.25);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 176px;
      text-align: center;
    }
    .cn-turn-hub.turn-red { border-color: rgba(239, 68, 68, 0.65); }
    .cn-turn-hub.turn-blue { border-color: rgba(59, 130, 246, 0.65); }
    .cn-turn-pill {
      font-size: 0.78rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .cn-turn-pill.red { background: rgba(239, 68, 68, 0.22); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.5); }
    .cn-turn-pill.blue { background: rgba(59, 130, 246, 0.22); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.5); }
    .cn-stage-label {
      font-size: 0.74rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    /* المؤقت الحي */
    .cn-timer-strip {
      width: 100%;
      display: flex;
      flex-direction: column;

    .cn-icon-btn {

    .cn-timer-bar-wrap {

    /* لوحة التلميح */

      font-size: 1.25rem;

      min-width: 34px;

    .cn-clue-num-badge.red { background: #dc2626; box-shadow: 0 0 12px rgba(220, 38, 38, 0.45); }
    .cn-clue-num-badge.blue { background: #2563eb; box-shadow: 0 0 12px rgba(37, 99, 235, 0.45); }

      font-size: 0.78rem;

    /* شبكة بطاقات الكلمات (5×5 / 5×4 / 4×4) */
    .cn-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));

    .cn-card {
      position: relative;
      min-height: 62px;
      padding: 7px 4px;
      border-radius: 11px;
      border: 1.5px solid rgba(148, 163, 184, 0.28);
      background: linear-gradient(165deg, #25334d 0%, #172236 60%, #11192a 100%);
      color: #f8fafc;
      font-size: clamp(0.7rem, 2.75vw, 0.96rem);
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      user-select: none;
      word-break: break-word;
      overflow-wrap: anywhere;
      box-shadow:
        0 4px 0 rgba(7, 11, 20, 0.85),
        0 6px 14px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: transform 0.14s ease, box-shadow 0.18s ease, border-color 0.2s ease, background 0.25s ease;
    }
    @media (min-width: 600px) {
      .cn-card {
        min-height: 80px;
        padding: 10px 8px;
        border-radius: 13px;
      }
    }
    .cn-card:hover:not(.is-revealed):not(.is-locked) {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.65);
      box-shadow:
        0 6px 0 rgba(7, 11, 20, 0.85),
        0 10px 18px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .cn-card:active:not(.is-revealed):not(.is-locked) {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(7, 11, 20, 0.85);
    }
    .cn-card.is-locked:not(.is-revealed) {
      cursor: default;
    }

    /* حالات البطاقات بعد الكشف */
    .cn-card.is-revealed {
      cursor: default;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transform: translateY(1px);
    }
    .cn-card.just-revealed {
      animation: cnCardReveal 0.36s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cnCardReveal {
      0% { transform: scale(0.92) rotateX(24deg); opacity: 0.7; }
      55% { transform: scale(1.04) rotateX(0deg); opacity: 1; }
      100% { transform: scale(1) translateY(1px); opacity: 1; }
    }
    .cn-card.rev-red {
      background: linear-gradient(155deg, #ef4444 0%, #b91c1c 100%);
      border-color: #fca5a5;
      color: #fff;
    }
    .cn-card.rev-blue {
      background: linear-gradient(155deg, #3b82f6 0%, #1d4ed8 100%);
      border-color: #93c5fd;
      color: #fff;
    }
    .cn-card.rev-neutral {
      background: linear-gradient(155deg, #64748b 0%, #475569 100%);
      border-color: #cbd5e1;
      color: #f1f5f9;
      opacity: 0.88;
    }
    .cn-card.rev-assassin {
      background: linear-gradient(155deg, #18181b 0%, #050507 100%);
      border-color: #ef4444;
      color: #fecaca;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.55);

    .cn-card-tag {
      font-size: 0.65rem;
      line-height: 1;
      opacity: 0.92;
    }

    /* ألوان خريطة القائد (تظهر فقط في وضع القائد للبطاقات غير المكشوفة) */
    .cn-card.spy-red {
      background: linear-gradient(160deg, rgba(185, 28, 28, 0.45), rgba(30, 20, 32, 0.96));
      border: 2px solid #ef4444;
      color: #fee2e2;
    }
    .cn-card.spy-blue {
      background: linear-gradient(160deg, rgba(29, 78, 216, 0.46), rgba(18, 26, 48, 0.96));
      border: 2px solid #3b82f6;
      color: #dbeafe;
    }
    .cn-card.spy-neutral {
      background: linear-gradient(160deg, rgba(100, 116, 139, 0.32), rgba(15, 23, 42, 0.96));
      border: 1.5px dashed #94a3b8;

    .cn-spy-banner {
      background: rgba(234, 179, 8, 0.14);

    }

      background: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.38), rgba(15, 23, 42, 0.98) 70%);
      border-color: rgba(59, 130, 246, 0.7);
      box-shadow: 0 14px 32px rgba(59, 130, 246, 0.22);

    /* نافذة إعدادات المؤقت والتعليمات */

    /* === THEME_SYSTEM_V35_START === */
    /* أزرار التبديل بين الوضع الفاتح والداكن */
    #screen-home,

      position: relative;

    .theme-toggle-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text-main);
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.14s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .theme-toggle-btn:active {

      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;

    /* === CODENAMES_V333_TIMER_MODAL_AND_RULE_TEXT_FIX === */

    .cn-rule-item strong {

    /* === CODENAMES_V336_REMOVE_REDUNDANT_LOBBY_BTN === */
    /* === PLATFORM_V337_BRAND_LOGOS === */
    /* 1. قائمة اختيار الألعاب بالشعارات الاحترافية (الوضعان الداكن والفاتح) */
    .lobby-game-preview-btn {
      min-height: 62px;
      padding: 7px 12px;
      border-radius: 13px;

    }
    .lobby-game-preview-btn.game-codenames {
      border-color: rgba(59, 130, 246, 0.55);
      background: linear-gradient(135deg, rgba(30, 64, 175, 0.24), rgba(15, 23, 42, 0.96));
    }
    .lobby-game-preview-btn.game-mafia {
      border-color: rgba(239, 68, 68, 0.55);
      background: linear-gradient(135deg, rgba(153, 27, 27, 0.24), rgba(15, 23, 42, 0.96));
    }
    .lobby-game-preview-btn.game-bra_salfa {
      border-color: rgba(34, 197, 94, 0.55);

    /* 3. شاشة البداية لـ Codenames بالشعار الكبير المتألق */
    .cn-splash-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 2px auto 14px;
    }
    .cn-splash-logo {

    /* === PLATFORM_V338_CENTERED_THEMED_HEADER === */
    /* إعادة تصميم رأس الألعاب: شعار بارز بالمنتصف + ألوان مستوحاة من إطار كل شعار */
    #screen-game .game-top-bar {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      padding: 12px 12px 0;
      margin-bottom: 14px;
      gap: 10px;
      border-width: 1.5px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    #screen-game .game-top-bar::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 76px;
      pointer-events: none;
      background: radial-gradient(ellipse 68% 95% at 50% 0%, rgba(255, 255, 255, 0.2), transparent 72%);
      z-index: 0;
    }
    #screen-game .game-top-bar-main,
    #screen-game .game-top-bar-sub {
      position: relative;
      z-index: 1;
    }

    /* شبكة متماثلة من 3 أعمدة لتوسيط الشعار هندسياً بدقة */
    #screen-game .game-top-bar-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      min-height: 62px;
      width: 100%;
    }
    #screen-game .game-top-bar-side {
      display: inline-flex;
      align-items: center;
      align-self: start;
    }
    #screen-game .game-top-bar-side.side-start {
      justify-self: start;
    }
    #screen-game .game-top-bar-side.side-end {
      justify-self: end;
    }
    #screen-game .game-top-bar-title {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
      min-width: 0;
      flex: initial;
    }
    #screen-game .topbar-game-logo {
      height: 62px;
      width: auto;
      max-width: 186px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

      #screen-game .topbar-game-logo {
        height: 72px;
        max-width: 220px;
      }
    }

    /* شارة الفريق في Codenames تتوسط أسفل الشعار بدون تزاحم */
    #screen-game .cn-topbar-team-pill {
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1.25;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 175px;

    #screen-game .game-top-bar-sub {

       هوية الألوان لكل لعبة (مقتبسة من إطار الشعار في الوضعين الفاتح والداكن)
       ===================================================================== */
    /* 1. عشرة CODENAMES — أزرق ملكي مضيء */
    #screen-game .game-top-bar.game-theme-codenames {
      background:
        radial-gradient(ellipse 75% 85% at 50% 8%, rgba(56, 189, 248, 0.34), transparent 66%),

      background:
        radial-gradient(ellipse 75% 85% at 50% 8%, rgba(56, 189, 248, 0.42), transparent 65%),
        linear-gradient(145deg, #1e3a8a 0%, #1d4ed8 54%, #0369a1 100%);

      background:

        linear-gradient(145deg, #065f46 0%, #15803d 54%, #047857 100%);
