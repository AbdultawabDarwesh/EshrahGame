name: Build Ashrah APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ashrah-android-github.zip -d project
      - run: |
          if [ -f index.html ]; then
            cp index.html project/app/src/main/assets/index.html
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" project/app/build.gradle
          cat << 'EOF' >> project/app/build.gradle
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - working-directory: project
        run: gradle assembleDebug --no-daemon
      - run: cp project/app/build/outputs/apk/debug/app-debug.apk Ashrah-latest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ashrah-APK
          path: Ashrah-latest.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: تطبيق عشرة (آخر إصدار)
          files: Ashrah-latest.apk
          make_latest: true
