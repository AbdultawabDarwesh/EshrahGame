name: Build Ashrah APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o ashrah-android-github.zip -d project
      - run: |
          cat << 'EOF' >> project/app/build.gradle
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - working-directory: project
        run: gradle assembleDebug --no-daemon
      - run: cp project/app/build/outputs/apk/debug/app-debug.apk Ashrah-v3.54.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ashrah-APK
          path: Ashrah-v3.54.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.54
          name: تطبيق عشرة v3.54
          files: Ashrah-v3.54.apk
          make_latest: true
